name: Build vNES for Symbian (.sis)

# ВАЖНО (прочитать перед запуском):
# Этот workflow пытается собрать .sis для Nokia C7 (Symbian^3) через
# Nokia Qt SDK 1.1.2 OFFLINE-инсталлятор (Windows), взятый с архивной
# копии на archive.org:
#   https://archive.org/download/nokia_sdks_n_dev_tools/Qt_SDK_Win_offline_v1_1_2_en.exe
#
# Сборка идёт на windows-latest, т.к. это Windows .exe-инсталлятор.
#
# Запуск инсталлятора с любыми ключами тишины зависал на 15+ минут
# (GUI-диалог, который не реагирует на --silent/-s/--accept-licenses).
# Поэтому вместо запуска мы пробуем распаковать .exe как АРХИВ через
# 7-Zip — многие self-extracting инсталляторы физически являются
# архивом со сплавленным сверху EXE-стабом, и 7-Zip умеет вскрывать
# такие файлы напрямую, без исполнения кода инсталлятора.
#
# Самоподписанный сертификат для .sis генерируется прямо в workflow
# через OpenSSL. Такой .sis ставится на телефон, но с ограниченными
# capability (без доступа к системным API уровня Manufacturer/All-TCB) —
# для игрового эмулятора этого достаточно.

on:
  push:
    branches: [ symbian ]
  workflow_dispatch: {}

env:
  SDK_URL: "https://archive.org/download/nokia_sdks_n_dev_tools/Qt_SDK_Win_offline_v1_1_2_en.exe"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Download Qt/Symbian SDK installer
        run: |
          Write-Host "Скачиваю SDK с $env:SDK_URL ..."
          try {
            Invoke-WebRequest -Uri $env:SDK_URL -OutFile sdk_installer.exe -UseBasicParsing
          } catch {
            Write-Host "::error::Не удалось скачать SDK по указанному URL: $_"
            exit 1
          }
          Get-Item sdk_installer.exe | Select-Object Name, Length

      - name: Try extracting installer as archive (7-Zip) instead of running it
        id: extract
        timeout-minutes: 10
        run: |
          Write-Host "Инсталлятор зависал на GUI при запуске с любыми ключами тишины."
          Write-Host "Пробую вместо запуска просто распаковать .exe как архив через 7-Zip —"
          Write-Host "многие self-extracting и QtIFW-инсталляторы физически являются архивом"
          Write-Host "с добавленным spawn-стабом, и 7-Zip умеет читать содержимое напрямую,"
          Write-Host "без исполнения кода инсталлятора."
          choco install 7zip -y --no-progress | Out-Null
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            Write-Host "::error::7-Zip не установился, дальше пробовать нечем на этом шаге."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path sdk_extracted | Out-Null
          & $sevenZip x sdk_installer.exe -osdk_extracted -y | Tee-Object -FilePath extract.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::7-Zip не смог распаковать .exe как архив (код $LASTEXITCODE)."
            Write-Host "::error::Значит это не самораспаковывающийся архив в чистом виде — придётся искать другой путь установки."
            "extracted=false" >> $env:GITHUB_OUTPUT
            exit 1
          }
          Write-Host "Распаковка прошла успешно. Содержимое:"
          Get-ChildItem -Path sdk_extracted -Recurse | Select-Object -First 200 FullName
          "extracted=true" >> $env:GITHUB_OUTPUT

      - name: Locate qmake / sbs / makesis / signsis
        id: tools
        run: |
          Write-Host "Ищу нужные бинарники в распакованном архиве и стандартных путях установки..."
          $roots = @("sdk_extracted", "C:\QtSDK", "C:\Qt", "$env:LOCALAPPDATA\Qt", "$env:ProgramFiles\Qt", "${env:ProgramFiles(x86)}\Qt")
          function Find-Tool($name) {
            foreach ($r in $roots) {
              if (Test-Path $r) {
                $found = Get-ChildItem -Path $r -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) { return $found.FullName }
              }
            }
            return $null
          }
          $qmake = Find-Tool "qmake.exe"
          $sbs = Find-Tool "sbs.exe"
          $makesis = Find-Tool "makesis.exe"
          $signsis = Find-Tool "signsis.exe"
          Write-Host "qmake: $qmake"
          Write-Host "sbs: $sbs"
          Write-Host "makesis: $makesis"
          Write-Host "signsis: $signsis"
          if (-not $qmake -or -not $sbs -or -not $makesis) {
            Write-Host "::error::Не все инструменты найдены после установки SDK (qmake/sbs/makesis обязательны)."
            Write-Host "::error::Значит offline-инсталлятор не включает полный Symbian^3 toolchain, либо он не установился в тихом режиме."
            exit 1
          }
          "qmake=$qmake" >> $env:GITHUB_OUTPUT
          "sbs=$sbs" >> $env:GITHUB_OUTPUT
          "makesis=$makesis" >> $env:GITHUB_OUTPUT
          "signsis=$signsis" >> $env:GITHUB_OUTPUT

      - name: Generate self-signed cert for signing .sis
        run: |
          New-Item -ItemType Directory -Force -Path cert | Out-Null
          & "C:\Program Files\Git\usr\bin\openssl.exe" req -x509 -newkey rsa:2048 `
            -keyout cert\vnes.key -out cert\vnes.pem -days 3650 -nodes `
            -subj "/CN=vNES Self-Signed/O=vNES/C=RU"
          Write-Host "Сертификат сгенерирован (cert/vnes.pem, cert/vnes.key)."

      - name: Build with qmake + sbs
        working-directory: src
        run: |
          & "${{ steps.tools.outputs.qmake }}" vnes.pro -spec symbian-sbsv2
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::qmake завершился с ошибкой."; exit 1 }
          & "${{ steps.tools.outputs.sbs }}" -c gcce_urel
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::sbs (компиляция) завершилась с ошибкой."; exit 1 }

      - name: Package and sign .sis
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $pkg = Get-ChildItem -Path src -Recurse -Filter "*.pkg" | Select-Object -First 1
          if (-not $pkg) {
            Write-Host "::error::Не найден .pkg файл после сборки — sbs не создал пакет."
            exit 1
          }
          & "${{ steps.tools.outputs.makesis }}" $pkg.FullName build\vnes.sis
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::makesis завершился с ошибкой."; exit 1 }

          $signsis = "${{ steps.tools.outputs.signsis }}"
          if ($signsis) {
            & $signsis -S build\vnes.sis build\vnes_signed.sis cert\vnes.pem cert\vnes.key
            if ($LASTEXITCODE -eq 0) {
              Move-Item -Force build\vnes_signed.sis build\vnes.sis
            } else {
              Write-Host "::warning::signsis завершился с ошибкой, .sis остаётся неподписанным."
            }
          } else {
            Write-Host "::warning::signsis не найден, .sis остаётся неподписанным."
          }
          Get-ChildItem build

      - name: Upload .sis artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnes-sis
          path: build/vnes.sis
          if-no-files-found: error
