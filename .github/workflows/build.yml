name: Build vNES for Symbian (.sis)

# ВАЖНО (прочитать перед запуском):
#
# Предыдущая попытка (через Nokia Qt SDK offline-инсталлятор, .exe) не
# сработала: инсталлятор виснет на GUI-диалоге вне зависимости от ключей
# тишины, а распаковка через 7-Zip не даёт готовых бинарников qmake/sbs/
# makesis — только внутренний payload инсталлятора.
#
# Новый, гораздо более реалистичный путь:
#   1. Собираем сам сборочный тулчейн Symbian (Raptor/sbsv2, sbsv1/abld,
#      makesis, elf2e32 и т.д.) ИЗ ИСХОДНИКОВ репозитория
#      https://github.com/SymbianRevive/symbian-build
#      — это открытый, живой, клонируемый Git-репозиторий, не мёртвый
#      сервер Nokia.
#   2. Скачиваем headers/libs платформы Symbian^3 (PDK 3.0.4a) с архивной
#      копии на archive.org:
#      https://archive.org/download/nokia_sdks_n_dev_tools/PDK_3_0_4_a.zip
#      и раскладываем их в EPOCROOT рядом с symbian-build, как требует
#      README этого репозитория.
#   3. Собираем Raptor (build_raptor.pl), затем компилируем vNES через
#      него из src/group/bld.inf + vnes.mmp — они написаны ВРУЧНУЮ,
#      т.к. изначально их должен был генерировать qmake -spec
#      symbian-sbsv2 из vnes.pro, а Qt SDK для headless-сборки
#      недоступен (см. попытки выше в истории этого файла).
#
#      Заодно Qt-фронтенд (NESWidget.cpp/main.cpp, использовавший
#      QWidget/QPainter/QTimer) заменён на нативный Avkon-фронтенд
#      (src/native/Nes{Application,Document,AppUi,AppView}.cpp) —
#      двигатель эмулятора (NESCPU/NESPPU/NESPAPU/NESMapper/NESMemory/
#      NESROM/NESSystem) уже был нативным Symbian C++ и НЕ менялся.
#      ROM жёстко задан по пути C:\Data\NES\game.nes (без файлового
#      диалога — упрощение для первой версии, см. BUILD_NOTES.md).
#
# ЭТО ДОЛГАЯ СБОРКА. Сама сборка Raptor из исходников занимает
# продолжительное время (README прямо предупреждает "This takes some
# time" дважды) — рассчитывайте на десятки минут, возможно больше часа
# только на тулчейн, до того как дело дойдёт до самого vNES.

on:
  push:
    branches: [ main, symbian ]
  workflow_dispatch: {}

env:
  PDK_URL: "https://archive.org/download/nokia_sdks_n_dev_tools/PDK_3_0_4_a.zip"
  SYMBIAN_BUILD_REPO: "https://github.com/SymbianRevive/symbian-build.git"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free up disk space on the runner
        run: |
          set -e
          # Стандартный ubuntu-latest раннер даёт ~14 ГБ свободного места,
          # а наш пайплайн (клон Raptor, сборка GCC-тулчейна из исходников,
          # распаковка PDK, сборка elf2e32/Raptor) легко превышает этот лимит
          # ("No space left on device" в самом воркере GitHub Actions).
          # Удаляем предустановленный софт, который нам точно не нужен.
          echo "Место на диске до очистки:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune -a -f 2>/dev/null || true
          sudo apt-get clean
          echo "Место на диске после очистки:"
          df -h /

      - name: Checkout vNES sources
        uses: actions/checkout@v4
        with:
          path: vnes-src

      - name: Install build prerequisites
        run: |
          set -e
          echo "Ставлю зависимости для сборки Raptor/sbsv2 (см. README-LINUX)..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bison flex \
            libncurses-dev \
            libbz2-dev \
            libboost-all-dev \
            libxml2-dev \
            perl python3 \
            build-essential \
            g++ gcc \
            cmake \
            unzip zip wget \
            gcc-multilib g++-multilib \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev texinfo
          echo "Готово. Ключевые версии:"
          gcc --version | head -1
          perl --version | head -2
          bison --version | head -1

      - name: Cache arm-none-symbianelf toolchain (gcc 12.1.0)
        id: gcce-cache
        uses: actions/cache@v4
        with:
          path: ~/gcc-builds/gcc-12.1.0
          key: arm-none-symbianelf-gcc-12.1.0-${{ runner.os }}-v1

      - name: Build arm-none-symbianelf-gcc 12.1.0 (GCCECC toolchain, from source)
        if: steps.gcce-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # Raptor в этом дереве (gcc.xml/s60_sbs_config.xml) жёстко требует
          # компилятор с именем arm-none-symbianelf-g++ версии ровно 12.1.0
          # ("tool 'GCCECC' ... did not return version '12.1.0'"). Такого
          # готового бинарного дистрибутива в природе не существует — это
          # специфичный для Symbian target triplet, отличный от стандартного
          # arm-none-eabi. Собираем его из исходников по рецепту
          # fedor4ever/GCC4Symbian (Attribution-NonCommercial 4.0, публичный
          # скрипт сборки), который явно рассчитан на TARGET=arm-none-symbianelf
          # и GCCC=gcc-12.1.0 — то есть ту самую версию, что требует Raptor.
          echo "Клонирую GCC4Symbian..."
          git clone --depth 1 https://github.com/fedor4ever/GCC4Symbian.git /tmp/gcc4symbian \
            || { echo "::error::Не удалось склонировать fedor4ever/GCC4Symbian."; exit 1; }
          cd /tmp/gcc4symbian
          echo "Собираю arm-none-symbianelf-gcc 12.1.0 — это займёт продолжительное время..."
          chmod +x build-toolchain.sh
          ./build-toolchain.sh 2>&1 | tee "$GITHUB_WORKSPACE/build_gcce_toolchain.log" \
            || { echo "::error::Сборка arm-none-symbianelf-gcc завершилась с ошибкой. См. build_gcce_toolchain.log."; exit 1; }
          echo "Готовый тулчейн:"
          ls -la ~/gcc-builds/gcc-12.1.0/bin | head -20
          echo "Место на диске после сборки тулчейна:"
          df -h /
          echo "Чищу промежуточные build/исходники тулчейна (нужен только готовый ~/gcc-builds/gcc-12.1.0)..."
          rm -rf /tmp/gcc4symbian
          sudo apt-get clean
          echo "Место на диске после очистки:"
          df -h /

      - name: Verify arm-none-symbianelf-g++ toolchain
        id: gcce
        run: |
          set -e
          BIN_DIR="$HOME/gcc-builds/gcc-12.1.0/bin"
          if [ ! -x "$BIN_DIR/arm-none-symbianelf-g++" ]; then
            echo "::error::arm-none-symbianelf-g++ не найден в $BIN_DIR после сборки/восстановления из кэша."
            exit 1
          fi
          echo "Версия компилятора:"
          "$BIN_DIR/arm-none-symbianelf-g++" -dumpversion
          echo "gcce_ver_key=1210" >> "$GITHUB_OUTPUT"
          echo "gcce_bin_dir=$BIN_DIR" >> "$GITHUB_OUTPUT"

      - name: Clone symbian-build toolchain sources
        run: |
          set -e
          echo "Клонирую $SYMBIAN_BUILD_REPO ..."
          git clone --depth 1 "$SYMBIAN_BUILD_REPO" epocroot/build \
            || { echo "::error::Не удалось склонировать symbian-build."; exit 1; }
          echo "Содержимое верхнего уровня:"
          ls epocroot/build

      - name: Download PDK 3.0.4a (Symbian^3 headers/libs)
        run: |
          set -e
          echo "Скачиваю PDK с $PDK_URL (файл ~2.9 ГБ, archive.org иногда отдаёт 500 на большие файлы — делаю retry с резюмированием)..."
          MAX_ATTEMPTS=8
          attempt=1
          until curl -L --fail -C - --retry 3 --retry-delay 5 -o pdk.zip "$PDK_URL"; do
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Не удалось скачать PDK с $PDK_URL после $MAX_ATTEMPTS попыток (archive.org стабильно отвечает ошибкой)."
              exit 1
            fi
            echo "Попытка $attempt не удалась (вероятно, временная 500 от archive.org), жду перед повтором..."
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          ls -lh pdk.zip

      - name: Install 7-Zip (needed for PDK archives mislabeled as .zip)
        run: |
          set -e
          sudo apt-get install -y -qq p7zip-full

      - name: Extract PDK into EPOCROOT
        run: |
          set -e
          echo "Распаковываю PDK в epocroot/ ..."
          unzip -q pdk.zip -d pdk_extracted || { echo "::error::Не удалось распаковать PDK zip."; exit 1; }
          echo "Верхний уровень PDK-архива:"
          find pdk_extracted -maxdepth 3

          mkdir -p epocroot

          NESTED=$(find pdk_extracted -iname "*.zip")
          if [ -n "$NESTED" ]; then
            echo "Найдены вложенные архивы, распаковываю каждый в epocroot/:"
            for z in $NESTED; do
              echo "  - $z"
              if unzip -tq "$z" >/dev/null 2>&1; then
                echo "    (настоящий zip) unzip..."
                unzip -q -o "$z" -d epocroot/ || echo "::warning::unzip не смог распаковать $z, хотя тест прошёл"
              else
                echo "    (не настоящий zip, пробую как 7z по содержимому)"
                7z x "$z" -oepocroot/ -y > /tmp/7z_$(basename "$z").log 2>&1 \
                  || echo "::warning::7z тоже не смог распаковать $z, см. /tmp/7z_$(basename "$z").log"
              fi
            done
          else
            echo "Вложенных архивов не найдено, копирую распакованное дерево целиком в epocroot/"
            cp -r pdk_extracted/* epocroot/ 2>/dev/null || true
          fi

          echo "Проверяю наличие epoc32/ в EPOCROOT:"
          find epocroot -maxdepth 2 -iname "epoc32" || true
          echo "Полное дерево верхнего уровня epocroot/ (для диагностики):"
          find epocroot -maxdepth 3 -type d

      - name: Fix missing patch-files/linux/build/... (mirror from linux_build)
        working-directory: epocroot/build/cross-plat-dev-utils
        run: |
          set -e
          # apply_patch_file.pm строит путь до патча как:
          #   patch-files/linux/<путь файла относительно EPOCROOT>
          # Целевой файл в EPOCROOT — build/sbsv2/raptor/lib/config/gcc.xml,
          # поэтому скрипт ищет patch-files/linux/build/sbsv2/.../gcc.xml.
          # Но в апстриме нужный патч лежит под linux_build/, не build/
          # (см. историю каталога на GitHub — коммит Mike Kinghan,
          # patch-files/linux/linux_build/sbsv2/raptor/lib/config/gcc.xml).
          # Зеркалируем весь недостающий поддерево linux_build -> build,
          # не трогая исходные файлы репозитория.
          SRC="patch-files/linux/linux_build"
          DST="patch-files/linux/build"
          if [ -d "$SRC" ]; then
            echo "Зеркалирую $SRC -> $DST (только файлы, которых там ещё нет)..."
            mkdir -p "$DST"
            cp -rn "$SRC"/. "$DST"/ 2>/dev/null || cp -r "$SRC"/. "$DST"/
            echo "Проверяю, что нужный патч теперь на месте:"
            find "$DST" -iname "gcc.xml" || \
              { echo "::error::gcc.xml всё равно не найден в $DST после зеркалирования из $SRC."; exit 1; }
          else
            echo "::warning::$SRC не существует — пропускаю зеркалирование, структура репозитория отличается от ожидаемой."
          fi

      - name: One-time environment fixes (prep_env.pl)
        working-directory: epocroot/build/cross-plat-dev-utils
        run: |
          set -e
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          echo "EPOCROOT=$EPOCROOT"
          echo "Запускаю prep_env.pl (fix_raptor_config.pl + fix_epoc32.pl)..."
          # Современный Perl (5.36+) убрал "." из @INC по умолчанию (CVE-2016-1238).
          # prep_env.pl сам подключает usage.pm через use — это чинится -I.
          # НО prep_env.pl вызывает fix_epoc32.pl/fix_raptor_config.pl через
          # perl_run(), который делает system("perl $cmd") — это НОВЫЙ процесс
          # perl, не наследующий -I родителя. Поэтому используем PERL5LIB
          # (переменная окружения, которую читает любой дочерний perl-процесс)
          # вместо/вместе с -I.
          export PERL5LIB="$(pwd):$PERL5LIB"
          perl -I. prep_env.pl || { echo "::error::prep_env.pl завершился с ошибкой — см. вывод выше."; exit 1; }

      - name: Build Raptor (sbsv2)
        working-directory: epocroot/build/cross-plat-dev-utils
        run: |
          set -e
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          echo "Собираю Raptor — это может занять долго..."
          export PERL5LIB="$(pwd):$PERL5LIB"
          perl -I. build_raptor.pl 2>&1 | tee "$GITHUB_WORKSPACE/build_raptor.log" \
            || { echo "::error::Сборка Raptor завершилась с ошибкой. См. build_raptor.log в артефактах."; exit 1; }

      - name: Link host tools into Raptor's bin directory
        run: |
          set -e
          # Raptor ожидает найти bash (и иногда другие host-инструменты)
          # внутри собственной директории raptor/<platform>/bin/, а не
          # просто в $PATH — это часть его self-check toolset'ов
          # (raptor_data.py Tool.check). build_raptor.pl / prep_env.pl эту
          # директорию не заполняют, поэтому линкуем системные бинарники
          # туда вручную.
          RAPTOR_BIN="$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor/linux-x86_64/bin"
          mkdir -p "$RAPTOR_BIN"
          for tool in bash sh perl make; do
            SYS_PATH=$(command -v "$tool" || true)
            if [ -n "$SYS_PATH" ] && [ ! -e "$RAPTOR_BIN/$tool" ]; then
              ln -s "$SYS_PATH" "$RAPTOR_BIN/$tool"
              echo "Слинковал $tool -> $SYS_PATH"
            fi
          done
          ls -la "$RAPTOR_BIN"

      - name: Build elf2e32 (modern CMake port)
        run: |
          set -e
          # Ванильный elf2e32 (из oss.FCL.interim.SFTools.LinuxBuild) писан
          # под GCC ~4.x и Raptor не пробрасывает флаги компилятора
          # (-fpermissive, -I) в реальный вызов GCC для этого MMP — что
          # вызывало бесконечную цепочку ошибок компиляции/заголовков.
          # Вместо патчинга устаревшего кода используем готовый современный
          # порт (C++14, собирается напрямую через CMake, без Raptor):
          # https://github.com/fedor4ever/elf2e32
          echo "Клонирую fedor4ever/elf2e32 (современный порт под GCC/CMake)..."
          git clone --depth 1 https://github.com/fedor4ever/elf2e32.git /tmp/elf2e32-modern \
            || { echo "::error::Не удалось склонировать fedor4ever/elf2e32."; exit 1; }
          cd /tmp/elf2e32-modern
          mkdir -p build && cd build
          # e32imagefile.cpp содержит:
          #   #ifndef __LINUX__
          #       #include <io.h>   // заголовок MSVC/MinGW, на Linux не существует
          #   #endif
          # Макрос __LINUX__ — не встроенный в GCC (в отличие от __linux__ с
          # маленькой буквы) и должен выставляться сборочной системой; в
          # этой версии CMakeLists.txt он, похоже, не определяется сам,
          # поэтому передаём его явно через флаги компилятора.
          echo "Использования __LINUX__ в дереве (для диагностики):"
          grep -rn "__LINUX__" ../source | head -10 || true
          # Страховка: если -Werror выставлен внутри CMakeLists.txt через
          # target_compile_options (а не через CMAKE_CXX_FLAGS), наши флаги
          # командной строки могут не перекрыть его из-за порядка аргументов
          # компилятора. Вырезаем -Werror из CMakeLists.txt напрямую.
          echo "Ищу -Werror в CMakeLists.txt..."
          grep -rn "Werror" ../CMakeLists.txt 2>/dev/null || true
          find .. -maxdepth 2 -iname "CMakeLists.txt" -exec sed -i -E 's/-Werror(=[A-Za-z0-9_-]+)?//g' {} \;
          # Ряд файлов в этом дереве вызывает memcpy/memset/strlen/strcpy
          # и т.п. (или использует std::string), но не подключает <cstring>
          # / <string> напрямую — раньше это "протекало" транзитивно через
          # другие системные заголовки в старых libstdc++, но GCC 13 эти
          # транзитивные инклюды убрал, отчего сборка падает с
          # "‘memcpy’/‘memset’ was not declared" или "‘string’ in namespace
          # ‘std’ does not name a type". Патчим и .cpp, и .h/.hpp сразу
          # (например pl_elfimage.h использует std::string без #include
          # <string>), чтобы не гоняться по одному файлу за прогон CI.
          echo "Проверяю .cpp/.h файлы на использование <cstring>/<string> без явного include..."
          for f in $(grep -lE '\b(memcpy|memset|memmove|strlen|strcpy|strncpy|strcmp|strncmp|strcat)\s*\(' ../source/*.cpp ../source/*.h ../include/*.h 2>/dev/null); do
            if ! grep -q "#include <cstring>" "$f"; then
              echo "  добавляю #include <cstring> в $f"
              sed -i '1i #include <cstring>' "$f"
            fi
          done
          for f in $(grep -lE '\bstd::string\b' ../source/*.cpp ../source/*.h ../include/*.h 2>/dev/null); do
            if ! grep -q "#include <string>" "$f"; then
              echo "  добавляю #include <string> в $f"
              sed -i '1i #include <string>' "$f"
            fi
          done
          # stricmp/strnicmp — это MSVC/Windows-специфичные функции, их нет
          # в glibc на Linux вообще (POSIX-эквиваленты — strcasecmp/
          # strncasecmp из <strings.h>). Заменяем имена прямо в исходниках
          # и подключаем <strings.h> туда, где они встречаются.
          echo "Заменяю stricmp/strnicmp (MSVC-специфика) на strcasecmp/strncasecmp (POSIX)..."
          for f in $(grep -lE '\b(stricmp|strnicmp)\s*\(' ../source/*.cpp ../source/*.h ../include/*.h 2>/dev/null); do
            echo "  патчу $f"
            sed -i -E 's/\bstrnicmp\b/strncasecmp/g; s/\bstricmp\b/strcasecmp/g' "$f"
            if ! grep -q "#include <strings.h>" "$f"; then
              sed -i '1i #include <strings.h>' "$f"
            fi
          done
          # Реальная ошибка (не warning, не -Werror-превращение) —
          # e32info.cpp:490 приводит разность указателей (64-битный
          # ptrdiff_t) напрямую к uint32_t, что GCC 13 в 64-битной сборке
          # считает потерей точности и требует явного -fpermissive (сам
          # компилятор подсказывает это в сообщении "[-fpermissive]").
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-D__LINUX__ -Wno-error -Wno-error=format -fpermissive" \
            -DCMAKE_C_FLAGS="-D__LINUX__ -Wno-error -Wno-error=format -fpermissive" \
            2>&1 | tee "$GITHUB_WORKSPACE/build_elf2e32.log" \
            || { echo "::error::cmake configure для elf2e32 завершился с ошибкой. См. build_elf2e32.log."; exit 1; }
          cmake --build . --config Release -j"$(nproc)" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_elf2e32.log" \
            || { echo "::error::Сборка elf2e32 завершилась с ошибкой. См. build_elf2e32.log."; exit 1; }
          BIN=$(find . -maxdepth 2 -iname "elf2e32*" -type f -executable | head -n1)
          if [ -z "$BIN" ]; then
            echo "::error::Сборка elf2e32 прошла без ошибок, но бинарник не найден — проверьте build_elf2e32.log."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/epocroot/epoc32/tools"
          cp "$BIN" "$GITHUB_WORKSPACE/epocroot/epoc32/tools/elf2e32"
          chmod +x "$GITHUB_WORKSPACE/epocroot/epoc32/tools/elf2e32"
          echo "elf2e32 собран и установлен: $GITHUB_WORKSPACE/epocroot/epoc32/tools/elf2e32"
          cd /tmp/elf2e32-modern
          rm -rf build
          df -h /

      - name: Clone e32tools sources (makesis, petran)
        run: |
          set -e
          # elf2e32 теперь собирается отдельно (см. предыдущий шаг), а
          # makesis/petran по-прежнему берём из ванильного дерева и
          # собираем через Raptor — они пока не вызывали таких проблем
          # совместимости с современным GCC, как elf2e32.
          echo "Клонирую e32tools (+ imgtools, от которого зависят seclib/setcap) из oss.FCL.interim.SFTools.LinuxBuild..."
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SymbianSource/oss.FCL.interim.SFTools.LinuxBuild.git /tmp/sftools-linuxbuild \
            || { echo "::error::Не удалось склонировать oss.FCL.interim.SFTools.LinuxBuild."; exit 1; }
          cd /tmp/sftools-linuxbuild
          # imgtools нужен как зависимость (seclib.cpp includes e32image.h,
          # setcap.cpp includes h_utl.h — оба физически лежат в imgtools/imglib),
          # даже если сами imgtools-инструменты нам не нужны.
          git sparse-checkout set e32tools imgtools
          echo "Содержимое /tmp/sftools-linuxbuild после sparse-checkout:"
          ls -la
          echo "--- e32tools (верхний уровень) ---"
          ls -la e32tools 2>/dev/null || echo "  (e32tools отсутствует или пуст!)"
          echo "Копирую e32tools и imgtools в epocroot/ ..."
          cp -r e32tools "$GITHUB_WORKSPACE/epocroot/e32tools"
          cp -r imgtools "$GITHUB_WORKSPACE/epocroot/imgtools"
          # elf2e32 больше не собираем этим путём — исключаем его из
          # группового bld.inf, если он там указан, чтобы Raptor не
          # пытался собрать заведомо проблемный ванильный код.
          rm -rf "$GITHUB_WORKSPACE/epocroot/e32tools/elf2e32"
          echo "--- Структура epocroot/e32tools после копирования ---"
          find "$GITHUB_WORKSPACE/epocroot/e32tools" -maxdepth 4 -type d | sort
          echo "--- bld.inf внутри epocroot/e32tools ---"
          find "$GITHUB_WORKSPACE/epocroot/e32tools" -iname "bld.inf"
          if [ -z "$(find "$GITHUB_WORKSPACE/epocroot/e32tools" -iname "bld.inf")" ]; then
            echo "::error::Ни одного bld.inf не найдено внутри epocroot/e32tools после клонирования — структура репозитория oss.FCL.interim.SFTools.LinuxBuild отличается от ожидаемой, либо sparse-checkout сработал не так, как задумано."
            exit 1
          fi

      - name: Build e32tools (makesis, petran) with Raptor
        working-directory: epocroot/e32tools
        run: |
          set -e
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          export SBS_HOME="$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor"
          export PATH="$SBS_HOME/bin:$PATH"
          # Собираем makesis и petran по отдельности через их собственные
          # bld.inf, а не общий групповой bld.inf всего e32tools — общий
          # bld.inf тащит и seclib/setcap, которые зависят от imgtools и
          # могут падать независимо от того, собрался ли реально нужный
          # нам makesis. Так сбой в одном компоненте не маскирует и не
          # блокирует сборку другого.
          echo "Компоненты внутри e32tools:"
          find . -maxdepth 2 -iname "bld.inf"
          echo "--- Полная структура epocroot/e32tools (для диагностики) ---"
          find . -maxdepth 4 -type d | sort
          echo "--- Все bld.inf где угодно внутри e32tools ---"
          find . -iname "bld.inf"
          for tool in makesis petran; do
            BLDINF=$(find . -ipath "*$tool*bld.inf" | head -n1)
            if [ -z "$BLDINF" ]; then
              echo "::warning::bld.inf для $tool не найден — пропускаю."
              continue
            fi
            echo "Собираю $tool из $BLDINF (конфигурация tools2)..."
            (cd "$(dirname "$BLDINF")" && \
              sbs -c tools2 2>&1 | tee -a "$GITHUB_WORKSPACE/build_e32tools.log") \
              || echo "::warning::Сборка $tool через tools2 завершилась с ошибкой, см. build_e32tools.log."
          done

      - name: Locate sbs / makesis / elf2e32 binaries
        id: tools
        run: |
          set -e
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          echo "Ищу собранные инструменты..."
          SBS=$(find "$GITHUB_WORKSPACE/epocroot" -iname "sbs" -type f 2>/dev/null | grep -v "\.pl$\|\.pm$" | head -n1 || true)
          # Внутри symbian-build есть тестовые фикстуры с именами вроде
          # makesis.exe/elf2e32 под .../tests/data/... (заглушки для юнит-тестов
          # питоновских хелперов, не настоящие бинарники) — их нужно
          # исключить, иначе find может найти фикстуру раньше настоящего
          # инструмента и упаковка .sis молча ничего не создаст. Также ищем
          # в первую очередь в epoc32/tools, куда Raptor кладёт собранные
          # host-утилиты (makesis из свежесобранного epocroot/e32tools).
          MAKESIS=$(find "$GITHUB_WORKSPACE/epocroot/epoc32/tools" -iname "makesis*" -type f -executable 2>/dev/null | head -n1 || true)
          if [ -z "$MAKESIS" ]; then
            MAKESIS=$(find "$GITHUB_WORKSPACE/epocroot" -iname "makesis*" -type f -executable 2>/dev/null \
              | grep -viE "/tests?/|/test_data/|/data/" | head -n1 || true)
          fi
          ELF2E32="$GITHUB_WORKSPACE/epocroot/epoc32/tools/elf2e32"
          if [ ! -x "$ELF2E32" ]; then
            echo "::warning::elf2e32 не найден по ожидаемому пути после сборки (см. шаг 'Build elf2e32 (modern CMake port)')."
            ELF2E32=""
          fi
          if [ -z "$MAKESIS" ]; then
            echo "::warning::Не найден makesis вне тестовых фикстур, откатываюсь на первый попавшийся."
            MAKESIS=$(find "$GITHUB_WORKSPACE/epocroot" -iname "makesis*" -type f -executable 2>/dev/null | head -n1 || true)
          fi
          echo "sbs: $SBS"
          echo "makesis: $MAKESIS"
          echo "elf2e32: $ELF2E32"
          if [ -z "$SBS" ]; then
            echo "::error::sbs не найден после сборки Raptor. Собрать vNES невозможно без него."
            exit 1
          fi
          # sbs — это shell-обёртка (Raptor/Talon), а не одиночный бинарник:
          # она сама ищет соседние файлы (raptor/bin/sbs и т.п.) относительно
          # SBS_HOME, который нужно передать явно, иначе обёртка падает
          # с "No such file or directory" на относительном пути.
          SBS_HOME_DIR=$(dirname "$(dirname "$SBS")")
          echo "SBS_HOME (вычислен): $SBS_HOME_DIR"
          echo "sbs=$SBS" >> "$GITHUB_OUTPUT"
          echo "sbs_home=$SBS_HOME_DIR" >> "$GITHUB_OUTPUT"
          echo "makesis=$MAKESIS" >> "$GITHUB_OUTPUT"
          echo "elf2e32=$ELF2E32" >> "$GITHUB_OUTPUT"

      - name: Populate missing HOSTPLATFORM_DIR bin (bash/make/python for Raptor)
        run: |
          set -e
          SBS_HOME="${{ steps.tools.outputs.sbs_home }}"
          # gethost.sh должен определять HOSTPLATFORM_DIR (обычно linux-x86_64)
          # и Raptor ожидает найти там bash/make/python2/talon и т.п. — но
          # gethost.sh в этом дереве падает на 32-битном тесте
          # ("/lib/libc.so.6: No such file or directory"), поэтому каталог
          # не заполняется. Создаём его сами и кладём туда симлинки на
          # системные инструменты хоста, которые оригинальный Raptor обычно
          # поставлял в комплекте.
          PLATFORM_DIR="$SBS_HOME/linux-x86_64"
          echo "Создаю $PLATFORM_DIR/bin и заполняю симлинками на системные утилиты..."
          mkdir -p "$PLATFORM_DIR/bin"
          for tool in bash make python3 perl sh; do
            SYS_PATH=$(command -v "$tool" || true)
            if [ -n "$SYS_PATH" ]; then
              ln -sf "$SYS_PATH" "$PLATFORM_DIR/bin/$tool"
              echo "  $tool -> $SYS_PATH"
            else
              echo "::warning::системный $tool не найден, пропускаю"
            fi
          done
          # Raptor часто ищет "python" (без версии) и "make" под конкретными
          # именами — на всякий случай добавляем алиас python -> python3.
          if [ ! -e "$PLATFORM_DIR/bin/python" ] && command -v python3 >/dev/null; then
            ln -sf "$(command -v python3)" "$PLATFORM_DIR/bin/python"
          fi
          echo "Итоговое содержимое $PLATFORM_DIR/bin:"
          ls -la "$PLATFORM_DIR/bin"

      - name: Build vNES with sbs
        working-directory: vnes-src/src/group
        run: |
          set -e
          set -o pipefail
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          export SBS_HOME="${{ steps.tools.outputs.sbs_home }}"
          export PATH="$SBS_HOME/bin:${{ steps.gcce.outputs.gcce_bin_dir }}:$PATH"
          export "SBS_GCCE${{ steps.gcce.outputs.gcce_ver_key }}BIN"="${{ steps.gcce.outputs.gcce_bin_dir }}"
          echo "EPOCROOT=$EPOCROOT"
          echo "SBS_HOME=$SBS_HOME"
          echo "SBS_GCCE${{ steps.gcce.outputs.gcce_ver_key }}BIN=${{ steps.gcce.outputs.gcce_bin_dir }}"
          echo "Собираю из group/bld.inf (нативный Symbian-фронтенд, написан вручную взамен Qt)."
          ls -la
          # На случай, если Raptor считает цель "up-to-date" по кэшу из
          # предыдущего прогона (что тоже дало бы "0 секунд, no warnings")
          # — явно чистим build-кэш перед реальной попыткой сборки.
          echo "Чищу возможный кэш предыдущих сборок в epoc32/build..."
          rm -rf "$GITHUB_WORKSPACE/epocroot/epoc32/build"
          # Короткий алиас armv5_urel разворачивается Raptor'ом в
          # arm.v5.urel.rvct2_2 — то есть RVCT-компилятор, а не GCCE
          # (см. akaWolf-Wiki: "wherever armv5_urel is used, Raptor will
          # know that is really means arm.v5.urel.rvct2_2"). Наш bld.inf
          # заявляет "PRJ_PLATFORMS GCCE" — платформу, отличную от RVCT,
          # поэтому Raptor тихо пропускал компонент ("no warnings or
          # errors", "Run time 0 seconds"), не находя для него совпадающей
          # конфигурации, вместо явной ошибки.
          # Правильный синтаксис для GCCE — полное имя конфигурации
          # arm.v5.<variant>.gcce<version_with_underscores>, например
          # arm.v5.urel.gcce4_4_1 (см. akaWolf-Wiki Fshell/Getting Started).
          # Версия компилятора у нас — 12.1.0 (та же, что задаёт
          # SBS_GCCE1210BIN), поэтому используем arm.v5.urel.gcce12_1_0.
          # Найдена реальная причина "0 секунд, no warnings or errors":
          # без явной цели sbs выполнял только стандартный набор
          # (EXPORT/BITMAP/RESOURCE_DEPS/RESOURCE/default-ALL) — ни один
          # из них не компилирует .cpp в .o и не линкует .exe. Цель,
          # которая это делает — TARGET (см. usage sbs: "TARGET Create
          # main executables") — не включена в дефолтный набор и должна
          # быть указана явно.
          echo "--- Диагностика: WHAT (список releasable-таргетов, ничего не собирает) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          "${{ steps.tools.outputs.sbs }}" -b bld.inf -c arm.v5.urel.gcce12_1_0 WHAT 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Основная сборка: TARGET ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          "${{ steps.tools.outputs.sbs }}" -b bld.inf -c arm.v5.urel.gcce12_1_0 TARGET -d 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" \
            || { echo "::error::Компиляция vNES завершилась с ошибкой. См. build_vnes.log."; exit 1; }

      - name: Verify vNES binaries were actually built
        run: |
          set -e
          # sbs может отработать "no warnings or errors" за 0 секунд, если
          # он ничего не собирал. Проверяем явно, что итоговый исполняемый
          # файл/DLL реально появился — иначе makesis дальше молча
          # упакует пустой .sis.
          echo "Ищу собранные бинарники vNES в epoc32/release..."
          FOUND=$(find "$GITHUB_WORKSPACE/epocroot/epoc32/release" -iname "vnes*" -type f 2>/dev/null || true)
          echo "$FOUND"
          if [ -z "$FOUND" ]; then
            echo "::error::Ни один бинарник vNES не найден в epoc32/release после сборки. sbs, судя по всему, ничего не скомпилировал (см. build_vnes.log)."
            echo "Содержимое epoc32/release (если есть):"
            find "$GITHUB_WORKSPACE/epocroot/epoc32/release" -maxdepth 3 2>/dev/null || echo "  (каталог release не существует)"
            exit 1
          fi
          echo "Собранные бинарники:"
          ls -la $FOUND

      - name: Generate self-signed cert
        run: |
          set -e
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -keyout cert/vnes.key -out cert/vnes.pem \
            -days 3650 -nodes -subj "/CN=vNES Self-Signed/O=vNES/C=RU"

      - name: Package and sign .sis
        run: |
          set -e
          mkdir -p build
          PKG=$(find vnes-src/src/group -iname "*.pkg" | head -n1)
          if [ -z "$PKG" ]; then
            echo "::error::Не найден .pkg файл после сборки — sbs не создал пакет."
            exit 1
          fi
          echo "Найден .pkg: $PKG"
          "${{ steps.tools.outputs.makesis }}" "$PKG" build/vnes.sis \
            || { echo "::error::makesis завершился с ошибкой."; exit 1; }
          if [ ! -f build/vnes.sis ]; then
            echo "::error::makesis отработал без ошибки, но build/vnes.sis не создан (возможно, найден не тот makesis — см. шаг 'Locate sbs / makesis / elf2e32 binaries')."
            exit 1
          fi
          SIGNSIS=$(find epocroot -iname "signsis*" -type f -executable 2>/dev/null | head -n1 || true)
          if [ -n "$SIGNSIS" ]; then
            "$SIGNSIS" -S build/vnes.sis build/vnes_signed.sis cert/vnes.pem cert/vnes.key || \
              echo "::warning::signsis завершился с ошибкой, .sis остаётся неподписанным."
            if [ -f build/vnes_signed.sis ]; then
              mv build/vnes_signed.sis build/vnes.sis
            else
              echo "::warning::signsis не создал build/vnes_signed.sis, .sis остаётся неподписанным."
            fi
          else
            echo "::warning::signsis не найден, .sis остаётся неподписанным."
          fi
          ls -lh build/

      - name: Upload build logs (always, for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_raptor.log
            build_elf2e32.log
            build_e32tools.log
            build_vnes.log
          if-no-files-found: ignore

      - name: Upload .sis artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnes-sis
          path: build/vnes.sis
          if-no-files-found: error
