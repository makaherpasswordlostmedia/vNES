name: symbian-sdk-bootstrap

# Положи этот файл как .github/workflows/build.yml (старый на 1321 строку удали).
# Что делает: ставит новый SDK hpnkv/symbian-platform, генерирует стартовый
# проект (symbian init), собирает его, пакует в SIS и выкладывает ВСЁ как артефакты.
# Из артефакта "scaffold" видно, какие CMakeLists.txt / symbian.toml / app.cc
# генерирует SDK - по ним vNES подключается без угадывания.

on:
  push:
  workflow_dispatch:

env:
  SDK_VERSION: "0.1.1"
  GH_TOKEN: ${{ github.token }}

jobs:
  bootstrap:
    # Архив хоста/SDK требует glibc >= 2.39, это Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools and SDK
        run: |
          set -eux
          python -m venv "$HOME/venv"
          . "$HOME/venv/bin/activate"
          pip install "symbian-platform==${SDK_VERSION}"
          # список файлов релиза (для лога), потом качаем нужный по маске
          gh release view "v${SDK_VERSION}" --repo hpnkv/symbian-platform --json assets --jq '.assets[].name'
          gh release download "v${SDK_VERSION}" --repo hpnkv/symbian-platform \
            --pattern "symbian-sdk-*linux-x86_64.tar.gz" --output symbian-sdk.tar.gz
          ls -la symbian-sdk.tar.gz
          symbian sdk install "$HOME/symbian-sdk" --archive symbian-sdk.tar.gz
          symbian doctor || true

      - name: Scaffold starter project (ARMv6 = Nokia C7)
        run: |
          set -eux
          . "$HOME/venv/bin/activate"
          symbian init "$HOME/vnes_app" --name vnes --non-interactive
          cd "$HOME/vnes_app"
          find . -type f -not -path './.symbian/*' -not -path './build/*' | sort
          echo "===== symbian.toml ====="; cat symbian.toml
          echo "===== CMakeLists.txt ====="; cat CMakeLists.txt

      - name: Build and package the starter
        continue-on-error: true
        run: |
          set -eux
          . "$HOME/venv/bin/activate"
          cd "$HOME/vnes_app"
          symbian app build --project .
          exe="$(find . -name 'vnes*.exe' -o -name '*.exe' | head -n1)"
          echo "exe=$exe"
          symbian package --project . --artifact "$exe" --output .symbian/package
          symbian inspect --format sis .symbian/package/*.sis

      - name: Probe vNES core against the SDK compiler
        if: always()
        continue-on-error: true
        run: |
          . "$HOME/venv/bin/activate"
          mkdir -p out/probe
          P="$HOME/vnes_app"
          {
            echo "===== SDK headers we need ====="
            for h in e32base.h e32std.h f32file.h s32file.h s32strm.h w32std.h; do
              echo "--- $h"; find "$HOME/symbian-sdk" -name "$h" 2>/dev/null | head -3
            done
            echo; echo "===== starter sources ====="
            ls -la "$P"
            for f in model.h model.cc app.cc symbian.toml; do echo "----- $f -----"; cat "$P/$f" 2>/dev/null; done
          } > out/probe/starter.txt 2>&1 || true

          # Берём реальную команду компиляции app.cc из compile_commands.json
          cc="$(find "$P" "$HOME" -name compile_commands.json -not -path '*/node_modules/*' 2>/dev/null | head -1)"
          echo "compile_commands: $cc" | tee out/probe/core-compile.txt
          python3 - "$cc" "$GITHUB_WORKSPACE" > out/probe/core-compile-run.txt 2>&1 <<'PY' || true
          import json, os, shlex, subprocess, sys, glob
          cc, ws = sys.argv[1], sys.argv[2]
          if not cc or not os.path.exists(cc):
              print("no compile_commands.json"); sys.exit(0)
          db = json.load(open(cc))
          base = next((e for e in db if e["file"].endswith("app.cc")), db[0])
          cmd = base.get("command") or " ".join(base["arguments"])
          args = shlex.split(cmd)
          # убираем -o X, -c, -MD/-MF и исходник
          out, skip = [], False
          for a in args:
              if skip: skip = False; continue
              if a in ("-o", "-MF", "-MT"): skip = True; continue
              if a in ("-c", "-MD", "-MMD") or a.endswith((".cc", ".cpp", ".c")): continue
              out.append(a)
          core = sorted(glob.glob(ws + "/src/src/*.cpp"))
          core = [f for f in core if not f.endswith(("NESWidget.cpp", "main.cpp"))]
          ok = bad = 0
          for f in core:
              r = subprocess.run(out + ["-x", "c++", "-fsyntax-only", "-I", ws + "/src/inc", f],
                                 capture_output=True, text=True, cwd=base["directory"])
              status = "OK " if r.returncode == 0 else "ERR"
              ok += r.returncode == 0; bad += r.returncode != 0
              print("=====", status, os.path.basename(f))
              print("\n".join(r.stderr.splitlines()[:25]))
          print(f"\nSUMMARY: {ok} ok, {bad} failed")
          PY
          cat out/probe/core-compile-run.txt | tail -80

      - name: Collect output
        if: always()
        run: |
          mkdir -p out/scaffold out/sis
          cd "$HOME/vnes_app"
          tar --exclude='./build' --exclude='./.symbian' -cf - . | tar -xf - -C "$GITHUB_WORKSPACE/out/scaffold"
          find . -name '*.sis' -exec cp {} "$GITHUB_WORKSPACE/out/sis/" \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaffold
          path: out/scaffold

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: out/probe
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sis
          path: out/sis
          if-no-files-found: warn
