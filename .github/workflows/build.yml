name: Build vNES for Symbian (.sis)

# ВАЖНО (прочитать перед запуском):
#
# Предыдущая попытка (через Nokia Qt SDK offline-инсталлятор, .exe) не
# сработала: инсталлятор виснет на GUI-диалоге вне зависимости от ключей
# тишины, а распаковка через 7-Zip не даёт готовых бинарников qmake/sbs/
# makesis — только внутренний payload инсталлятора.
#
# Новый, гораздо более реалистичный путь:
#   1. Собираем сам сборочный тулчейн Symbian (Raptor/sbsv2, sbsv1/abld,
#      makesis, elf2e32 и т.д.) ИЗ ИСХОДНИКОВ репозитория
#      https://github.com/SymbianRevive/symbian-build
#      — это открытый, живой, клонируемый Git-репозиторий, не мёртвый
#      сервер Nokia.
#   2. Скачиваем headers/libs платформы Symbian^3 (PDK 3.0.4a) с архивной
#      копии на archive.org:
#      https://archive.org/download/nokia_sdks_n_dev_tools/PDK_3_0_4_a.zip
#      и раскладываем их в EPOCROOT рядом с symbian-build, как требует
#      README этого репозитория.
#   3. Собираем Raptor (build_raptor.pl), затем компилируем vNES через
#      него из src/group/bld.inf + vnes.mmp — они написаны ВРУЧНУЮ,
#      т.к. изначально их должен был генерировать qmake -spec
#      symbian-sbsv2 из vnes.pro, а Qt SDK для headless-сборки
#      недоступен (см. попытки выше в истории этого файла).
#
#      Заодно Qt-фронтенд (NESWidget.cpp/main.cpp, использовавший
#      QWidget/QPainter/QTimer) заменён на нативный Avkon-фронтенд
#      (src/native/Nes{Application,Document,AppUi,AppView}.cpp) —
#      двигатель эмулятора (NESCPU/NESPPU/NESPAPU/NESMapper/NESMemory/
#      NESROM/NESSystem) уже был нативным Symbian C++ и НЕ менялся.
#      ROM жёстко задан по пути C:\Data\NES\game.nes (без файлового
#      диалога — упрощение для первой версии, см. BUILD_NOTES.md).
#
# ЭТО ДОЛГАЯ СБОРКА. Сама сборка Raptor из исходников занимает
# продолжительное время (README прямо предупреждает "This takes some
# time" дважды) — рассчитывайте на десятки минут, возможно больше часа
# только на тулчейн, до того как дело дойдёт до самого vNES.

on:
  push:
    branches: [ main, symbian ]
  workflow_dispatch: {}

env:
  PDK_URL: "https://archive.org/download/nokia_sdks_n_dev_tools/PDK_3_0_4_a.zip"
  SYMBIAN_BUILD_REPO: "https://github.com/SymbianRevive/symbian-build.git"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free up disk space on the runner
        run: |
          set -e
          # Стандартный ubuntu-latest раннер даёт ~14 ГБ свободного места,
          # а наш пайплайн (клон Raptor, сборка GCC-тулчейна из исходников,
          # распаковка PDK, сборка elf2e32/Raptor) легко превышает этот лимит
          # ("No space left on device" в самом воркере GitHub Actions).
          # Удаляем предустановленный софт, который нам точно не нужен.
          echo "Место на диске до очистки:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune -a -f 2>/dev/null || true
          sudo apt-get clean
          echo "Место на диске после очистки:"
          df -h /

      - name: Checkout vNES sources
        uses: actions/checkout@v4
        with:
          path: vnes-src

      - name: Install build prerequisites
        run: |
          set -e
          echo "Ставлю зависимости для сборки Raptor/sbsv2 (см. README-LINUX)..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bison flex \
            libncurses-dev \
            libbz2-dev \
            libboost-all-dev \
            libxml2-dev \
            perl python3 \
            build-essential \
            g++ gcc \
            cmake \
            unzip zip wget \
            gcc-multilib g++-multilib \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev texinfo
          echo "Готово. Ключевые версии:"
          gcc --version | head -1
          perl --version | head -2
          bison --version | head -1

      - name: Cache arm-none-symbianelf toolchain (gcc 12.1.0)
        id: gcce-cache
        uses: actions/cache@v4
        with:
          path: ~/gcc-builds/gcc-12.1.0
          key: arm-none-symbianelf-gcc-12.1.0-${{ runner.os }}-v1

      - name: Build arm-none-symbianelf-gcc 12.1.0 (GCCECC toolchain, from source)
        if: steps.gcce-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # Raptor в этом дереве (gcc.xml/s60_sbs_config.xml) жёстко требует
          # компилятор с именем arm-none-symbianelf-g++ версии ровно 12.1.0
          # ("tool 'GCCECC' ... did not return version '12.1.0'"). Такого
          # готового бинарного дистрибутива в природе не существует — это
          # специфичный для Symbian target triplet, отличный от стандартного
          # arm-none-eabi. Собираем его из исходников по рецепту
          # fedor4ever/GCC4Symbian (Attribution-NonCommercial 4.0, публичный
          # скрипт сборки), который явно рассчитан на TARGET=arm-none-symbianelf
          # и GCCC=gcc-12.1.0 — то есть ту самую версию, что требует Raptor.
          echo "Клонирую GCC4Symbian..."
          git clone --depth 1 https://github.com/fedor4ever/GCC4Symbian.git /tmp/gcc4symbian \
            || { echo "::error::Не удалось склонировать fedor4ever/GCC4Symbian."; exit 1; }
          cd /tmp/gcc4symbian
          echo "Собираю arm-none-symbianelf-gcc 12.1.0 — это займёт продолжительное время..."
          chmod +x build-toolchain.sh
          ./build-toolchain.sh 2>&1 | tee "$GITHUB_WORKSPACE/build_gcce_toolchain.log" \
            || { echo "::error::Сборка arm-none-symbianelf-gcc завершилась с ошибкой. См. build_gcce_toolchain.log."; exit 1; }
          echo "Готовый тулчейн:"
          ls -la ~/gcc-builds/gcc-12.1.0/bin | head -20
          echo "Место на диске после сборки тулчейна:"
          df -h /
          echo "Чищу промежуточные build/исходники тулчейна (нужен только готовый ~/gcc-builds/gcc-12.1.0)..."
          rm -rf /tmp/gcc4symbian
          sudo apt-get clean
          echo "Место на диске после очистки:"
          df -h /

      - name: Verify arm-none-symbianelf-g++ toolchain
        id: gcce
        run: |
          set -e
          BIN_DIR="$HOME/gcc-builds/gcc-12.1.0/bin"
          if [ ! -x "$BIN_DIR/arm-none-symbianelf-g++" ]; then
            echo "::error::arm-none-symbianelf-g++ не найден в $BIN_DIR после сборки/восстановления из кэша."
            exit 1
          fi
          echo "Версия компилятора:"
          "$BIN_DIR/arm-none-symbianelf-g++" -dumpversion
          echo "gcce_ver_key=1210" >> "$GITHUB_OUTPUT"
          echo "gcce_bin_dir=$BIN_DIR" >> "$GITHUB_OUTPUT"

      - name: Clone symbian-build toolchain sources
        run: |
          set -e
          echo "Клонирую $SYMBIAN_BUILD_REPO ..."
          git clone --depth 1 "$SYMBIAN_BUILD_REPO" epocroot/build \
            || { echo "::error::Не удалось склонировать symbian-build."; exit 1; }
          echo "Содержимое верхнего уровня:"
          ls epocroot/build

      - name: Download PDK 3.0.4a (Symbian^3 headers/libs)
        run: |
          set -e
          echo "Скачиваю PDK с $PDK_URL (файл ~2.9 ГБ, archive.org иногда отдаёт 500 на большие файлы — делаю retry с резюмированием)..."
          MAX_ATTEMPTS=8
          attempt=1
          until curl -L --fail -C - --retry 3 --retry-delay 5 -o pdk.zip "$PDK_URL"; do
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Не удалось скачать PDK с $PDK_URL после $MAX_ATTEMPTS попыток (archive.org стабильно отвечает ошибкой)."
              exit 1
            fi
            echo "Попытка $attempt не удалась (вероятно, временная 500 от archive.org), жду перед повтором..."
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          ls -lh pdk.zip

          # ДИАГНОСТИКА: -C - (resume) означает, что если предыдущий прогон
          # оставил после себя частично скачанный pdk.zip (например, раннер
          # был убит по timeout), curl мог "успешно" дозаписать остаток
          # поверх уже битого файла и выйти с кодом 0, хотя итоговый файл
          # никогда не был скачан с нуля и может быть внутренне повреждён
          # (не говоря о случае, когда archive.org на 200 OK отдаёт HTML
          # страницу-заглушку вместо содержимого). Проверяем это здесь, а
          # не постфактум на этапе распаковки.
          echo "--- Реальный тип и размер скачанного pdk.zip ---"
          file pdk.zip
          SIZE_BYTES=$(stat -c%s pdk.zip)
          echo "Размер: $SIZE_BYTES байт"
          if [ "$SIZE_BYTES" -lt 1000000000 ]; then
            echo "::warning::pdk.zip заметно меньше ожидаемых ~2.9 ГБ (получено: $SIZE_BYTES байт). Похоже на усечённую/неполную загрузку либо страницу-заглушку вместо архива."
          fi
          echo "--- Первые байты файла как текст (если это HTML-заглушка archive.org, будет видно здесь) ---"
          head -c 2000 pdk.zip | strings | head -20
          echo "--- Целостность zip (unzip -t по всему архиву, а не только первому уровню) ---"
          if ! unzip -t pdk.zip > /tmp/pdk_zip_test.log 2>&1; then
            echo "::error::pdk.zip не проходит проверку целостности unzip -t — файл скачан не полностью или повреждён. Хвост лога проверки:"
            tail -50 /tmp/pdk_zip_test.log
            exit 1
          fi
          echo "pdk.zip прошёл проверку целостности unzip -t."

      - name: Install 7-Zip (needed for PDK archives mislabeled as .zip)
        run: |
          set -e
          sudo apt-get install -y -qq p7zip-full

      - name: Extract PDK into EPOCROOT
        run: |
          set -e
          echo "Распаковываю PDK в epocroot/ ..."
          # ВАЖНО: -q глушит и предупреждения, а unzip может вернуть код 1
          # или 2 (warning) на частично повреждённом архиве и всё равно
          # что-то распаковать — "||" тут ловил бы только коды >=1, что
          # вроде бы верно, но без -q мы теряем сам текст предупреждения,
          # если он всё же проходит. Убираем -q и сохраняем полный лог,
          # чтобы при частичном успехе (redundant CRC errors и т.п.) это
          # было видно, а не только "молча меньше файлов, чем нужно".
          unzip pdk.zip -d pdk_extracted > /tmp/pdk_unzip_top.log 2>&1
          UNZIP_RC=$?
          tail -40 /tmp/pdk_unzip_top.log
          if [ "$UNZIP_RC" -ne 0 ]; then
            echo "::error::unzip pdk.zip завершился с кодом $UNZIP_RC (0 = успех, 1/2 = предупреждения, >=3 = ошибка). Полный лог выше/в /tmp/pdk_unzip_top.log — PDK, скорее всего, распакован не полностью."
            exit 1
          fi
          echo "Верхний уровень PDK-архива:"
          find pdk_extracted -maxdepth 3
          echo "Количество файлов на верхнем уровне распаковки: $(find pdk_extracted -type f | wc -l)"

          mkdir -p epocroot

          NESTED=$(find pdk_extracted -iname "*.zip")
          if [ -n "$NESTED" ]; then
            echo "Найдены вложенные архивы:"
            echo "$NESTED"
            for z in $NESTED; do
              echo "  === $z ==="
              echo "  Размер: $(stat -c%s "$z") байт"
              BEFORE=$(find epocroot -type f 2>/dev/null | wc -l)
              if unzip -tq "$z" >/dev/null 2>&1; then
                echo "    (настоящий zip, целостность OK) распаковываю..."
                unzip -o "$z" -d epocroot/ > "/tmp/unzip_$(basename "$z").log" 2>&1
                RC=$?
                if [ "$RC" -ne 0 ]; then
                  echo "::error::unzip $z завершился с кодом $RC — PDK будет неполным. Хвост лога:"
                  tail -40 "/tmp/unzip_$(basename "$z").log"
                  exit 1
                fi
              else
                echo "    (unzip -t провалился — не настоящий zip или повреждён), пробую 7z..."
                7z x "$z" -oepocroot/ -y > /tmp/7z_$(basename "$z").log 2>&1
                RC=$?
                if [ "$RC" -ne 0 ]; then
                  echo "::error::7z тоже не смог распаковать $z (код $RC) — PDK будет неполным. Лог:"
                  cat "/tmp/7z_$(basename "$z").log"
                  exit 1
                fi
              fi
              AFTER=$(find epocroot -type f 2>/dev/null | wc -l)
              echo "  Файлов в epocroot до/после: $BEFORE -> $AFTER (добавлено: $((AFTER - BEFORE)))"
              if [ "$AFTER" -eq "$BEFORE" ]; then
                echo "::warning::$z обработан без ошибки, но не добавил ни одного файла в epocroot — подозрительно."
              fi
            done
          else
            echo "Вложенных архивов не найдено, копирую распакованное дерево целиком в epocroot/"
            cp -r pdk_extracted/* epocroot/ 2>/dev/null || true
          fi

          echo "Проверяю наличие epoc32/ в EPOCROOT:"
          find epocroot -maxdepth 2 -iname "epoc32" || true
          echo "Полное дерево верхнего уровня epocroot/ (для диагностики):"
          find epocroot -maxdepth 3 -type d

          echo "--- Сохраняю логи распаковки вложенных PDK-архивов для диагностики в артефактах ---"
          mkdir -p "$GITHUB_WORKSPACE/pdk_extract_logs"
          cp /tmp/pdk_unzip_top.log "$GITHUB_WORKSPACE/pdk_extract_logs/" 2>/dev/null || true
          cp /tmp/unzip_*.log "$GITHUB_WORKSPACE/pdk_extract_logs/" 2>/dev/null || true
          cp /tmp/7z_*.log "$GITHUB_WORKSPACE/pdk_extract_logs/" 2>/dev/null || true
          echo "Скопировано файлов логов: $(ls "$GITHUB_WORKSPACE/pdk_extract_logs" 2>/dev/null | wc -l)"

          echo "--- Диагностика: сколько заголовков реально попало в epoc32/include ---"
          H_INCLUDE=$(find epocroot/epoc32/include -iname '*.h' 2>/dev/null | wc -l)
          H_TOTAL=$(find epocroot -iname '*.h' 2>/dev/null | wc -l)
          echo "Файлов *.h в epoc32/include (рекурсивно): $H_INCLUDE"
          echo "Файлов *.h во всём epocroot (рекурсивно, любая глубина/каталог): $H_TOTAL"

          echo "--- Проверка полноты PDK: критичные файлы для справки ---"
          # ВАЖНО: этот блок больше НЕ останавливает сборку по каждому
          # отдельному отсутствующему заголовку. С одним exit 1 на файл мы
          # рисковали упираться в "миллион файлов не найдено" — падать на
          # первом же из длинного хвоста похожих заголовков, чинить его,
          # тут же падать на следующем, и так по кругу десятками прогонов.
          # Вместо этого проверяем весь список СРАЗУ, за один проход,
          # печатаем полную картину (что есть/чего нет), и решение о
          # фатальности принимаем один раз в конце — по ОБЩЕЙ ситуации
          # (см. блок ниже), а не по отдельному файлу.
          #
          # Список ориентировочный — это файлы, о которых мы уже знаем,
          # что они нужны позже по пайплайну. Список наверняка неполный;
          # реальная полнота PDK всё равно проверяется по факту при сборке
          # самих компонентов (sbs), это лишь ранняя подсказка.
          CHECK_LIST="epocroot/epoc32/include/e32svr.h epocroot/epoc32/include/e32std.h epocroot/epoc32/include/e32base.h epocroot/epoc32/include/f32file.h epocroot/epoc32/tools/rcomp epocroot/epoc32/include/avkon.rh"
          FOUND_COUNT=0
          MISSING_COUNT=0
          MISSING_LIST=""
          for f in $CHECK_LIST; do
            if [ -e "$f" ]; then
              FOUND_COUNT=$((FOUND_COUNT + 1))
            else
              MISSING_COUNT=$((MISSING_COUNT + 1))
              MISSING_LIST="$MISSING_LIST $f"
            fi
          done
          echo "Найдено: $FOUND_COUNT / $((FOUND_COUNT + MISSING_COUNT)) файлов из ориентировочного списка."
          if [ "$MISSING_COUNT" -gt 0 ]; then
            echo "::warning::Не найдены по ожидаемым путям (это не обязательно фатально — часть появляется позже в пайплайне, часть может лежать в другой директории):"
            for f in $MISSING_LIST; do
              echo "  - $f"
            done
          fi

          # Единственный по-настоящему фатальный случай — когда PDK
          # распаковался почти пустым (т.е. что-то сломалось на уровне
          # архивов целиком, а не "не хватает одного конкретного файла").
          # Порог 1000 — с большим запасом ниже реальных десятков тысяч
          # заголовков в нормально распакованном PDK 3.0.4a.
          if [ "$H_INCLUDE" -lt 1000 ]; then
            echo "::error::В epoc32/include всего $H_INCLUDE файлов *.h — это на порядки меньше ожидаемого для Symbian^3 PDK. Похоже, распаковка headers/libs архива (binaries_epoc_sdk.7z.zip или аналогичного) прошла не так, как надо, даже если unzip/7z вернули код 0."
            exit 1
          fi

          # ==================================================================
          # АВТОМАТИЧЕСКИЙ поиск недостающих файлов — без ручного списка имён.
          #
          # Ниже два НЕЗАВИСИМЫХ чека разной природы. Они не гадают, что
          # "должно" быть в PDK — один сверяется с содержимым самого же
          # архива, другой — с внешними источниками. Оба подписаны честно,
          # чтобы не путать "здесь баг распаковки" с "здесь просто нет
          # такого файла у соседей".
          #
          # Общая защита от очень больших источников (см. предыдущие
          # итерации этого workflow): нигде не печатаем листинг всего
          # дерева без фильтра, везде taймауты на сеть, везде счётчики
          # вместо полного вывода при большом числе совпадений.
          set +e

          echo "=================================================================="
          echo "ЧЕК 1/2: список файлов ВНУТРИ pdk.zip vs что реально попало в epocroot/"
          echo "(ловит баги распаковки — файл заявлен в архиве, но не долетел на диск)"
          echo "=================================================================="
          # ВАЖНО: PDK_3_0_4_a.zip — это полный дистрибутив Symbian^3
          # (сотни тысяч записей: build_info/, release notes, сторонние
          # SDK типа UIQ/SEMC Java ME и т.п.), из которого в epocroot
          # намеренно распаковывается только релевантное подмножество
          # (headers/libs/tools). Сравнение ВСЕХ имён из архива со всем
          # epocroot в предыдущей версии этого чека давало 271938 из
          # 272066 "не найдено" — почти весь этот шум был ожидаемым
          # (build_info/*, сторонние .zip/.exe инсталляторы), а не
          # реальными пропусками, и топил единичные полезные совпадения.
          #
          # Сужаем до типов файлов, которые реально нужны для сборки:
          # заголовки/ресурсные файлы Symbian и файлы без расширения
          # (потенциальные бинарники host-тулов вроде rcomp).
          RELEVANT_EXT_RE='\.(h|rh|hrh|inl|mmh|rsg|rss|mmp|mbg)$'
          # Список имён (basename) из вложенных архивов — без распаковки,
          # только заголовки zip/7z. Это дёшево даже для архивов на
          # гигабайты и на миллионы записей (unzip -l / 7z l не читают
          # содержимое файлов, только centralized directory).
          ARCHIVE_NAMES_FILE=/tmp/pdk_archive_names.txt
          > "$ARCHIVE_NAMES_FILE"
          for z in $(find pdk_extracted -iname "*.zip" -o -iname "*.7z"); do
            if unzip -l "$z" >/tmp/_listing.txt 2>/dev/null; then
              awk 'NR>3' /tmp/_listing.txt | head -n -2 | awk '{print $NF}' >> "$ARCHIVE_NAMES_FILE"
            elif 7z l "$z" >/tmp/_listing.txt 2>/dev/null; then
              # Формат 7z l: заголовок, строка "-------" (начало данных),
              # строки данных, строка "-------" (конец данных), итог.
              # Колонка Name начинается там же, где последняя группа "---"
              # в разделительной строке — берём по позиции, а не по номеру
              # поля, т.к. колонка Attr (напр. "....A") сама содержит
              # непробельные символы и сбивает нумерацию awk-полей.
              awk '
                /^-------------------/ && !start {
                  match($0, /-+$/); start = RSTART; c++; next
                }
                /^-------------------/ { c++; next }
                c==1 && NF>0 { print substr($0, start) }
              ' /tmp/_listing.txt | sed 's/^ *//' >> "$ARCHIVE_NAMES_FILE"
            fi
          done
          # basename + фильтр по релевантным расширениям — режем шум от
          # build_info/сторонних архивов до сравнения, а не после.
          # ОТДЕЛЬНО добавляем файлы без расширения из путей вида
          # .../tools/... — это потенциальные бинарники host-инструментов
          # (например rcomp), которые не попадают под RELEVANT_EXT_RE, но
          # критично важны и иначе выпали бы из сравнения совсем.
          grep -iE "$RELEVANT_EXT_RE" "$ARCHIVE_NAMES_FILE" | sed -E 's#.*/##' > "${ARCHIVE_NAMES_FILE}.relevant"
          grep -iE '/tools/[^./]+$' "$ARCHIVE_NAMES_FILE" | sed -E 's#.*/##' >> "${ARCHIVE_NAMES_FILE}.relevant"
          mv "${ARCHIVE_NAMES_FILE}.relevant" "$ARCHIVE_NAMES_FILE"
          ARCHIVE_TOTAL=$(wc -l < "$ARCHIVE_NAMES_FILE")
          echo "Всего РЕЛЕВАНТНЫХ имён файлов (заголовки/ресурсы) внутри вложенных архивов PDK: $ARCHIVE_TOTAL"
          echo "(нерелевантные — build_info, сторонние SDK-инсталляторы и т.п. — отфильтрованы заранее, не участвуют в сравнении)"

          if [ "$ARCHIVE_TOTAL" -gt 0 ]; then
            # То же самое сужение применяем и к диску — иначе сравнение
            # "релевантное из архива" vs "всё подряд с диска" всё ещё
            # будет однобоким (хотя и не даст ложных совпадений, само по
            # себе не проблема, но для симметрии и ясности вывода лучше
            # держать одинаковый фильтр по обе стороны).
            DISK_NAMES_FILE=/tmp/epocroot_names.txt
            find epocroot -type f -printf '%f\n' 2>/dev/null | sort -u > "$DISK_NAMES_FILE"
            DISK_TOTAL=$(wc -l < "$DISK_NAMES_FILE")
            echo "Всего уникальных имён файлов на диске в epocroot/ (без фильтра, для справки): $DISK_TOTAL"

            sort -u "$ARCHIVE_NAMES_FILE" -o "$ARCHIVE_NAMES_FILE.sorted"
            MISSING_FROM_DISK=$(comm -23 "$ARCHIVE_NAMES_FILE.sorted" "$DISK_NAMES_FILE")
            MISSING_FROM_DISK_COUNT=$(echo -n "$MISSING_FROM_DISK" | grep -c . || true)
            echo "Заявлены в архиве (релевантные типы), но НЕ найдены на диске (по имени файла): $MISSING_FROM_DISK_COUNT"
            if [ "$MISSING_FROM_DISK_COUNT" -gt 0 ]; then
              echo "Первые 100 (полный список большим не печатаем, чтобы не раздувать лог):"
              echo "$MISSING_FROM_DISK" | head -100 | sed 's/^/  - /'
            fi
          else
            echo "::warning::Не удалось прочитать листинг ни одного вложенного архива (unzip -l и 7z l оба не сработали), либо ни одного релевантного файла не найдено — чек 1 пропущен."
          fi

          echo "=================================================================="
          echo "ЧЕК 2/2: имена файлов из внешних источников vs что есть в epocroot/"
          echo "(это НЕ 'эталон, что обязано быть' — просто у соседей похожее нашлось)"
          echo "=================================================================="
          mkdir -p /tmp/ext_sources && cd /tmp/ext_sources

          EXT_NAMES_FILE=/tmp/ext_source_names.txt
          > "$EXT_NAMES_FILE"

          echo "--- Клонирую loociano/symbian-build-tools ---"
          timeout 120 git clone --depth 1 https://github.com/loociano/symbian-build-tools.git sbt > /tmp/clone_sbt.log 2>&1
          if [ -d sbt ]; then
            find sbt -type f -printf '%f\n' 2>/dev/null >> "$EXT_NAMES_FILE"
            echo "  файлов добавлено в сравнение: $(find sbt -type f | wc -l)"
          else
            echo "  ::warning::клонирование не удалось/таймаут, см. /tmp/clone_sbt.log"
          fi

          echo "--- Клонирую SymbianRevive/symbian-headers ---"
          # ВАЖНО: раньше здесь стоял --filter=blob:none --sparse, что
          # БЕЗ последующего `git sparse-checkout set` ограничивает
          # чек-аут только верхним уровнем репозитория (в предыдущем
          # прогоне это дало всего 2658 файлов вместо реальных десятков
          # тысяч заголовков — avkon.rh/e32svr.h физически не попадали
          # в сравнение, даже если лежали в репозитории). Обычный полный
          # shallow-clone безопаснее для наших целей: --depth 1 уже
          # ограничивает объём (только последний коммит, без истории),
          # timeout ограничивает время; если репозиторий окажется
          # неожиданно огромным по факту (не по нашим текущим оценкам),
          # он просто упадёт по таймауту и уйдёт в ::warning::, не сломав
          # сборку.
          timeout 180 git clone --depth 1 https://github.com/SymbianRevive/symbian-headers.git sh > /tmp/clone_sh.log 2>&1
          if [ -d sh ]; then
            find sh -type f -printf '%f\n' 2>/dev/null >> "$EXT_NAMES_FILE"
            echo "  файлов добавлено в сравнение: $(find sh -type f | wc -l)"
          else
            echo "  ::warning::клонирование не удалось/таймаут, см. /tmp/clone_sh.log"
          fi

          echo "--- archive.org: другие SDK/tools-архивы (metadata API, без скачивания содержимого) ---"
          for item in nokia_sdks_n_dev_tools nokia_sdks_n_dev_tools2 nokia_sdks_n_dev_tools3; do
            timeout 60 curl -s --max-filesize 209715200 "https://archive.org/metadata/$item" -o "/tmp/${item}.json"
            if [ -s "/tmp/${item}.json" ]; then
              # Имена файлов из JSON-листинга archive.org — без скачивания
              # самих файлов, только метаданные. grep по сырому JSON, не
              # json.load(), чтобы не тянуть в память при большом листинге.
              grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]*"' "/tmp/${item}.json" 2>/dev/null \
                | sed -E 's/.*"([^"]*)"$/\1/; s#.*/##' >> "$EXT_NAMES_FILE"
              echo "  $item: обработан"
            else
              echo "  $item: metadata недоступна"
            fi
          done

          cd - >/dev/null
          sort -u "$EXT_NAMES_FILE" -o "$EXT_NAMES_FILE"
          EXT_TOTAL=$(wc -l < "$EXT_NAMES_FILE")
          echo "Всего уникальных имён файлов из внешних источников: $EXT_TOTAL"

          if [ "$EXT_TOTAL" -gt 0 ]; then
            find epocroot -type f -printf '%f\n' 2>/dev/null | sort -u > /tmp/epocroot_names2.txt
            MISSING_FROM_EXT=$(comm -23 "$EXT_NAMES_FILE" /tmp/epocroot_names2.txt)
            MISSING_FROM_EXT_COUNT=$(echo -n "$MISSING_FROM_EXT" | grep -c . || true)
            echo "Есть у внешних источников, но нет в epocroot (по имени файла): $MISSING_FROM_EXT_COUNT"
            echo "Это включает много ожидаемого шума (README, лицензии, .git-служебное,"
            echo "файлы, которые в принципе не относятся к Symbian) — не считайте всё"
            echo "это реальными пробелами, это просто сырая разница множеств имён."
            if [ "$MISSING_FROM_EXT_COUNT" -gt 0 ]; then
              echo "Первые 50 (полный список большим не печатаем):"
              echo "$MISSING_FROM_EXT" | head -50 | sed 's/^/  - /'
            fi
          else
            echo "::warning::Не удалось собрать ни одного внешнего источника — чек 2 пропущен."
          fi

          echo "=================================================================="
          echo "Конец автоматических чеков недостающих файлов."
          echo "=================================================================="
          set -e

      - name: Fix missing patch-files/linux/build/... (mirror from linux_build)
        working-directory: epocroot/build/cross-plat-dev-utils
        run: |
          set -e
          # apply_patch_file.pm строит путь до патча как:
          #   patch-files/linux/<путь файла относительно EPOCROOT>
          # Целевой файл в EPOCROOT — build/sbsv2/raptor/lib/config/gcc.xml,
          # поэтому скрипт ищет patch-files/linux/build/sbsv2/.../gcc.xml.
          # Но в апстриме нужный патч лежит под linux_build/, не build/
          # (см. историю каталога на GitHub — коммит Mike Kinghan,
          # patch-files/linux/linux_build/sbsv2/raptor/lib/config/gcc.xml).
          # Зеркалируем весь недостающий поддерево linux_build -> build,
          # не трогая исходные файлы репозитория.
          SRC="patch-files/linux/linux_build"
          DST="patch-files/linux/build"
          if [ -d "$SRC" ]; then
            echo "Зеркалирую $SRC -> $DST (только файлы, которых там ещё нет)..."
            mkdir -p "$DST"
            cp -rn "$SRC"/. "$DST"/ 2>/dev/null || cp -r "$SRC"/. "$DST"/
            echo "Проверяю, что нужный патч теперь на месте:"
            find "$DST" -iname "gcc.xml" || \
              { echo "::error::gcc.xml всё равно не найден в $DST после зеркалирования из $SRC."; exit 1; }
          else
            echo "::warning::$SRC не существует — пропускаю зеркалирование, структура репозитория отличается от ожидаемой."
          fi

      - name: One-time environment fixes (prep_env.pl)
        working-directory: epocroot/build/cross-plat-dev-utils
        run: |
          set -e
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          echo "EPOCROOT=$EPOCROOT"
          echo "Запускаю prep_env.pl (fix_raptor_config.pl + fix_epoc32.pl)..."
          # Современный Perl (5.36+) убрал "." из @INC по умолчанию (CVE-2016-1238).
          # prep_env.pl сам подключает usage.pm через use — это чинится -I.
          # НО prep_env.pl вызывает fix_epoc32.pl/fix_raptor_config.pl через
          # perl_run(), который делает system("perl $cmd") — это НОВЫЙ процесс
          # perl, не наследующий -I родителя. Поэтому используем PERL5LIB
          # (переменная окружения, которую читает любой дочерний perl-процесс)
          # вместо/вместе с -I.
          export PERL5LIB="$(pwd):$PERL5LIB"
          perl -I. prep_env.pl || { echo "::error::prep_env.pl завершился с ошибкой — см. вывод выше."; exit 1; }

      - name: Build Raptor (sbsv2)
        working-directory: epocroot/build/cross-plat-dev-utils
        run: |
          set -e
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          echo "Собираю Raptor — это может занять долго..."
          export PERL5LIB="$(pwd):$PERL5LIB"
          perl -I. build_raptor.pl 2>&1 | tee "$GITHUB_WORKSPACE/build_raptor.log" \
            || { echo "::error::Сборка Raptor завершилась с ошибкой. См. build_raptor.log в артефактах."; exit 1; }

      - name: Link host tools into Raptor's bin directory
        run: |
          set -e
          # Raptor ожидает найти bash (и иногда другие host-инструменты)
          # внутри собственной директории raptor/<platform>/bin/, а не
          # просто в $PATH — это часть его self-check toolset'ов
          # (raptor_data.py Tool.check). build_raptor.pl / prep_env.pl эту
          # директорию не заполняют, поэтому линкуем системные бинарники
          # туда вручную.
          RAPTOR_BIN="$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor/linux-x86_64/bin"
          mkdir -p "$RAPTOR_BIN"
          for tool in bash sh perl make; do
            SYS_PATH=$(command -v "$tool" || true)
            if [ -n "$SYS_PATH" ] && [ ! -e "$RAPTOR_BIN/$tool" ]; then
              ln -s "$SYS_PATH" "$RAPTOR_BIN/$tool"
              echo "Слинковал $tool -> $SYS_PATH"
            fi
          done
          ls -la "$RAPTOR_BIN"

      - name: Build elf2e32 (modern CMake port)
        run: |
          set -e
          # Ванильный elf2e32 (из oss.FCL.interim.SFTools.LinuxBuild) писан
          # под GCC ~4.x и Raptor не пробрасывает флаги компилятора
          # (-fpermissive, -I) в реальный вызов GCC для этого MMP — что
          # вызывало бесконечную цепочку ошибок компиляции/заголовков.
          # Вместо патчинга устаревшего кода используем готовый современный
          # порт (C++14, собирается напрямую через CMake, без Raptor):
          # https://github.com/fedor4ever/elf2e32
          echo "Клонирую fedor4ever/elf2e32 (современный порт под GCC/CMake)..."
          git clone --depth 1 https://github.com/fedor4ever/elf2e32.git /tmp/elf2e32-modern \
            || { echo "::error::Не удалось склонировать fedor4ever/elf2e32."; exit 1; }
          cd /tmp/elf2e32-modern
          mkdir -p build && cd build
          # e32imagefile.cpp содержит:
          #   #ifndef __LINUX__
          #       #include <io.h>   // заголовок MSVC/MinGW, на Linux не существует
          #   #endif
          # Макрос __LINUX__ — не встроенный в GCC (в отличие от __linux__ с
          # маленькой буквы) и должен выставляться сборочной системой; в
          # этой версии CMakeLists.txt он, похоже, не определяется сам,
          # поэтому передаём его явно через флаги компилятора.
          echo "Использования __LINUX__ в дереве (для диагностики):"
          grep -rn "__LINUX__" ../source | head -10 || true
          # Страховка: если -Werror выставлен внутри CMakeLists.txt через
          # target_compile_options (а не через CMAKE_CXX_FLAGS), наши флаги
          # командной строки могут не перекрыть его из-за порядка аргументов
          # компилятора. Вырезаем -Werror из CMakeLists.txt напрямую.
          echo "Ищу -Werror в CMakeLists.txt..."
          grep -rn "Werror" ../CMakeLists.txt 2>/dev/null || true
          find .. -maxdepth 2 -iname "CMakeLists.txt" -exec sed -i -E 's/-Werror(=[A-Za-z0-9_-]+)?//g' {} \;
          # Ряд файлов в этом дереве вызывает memcpy/memset/strlen/strcpy
          # и т.п. (или использует std::string), но не подключает <cstring>
          # / <string> напрямую — раньше это "протекало" транзитивно через
          # другие системные заголовки в старых libstdc++, но GCC 13 эти
          # транзитивные инклюды убрал, отчего сборка падает с
          # "‘memcpy’/‘memset’ was not declared" или "‘string’ in namespace
          # ‘std’ does not name a type". Патчим и .cpp, и .h/.hpp сразу
          # (например pl_elfimage.h использует std::string без #include
          # <string>), чтобы не гоняться по одному файлу за прогон CI.
          echo "Проверяю .cpp/.h файлы на использование <cstring>/<string> без явного include..."
          for f in $(grep -lE '\b(memcpy|memset|memmove|strlen|strcpy|strncpy|strcmp|strncmp|strcat)\s*\(' ../source/*.cpp ../source/*.h ../include/*.h 2>/dev/null); do
            if ! grep -q "#include <cstring>" "$f"; then
              echo "  добавляю #include <cstring> в $f"
              sed -i '1i #include <cstring>' "$f"
            fi
          done
          for f in $(grep -lE '\bstd::string\b' ../source/*.cpp ../source/*.h ../include/*.h 2>/dev/null); do
            if ! grep -q "#include <string>" "$f"; then
              echo "  добавляю #include <string> в $f"
              sed -i '1i #include <string>' "$f"
            fi
          done
          # stricmp/strnicmp — это MSVC/Windows-специфичные функции, их нет
          # в glibc на Linux вообще (POSIX-эквиваленты — strcasecmp/
          # strncasecmp из <strings.h>). Заменяем имена прямо в исходниках
          # и подключаем <strings.h> туда, где они встречаются.
          echo "Заменяю stricmp/strnicmp (MSVC-специфика) на strcasecmp/strncasecmp (POSIX)..."
          for f in $(grep -lE '\b(stricmp|strnicmp)\s*\(' ../source/*.cpp ../source/*.h ../include/*.h 2>/dev/null); do
            echo "  патчу $f"
            sed -i -E 's/\bstrnicmp\b/strncasecmp/g; s/\bstricmp\b/strcasecmp/g' "$f"
            if ! grep -q "#include <strings.h>" "$f"; then
              sed -i '1i #include <strings.h>' "$f"
            fi
          done
          # Реальная ошибка (не warning, не -Werror-превращение) —
          # e32info.cpp:490 приводит разность указателей (64-битный
          # ptrdiff_t) напрямую к uint32_t, что GCC 13 в 64-битной сборке
          # считает потерей точности и требует явного -fpermissive (сам
          # компилятор подсказывает это в сообщении "[-fpermissive]").
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-D__LINUX__ -Wno-error -Wno-error=format -fpermissive" \
            -DCMAKE_C_FLAGS="-D__LINUX__ -Wno-error -Wno-error=format -fpermissive" \
            2>&1 | tee "$GITHUB_WORKSPACE/build_elf2e32.log" \
            || { echo "::error::cmake configure для elf2e32 завершился с ошибкой. См. build_elf2e32.log."; exit 1; }
          cmake --build . --config Release -j"$(nproc)" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_elf2e32.log" \
            || { echo "::error::Сборка elf2e32 завершилась с ошибкой. См. build_elf2e32.log."; exit 1; }
          BIN=$(find . -maxdepth 2 -iname "elf2e32*" -type f -executable | head -n1)
          if [ -z "$BIN" ]; then
            echo "::error::Сборка elf2e32 прошла без ошибок, но бинарник не найден — проверьте build_elf2e32.log."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/epocroot/epoc32/tools"
          cp "$BIN" "$GITHUB_WORKSPACE/epocroot/epoc32/tools/elf2e32"
          chmod +x "$GITHUB_WORKSPACE/epocroot/epoc32/tools/elf2e32"
          echo "elf2e32 собран и установлен: $GITHUB_WORKSPACE/epocroot/epoc32/tools/elf2e32"
          cd /tmp/elf2e32-modern
          rm -rf build
          df -h /

      - name: Clone e32tools sources (makesis, petran)
        run: |
          set -e
          # elf2e32 теперь собирается отдельно (см. предыдущий шаг), а
          # makesis/petran по-прежнему берём из ванильного дерева и
          # собираем через Raptor — они пока не вызывали таких проблем
          # совместимости с современным GCC, как elf2e32.
          echo "Клонирую e32tools (+ imgtools, от которого зависят seclib/setcap) из oss.FCL.interim.SFTools.LinuxBuild..."
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SymbianSource/oss.FCL.interim.SFTools.LinuxBuild.git /tmp/sftools-linuxbuild \
            || { echo "::error::Не удалось склонировать oss.FCL.interim.SFTools.LinuxBuild."; exit 1; }
          cd /tmp/sftools-linuxbuild
          # imgtools нужен как зависимость (seclib.cpp includes e32image.h,
          # setcap.cpp includes h_utl.h — оба физически лежат в imgtools/imglib),
          # даже если сами imgtools-инструменты нам не нужны.
          git sparse-checkout set e32tools imgtools
          echo "Содержимое /tmp/sftools-linuxbuild после sparse-checkout:"
          ls -la
          echo "--- e32tools (верхний уровень) ---"
          ls -la e32tools 2>/dev/null || echo "  (e32tools отсутствует или пуст!)"
          echo "Копирую e32tools и imgtools в epocroot/ ..."
          cp -r e32tools "$GITHUB_WORKSPACE/epocroot/e32tools"
          cp -r imgtools "$GITHUB_WORKSPACE/epocroot/imgtools"
          # elf2e32 больше не собираем этим путём — исключаем его из
          # группового bld.inf, если он там указан, чтобы Raptor не
          # пытался собрать заведомо проблемный ванильный код.
          rm -rf "$GITHUB_WORKSPACE/epocroot/e32tools/elf2e32"
          echo "--- Структура epocroot/e32tools после копирования ---"
          find "$GITHUB_WORKSPACE/epocroot/e32tools" -maxdepth 4 -type d | sort
          echo "--- bld.inf внутри epocroot/e32tools ---"
          find "$GITHUB_WORKSPACE/epocroot/e32tools" -iname "bld.inf"
          if [ -z "$(find "$GITHUB_WORKSPACE/epocroot/e32tools" -iname "bld.inf")" ]; then
            echo "::error::Ни одного bld.inf не найдено внутри epocroot/e32tools после клонирования — структура репозитория oss.FCL.interim.SFTools.LinuxBuild отличается от ожидаемой, либо sparse-checkout сработал не так, как задумано."
            exit 1
          fi

      - name: Build e32tools (makesis, petran) with Raptor
        working-directory: epocroot/e32tools
        run: |
          set -e
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          export SBS_HOME="$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor"
          export PATH="$SBS_HOME/bin:$PATH"
          # Собираем makesis и petran по отдельности через их собственные
          # bld.inf, а не общий групповой bld.inf всего e32tools — общий
          # bld.inf тащит и seclib/setcap, которые зависят от imgtools и
          # могут падать независимо от того, собрался ли реально нужный
          # нам makesis. Так сбой в одном компоненте не маскирует и не
          # блокирует сборку другого.
          echo "Компоненты внутри e32tools:"
          find . -maxdepth 2 -iname "bld.inf"
          echo "--- Полная структура epocroot/e32tools (для диагностики) ---"
          find . -maxdepth 4 -type d | sort
          echo "--- Все bld.inf где угодно внутри e32tools ---"
          find . -iname "bld.inf"
          for tool in makesis petran; do
            BLDINF=$(find . -ipath "*$tool*bld.inf" | head -n1)
            if [ -z "$BLDINF" ]; then
              echo "::warning::bld.inf для $tool не найден — пропускаю."
              continue
            fi
            echo "Собираю $tool из $BLDINF (конфигурация tools2)..."
            (cd "$(dirname "$BLDINF")" && \
              sbs -c tools2 2>&1 | tee -a "$GITHUB_WORKSPACE/build_e32tools.log") \
              || echo "::warning::Сборка $tool через tools2 завершилась с ошибкой, см. build_e32tools.log."
          done

      - name: Locate sbs / makesis / elf2e32 binaries
        id: tools
        run: |
          set -e
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          echo "Ищу собранные инструменты..."
          SBS=$(find "$GITHUB_WORKSPACE/epocroot" -iname "sbs" -type f 2>/dev/null | grep -v "\.pl$\|\.pm$" | head -n1 || true)
          # Внутри symbian-build есть тестовые фикстуры с именами вроде
          # makesis.exe/elf2e32 под .../tests/data/... (заглушки для юнит-тестов
          # питоновских хелперов, не настоящие бинарники) — их нужно
          # исключить, иначе find может найти фикстуру раньше настоящего
          # инструмента и упаковка .sis молча ничего не создаст. Также ищем
          # в первую очередь в epoc32/tools, куда Raptor кладёт собранные
          # host-утилиты (makesis из свежесобранного epocroot/e32tools).
          MAKESIS=$(find "$GITHUB_WORKSPACE/epocroot/epoc32/tools" -iname "makesis*" -type f -executable 2>/dev/null | head -n1 || true)
          if [ -z "$MAKESIS" ]; then
            MAKESIS=$(find "$GITHUB_WORKSPACE/epocroot" -iname "makesis*" -type f -executable 2>/dev/null \
              | grep -viE "/tests?/|/test_data/|/data/" | head -n1 || true)
          fi
          ELF2E32="$GITHUB_WORKSPACE/epocroot/epoc32/tools/elf2e32"
          if [ ! -x "$ELF2E32" ]; then
            echo "::warning::elf2e32 не найден по ожидаемому пути после сборки (см. шаг 'Build elf2e32 (modern CMake port)')."
            ELF2E32=""
          fi
          if [ -z "$MAKESIS" ]; then
            echo "::warning::Не найден makesis вне тестовых фикстур, откатываюсь на первый попавшийся."
            MAKESIS=$(find "$GITHUB_WORKSPACE/epocroot" -iname "makesis*" -type f -executable 2>/dev/null | head -n1 || true)
          fi
          echo "sbs: $SBS"
          echo "makesis: $MAKESIS"
          echo "elf2e32: $ELF2E32"
          if [ -z "$SBS" ]; then
            echo "::error::sbs не найден после сборки Raptor. Собрать vNES невозможно без него."
            exit 1
          fi
          # sbs — это shell-обёртка (Raptor/Talon), а не одиночный бинарник:
          # она сама ищет соседние файлы (raptor/bin/sbs и т.п.) относительно
          # SBS_HOME, который нужно передать явно, иначе обёртка падает
          # с "No such file or directory" на относительном пути.
          SBS_HOME_DIR=$(dirname "$(dirname "$SBS")")
          echo "SBS_HOME (вычислен): $SBS_HOME_DIR"
          echo "sbs=$SBS" >> "$GITHUB_OUTPUT"
          echo "sbs_home=$SBS_HOME_DIR" >> "$GITHUB_OUTPUT"
          echo "makesis=$MAKESIS" >> "$GITHUB_OUTPUT"
          echo "elf2e32=$ELF2E32" >> "$GITHUB_OUTPUT"

      - name: Populate missing HOSTPLATFORM_DIR bin (bash/make/python for Raptor)
        run: |
          set -e
          SBS_HOME="${{ steps.tools.outputs.sbs_home }}"
          # gethost.sh должен определять HOSTPLATFORM_DIR (обычно linux-x86_64)
          # и Raptor ожидает найти там bash/make/python2/talon и т.п. — но
          # gethost.sh в этом дереве падает на 32-битном тесте
          # ("/lib/libc.so.6: No such file or directory"), поэтому каталог
          # не заполняется. Создаём его сами и кладём туда симлинки на
          # системные инструменты хоста, которые оригинальный Raptor обычно
          # поставлял в комплекте.
          PLATFORM_DIR="$SBS_HOME/linux-x86_64"
          echo "Создаю $PLATFORM_DIR/bin и заполняю симлинками на системные утилиты..."
          mkdir -p "$PLATFORM_DIR/bin"
          for tool in bash make python3 perl sh; do
            SYS_PATH=$(command -v "$tool" || true)
            if [ -n "$SYS_PATH" ]; then
              ln -sf "$SYS_PATH" "$PLATFORM_DIR/bin/$tool"
              echo "  $tool -> $SYS_PATH"
            else
              echo "::warning::системный $tool не найден, пропускаю"
            fi
          done
          # Raptor часто ищет "python" (без версии) и "make" под конкретными
          # именами — на всякий случай добавляем алиас python -> python3.
          if [ ! -e "$PLATFORM_DIR/bin/python" ] && command -v python3 >/dev/null; then
            ln -sf "$(command -v python3)" "$PLATFORM_DIR/bin/python"
          fi
          echo "Итоговое содержимое $PLATFORM_DIR/bin:"
          ls -la "$PLATFORM_DIR/bin"

      - name: Symlink /epoc32 -> real EPOCROOT/epoc32
        run: |
          set -e
          set -o pipefail
          # vnes.mmp (и, вероятно, другие .mmp/.rss в дереве Raptor) используют
          # SYSTEMINCLUDE /epoc32/include — абсолютный путь от корня файловой
          # системы. Такой синтаксис предполагает классическую Symbian-машину,
          # где EPOCROOT смонтирован как "/" (см. akaWolf-Wiki: "if your
          # EPOCROOT is / (as is typical), your SYSTEMINCLUDE path will be
          # /epoc32/include/stdapis"). У нас EPOCROOT — это подкаталог
          # $GITHUB_WORKSPACE/epocroot/, а не "/", поэтому /epoc32/include
          # физически не существовал — судя по всему, именно из-за этого
          # Raptor молча не находил валидный toolset/цель для сборки и
          # отрабатывал "0 секунд, no warnings or errors" без явной ошибки.
          REAL_EPOC32="$GITHUB_WORKSPACE/epocroot/epoc32"
          if [ ! -d "$REAL_EPOC32/include" ]; then
            echo "::error::$REAL_EPOC32/include не существует — PDK не распакован до этого шага, симлинк ставить некуда."
            exit 1
          fi
          echo "Создаю симлинк /epoc32 -> $REAL_EPOC32 ..."
          sudo ln -sfn "$REAL_EPOC32" /epoc32
          # Жёстко проверяем, что симлинк реально работает, а не просто
          # "создан" — раньше ошибка тут тонула в пайпе с head, и set -e
          # её не ловил, из-за чего Raptor молча собирал 0 файлов.
          if [ -z "$(ls -A /epoc32/include 2>/dev/null)" ]; then
            echo "::error::/epoc32/include пуст после создания симлинка — проверка провалена."
            ls -la /epoc32 || true
            exit 1
          fi
          echo "Симлинк подтверждён, содержимое /epoc32/include:"
          # С pipefail "ls | head -5" даёт SIGPIPE -> Broken pipe -> exit 2,
          # как только head закрывает дескриптор после 5 строк — и шаг падает
          # на чисто диагностическом выводе. Отключаем pipefail только на
          # время этой команды.
          set +o pipefail
          ls -la /epoc32/include | head -5
          set -o pipefail

      - name: Clear stale Raptor toolcheck/makefile caches
        run: |
          set -e
          # Если PDK/симлинк /epoc32 появились ПОСЛЕ того, как Raptor уже
          # закэшировал результат парсинга toolset (toolcheck_cache_.tmp)
          # или сгенерированные Makefile_all.* из предыдущего неудачного
          # прогона (одна и та же рабочая директория раннера), Raptor может
          # посчитать конфигурацию "up-to-date" и повторно выдать пустые
          # Makefile ("Nothing to be done for 'TARGET'") — тот самый
          # мгновенный "0 seconds, no warnings or errors" без единого
          # скомпилированного файла. Чистим кэш явно перед реальной сборкой.
          EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          find "${EPOCROOT}epoc32/build" -maxdepth 1 \( -name 'toolcheck_cache_*' -o -name 'Makefile_all*' -o -name 'Makefile.*.log' \) -print -delete 2>/dev/null || true

      - name: Build vNES with sbs
        working-directory: vnes-src/src/group
        run: |
          set -e
          set -o pipefail
          export EPOCROOT="$GITHUB_WORKSPACE/epocroot/"
          export SBS_HOME="${{ steps.tools.outputs.sbs_home }}"
          export PATH="$SBS_HOME/bin:${{ steps.gcce.outputs.gcce_bin_dir }}:$PATH"
          export "SBS_GCCE${{ steps.gcce.outputs.gcce_ver_key }}BIN"="${{ steps.gcce.outputs.gcce_bin_dir }}"
          echo "EPOCROOT=$EPOCROOT"
          echo "SBS_HOME=$SBS_HOME"
          echo "SBS_GCCE${{ steps.gcce.outputs.gcce_ver_key }}BIN=${{ steps.gcce.outputs.gcce_bin_dir }}"
          echo "Собираю из group/bld.inf (нативный Symbian-фронтенд, написан вручную взамен Qt)."
          ls -la
          # На случай, если Raptor считает цель "up-to-date" по кэшу из
          # предыдущего прогона (что тоже дало бы "0 секунд, no warnings")
          # — явно чистим build-кэш перед реальной попыткой сборки.
          echo "Чищу возможный кэш предыдущих сборок в epoc32/build..."
          rm -rf "$GITHUB_WORKSPACE/epocroot/epoc32/build"
          # Короткий алиас armv5_urel разворачивается Raptor'ом в
          # arm.v5.urel.rvct2_2 — то есть RVCT-компилятор, а не GCCE
          # (см. akaWolf-Wiki: "wherever armv5_urel is used, Raptor will
          # know that is really means arm.v5.urel.rvct2_2"). Наш bld.inf
          # заявляет "PRJ_PLATFORMS GCCE" — платформу, отличную от RVCT,
          # поэтому Raptor тихо пропускал компонент ("no warnings or
          # errors", "Run time 0 seconds"), не находя для него совпадающей
          # конфигурации, вместо явной ошибки.
          # Правильный синтаксис для GCCE — полное имя конфигурации
          # arm.v5.<variant>.gcce<version_with_underscores>, например
          # arm.v5.urel.gcce4_4_1 (см. akaWolf-Wiki Fshell/Getting Started).
          # Версия компилятора у нас — 12.1.0 (та же, что задаёт
          # SBS_GCCE1210BIN), поэтому используем arm.v5.urel.gcce12_1_0.
          # ИСПРАВЛЕНО: изначально сюда был добавлен позиционный аргумент
          # "TARGET" в предположении, что это специальное what-имя sbs,
          # включающее компиляцию/линковку ("TARGET Create main
          # executables"). На деле sbs принимает what-имена только в
          # нижнем регистре (target, а не TARGET), а переданный "как есть"
          # аргумент Raptor интерпретировал не как what-имя, а как имя
          # MAKE-цели и пытался вызвать её во всех сгенерированных
          # Makefile_all.* — отсюда "make: Nothing to be done for
          # 'TARGET'" и отсутствие .compile/.target части в makefile.
          # Без лишних аргументов sbs по умолчанию и так строит полный
          # набор фаз (export/bitmap/resource/library/target/final), так
          # что явный "what" здесь не нужен вовсе.
          echo "--- Проверка epoc32/tools/variant/variant.cfg (ENABLE_ABIV2_MODE) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          # akaWolf-Wiki Raptor Quick Start troubleshooting checklist:
          # "Check that the EPOCROOT directory contains the file
          # epoc32/tools/variant/variant.cfg and that the file includes:
          # epoc32\include\variant\Symbian_OS.hrh ENABLE_ABIV2_MODE" —
          # без этого Raptor может успешно распарсить bld.inf, но не
          # сгенерировать makefile для реальной ARM-компиляции (что
          # совпадает с нашим симптомом: discovery находит только 5
          # generic makefile'ов, без .target).
          VARIANT_CFG="$GITHUB_WORKSPACE/epocroot/epoc32/tools/variant/variant.cfg"
          if [ -f "$VARIANT_CFG" ]; then
            echo "variant.cfg найден, содержимое:" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
            cat "$VARIANT_CFG" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          else
            echo "variant.cfg НЕ НАЙДЕН по пути $VARIANT_CFG — создаю согласно требованию Raptor." | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
            mkdir -p "$(dirname "$VARIANT_CFG")"
            echo 'epoc32\include\variant\Symbian_OS.hrh ENABLE_ABIV2_MODE' > "$VARIANT_CFG"
            cat "$VARIANT_CFG" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          fi
          echo "Абсолютный путь к bld.inf: $(pwd)/bld.inf"
          echo "--- Поиск ВЫЗОВОВ WriteConfiguredSpec (кто передаёт specs — откуда берётся spec для 'target') ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          grep -n "WriteConfiguredSpec(" "$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor/python/raptor_make.py" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Метод, вызывающий WriteConfiguredSpec в цикле (где формируется список specs по типам) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          grep -n "for spec in\|GetSpecs\|def Write\b\|def WriteMakefiles\|self.specs\b" "$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor/python/raptor_make.py" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Полный метод, непосредственно вызывающий WriteConfiguredSpec (30 строк контекста) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          grep -n "WriteConfiguredSpec(" -B25 "$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor/python/raptor_make.py" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Дерево epoc32/release (все платформы, какие реально распакованы из PDK) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          find "$GITHUB_WORKSPACE/epocroot/epoc32/release" -maxdepth 2 -type d 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          echo "--- Проверка наличия LIBRARY-зависимостей из vnes.mmp под ARM/GCCE (не WINSCW-эмулятор) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          for lib in euser apparc cone eikcore avkon fbscli ws32 gdi bafl efsrv estor; do
            FOUND_LIB=$(find "$GITHUB_WORKSPACE/epocroot/epoc32/release" \( -path "*armv5*" -o -path "*arm4*" -o -path "*gcce*" \) \
              \( -iname "${lib}.lib" -o -iname "${lib}.dso" \) 2>/dev/null | head -n1)
            if [ -z "$FOUND_LIB" ]; then
              echo "  ОТСУТСТВУЕТ под ARM: ${lib}.lib/.dso" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
            else
              echo "  найден: $FOUND_LIB" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
            fi
          done
          # ВАЖНО: "TARGET" здесь — НЕ ключевое слово sbs, включающее
          # компиляцию/линковку. sbs понимает только lowercase what-имена
          # (export, library, target, final, clean, ...), а переданный
          # позиционный аргумент без "--" Raptor трактует как ИМЯ MAKE-ЦЕЛИ,
          # которую нужно передать во все сгенерированные Makefile_all.* —
          # такой цели там нет, отсюда "make: Nothing to be done for
          # 'TARGET'" и makefile без .target/.compile части. По умолчанию
          # (без каких-либо what-аргументов) sbs и так строит полный набор
          # фаз: export, bitmap, resource, library, target (компиляция +
          # линковка) и final — поэтому просто не передаём лишний аргумент.
          # ДИАГНОСТИКА (добавлено после того как отсутствие TARGET не
          # решило проблему — 5 generic makefile'ов генерируются, но ни
          # один компонент/mmp не был реально обнаружен и обработан):
          # проверяем, что сам sbs видит про доступные конфигурации и
          # интерфейсы, прежде чем гадать дальше вслепую.
          echo "--- raptor_meta.py: контекст обработки PRJ_PLATFORMS (где решается, подходит ли платформа GCCE) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          grep -n -i "platform" "$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor/python/raptor_meta.py" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- raptor_meta.py: контекст обработки PRJ_MMPFILES (где извлекаются mmp-имена из bld.inf) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          grep -n -i "mmpfiles\|prj_mmp" "$GITHUB_WORKSPACE/epocroot/build/sbsv2/raptor/python/raptor_meta.py" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Прямой запуск препроцессора над bld.inf (то же, что видит Raptor после макроподстановки) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          # ВАЖНО: не определяем макрос -DGCCE здесь — если это сделать,
          # препроцессор заменит буквальное слово "GCCE" в тексте bld.inf
          # (в PRJ_PLATFORMS GCCE) на "1", создавая ложное впечатление
          # проблемы, которую сам этот диагностический вызов и вызвал.
          gcc -E -x c -undef -I"$GITHUB_WORKSPACE/epocroot/epoc32/include" -I"$GITHUB_WORKSPACE/epocroot/epoc32/include/variant" "$(pwd)/bld.inf" 2>&1 | grep -v "^#" | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          "${{ steps.tools.outputs.sbs }}" -b "$(pwd)/bld.inf" -c arm.v5.urel.gcce12_1_0 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" \
            || { echo "::error::Компиляция vNES завершилась с ошибкой. См. build_vnes.log."; exit 1; }
          # -d по неясной причине не даёт debug-вывода в этой версии/сборке
          # Raptor (несмотря на то что usage sbs его документирует). Вместо
          # гадания с флагами — смотрим напрямую на то, что Raptor реально
          # сгенерировал: список Makefile_all.* (какие подцели существуют —
          # если среди них нет .target, значит компонент в принципе не
          # прошёл этап makefile generation для реальной компиляции) и
          # содержимое самого makefile для целевой платформы/конфигурации.
          echo "--- Список Makefile_all.* в epoc32/build ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          find "$GITHUB_WORKSPACE/epocroot/epoc32/build" -iname "Makefile_all*" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          echo "--- Содержимое основного XML build-лога Raptor (Makefile.<timestamp>.log) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          find "$GITHUB_WORKSPACE/epocroot/epoc32/build" -iname "Makefile.20*.log" -exec cat {} \; 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Вся структура epoc32/build (для диагностики) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          find "$GITHUB_WORKSPACE/epocroot/epoc32/build" 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          echo "--- Содержимое Makefile_all.target (если существует) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          find "$GITHUB_WORKSPACE/epocroot/epoc32/build" -iname "Makefile_all.target" -exec cat {} \; 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Содержимое bldinf.p_*.d (что Raptor распознал из bld.inf) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          find "$GITHUB_WORKSPACE/epocroot/epoc32/build" -iname "bldinf.p_*.d" -exec cat {} \; 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Содержимое toolcheck_cache_.tmp (результат проверки toolset) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          find "$GITHUB_WORKSPACE/epocroot/epoc32/build" -iname "toolcheck_cache*" -exec cat {} \; 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true
          echo "--- Содержимое Makefile_all (главный, показывает какие подцели считаются нужными) ---" | tee -a "$GITHUB_WORKSPACE/build_vnes.log"
          find "$GITHUB_WORKSPACE/epocroot/epoc32/build" -iname "Makefile_all" ! -iname "*.stderr" -exec cat {} \; 2>&1 | tee -a "$GITHUB_WORKSPACE/build_vnes.log" || true

      - name: Verify vNES binaries were actually built
        run: |
          set -e
          # sbs может отработать "no warnings or errors" за 0 секунд, если
          # он ничего не собирал. Проверяем явно, что итоговый исполняемый
          # файл/DLL реально появился — иначе makesis дальше молча
          # упакует пустой .sis.
          echo "Ищу собранные бинарники vNES в epoc32/release..."
          FOUND=$(find "$GITHUB_WORKSPACE/epocroot/epoc32/release" -iname "vnes*" -type f 2>/dev/null || true)
          echo "$FOUND"
          if [ -z "$FOUND" ]; then
            echo "::error::Ни один бинарник vNES не найден в epoc32/release после сборки. sbs, судя по всему, ничего не скомпилировал (см. build_vnes.log)."
            echo "Содержимое epoc32/release (если есть):"
            find "$GITHUB_WORKSPACE/epocroot/epoc32/release" -maxdepth 3 2>/dev/null || echo "  (каталог release не существует)"
            exit 1
          fi
          echo "Собранные бинарники:"
          ls -la $FOUND

      - name: Generate self-signed cert
        run: |
          set -e
          mkdir -p cert
          openssl req -x509 -newkey rsa:2048 -keyout cert/vnes.key -out cert/vnes.pem \
            -days 3650 -nodes -subj "/CN=vNES Self-Signed/O=vNES/C=RU"

      - name: Package and sign .sis
        run: |
          set -e
          mkdir -p build
          PKG=$(find vnes-src/src/group -iname "*.pkg" | head -n1)
          if [ -z "$PKG" ]; then
            echo "::error::Не найден .pkg файл после сборки — sbs не создал пакет."
            exit 1
          fi
          echo "Найден .pkg: $PKG"
          "${{ steps.tools.outputs.makesis }}" "$PKG" build/vnes.sis \
            || { echo "::error::makesis завершился с ошибкой."; exit 1; }
          if [ ! -f build/vnes.sis ]; then
            echo "::error::makesis отработал без ошибки, но build/vnes.sis не создан (возможно, найден не тот makesis — см. шаг 'Locate sbs / makesis / elf2e32 binaries')."
            exit 1
          fi
          SIGNSIS=$(find epocroot -iname "signsis*" -type f -executable 2>/dev/null | head -n1 || true)
          if [ -n "$SIGNSIS" ]; then
            "$SIGNSIS" -S build/vnes.sis build/vnes_signed.sis cert/vnes.pem cert/vnes.key || \
              echo "::warning::signsis завершился с ошибкой, .sis остаётся неподписанным."
            if [ -f build/vnes_signed.sis ]; then
              mv build/vnes_signed.sis build/vnes.sis
            else
              echo "::warning::signsis не создал build/vnes_signed.sis, .sis остаётся неподписанным."
            fi
          else
            echo "::warning::signsis не найден, .sis остаётся неподписанным."
          fi
          ls -lh build/

      - name: Upload build logs (always, for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_raptor.log
            build_elf2e32.log
            build_e32tools.log
            build_vnes.log
            pdk_extract_logs/
          if-no-files-found: ignore

      - name: Upload .sis artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnes-sis
          path: build/vnes.sis
          if-no-files-found: error
