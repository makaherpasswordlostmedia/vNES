          cat > symbian/core/nes_ppu.cpp <<'VNES_EOF'
          // nes_ppu.cpp - scanline-based PPU.
          //
          // Each visible line is rendered in one go at its start from the current
          // v/t registers.  CPU time for the line then runs in three slices (up to the
          // sprite-0 hit, up to dot 257 where the scroll registers are reloaded, and the
          // remainder) so that split-screen effects behave like the hardware.
          #include "nes.h"
          #include "nes_palette.h"

          namespace nes {

          void Nes::PpuReset() {
              ppuCtrl_ = ppuMask_ = ppuStatus_ = oamAddr_ = ppuBuf_ = ppuLatch_ = 0;
              v_ = t_ = 0;
              fineX_ = w_ = 0;
              s0HitX_ = -1;
              for (int i = 0; i < 64; ++i) pal32_[i] = kNtscPalette[i];
              MemFill(oam_, 0, sizeof(oam_));
              MemFill(palRam_, 0x0F, sizeof(palRam_));
              UpdatePalOut();
          }

          void Nes::UpdatePalOut() {
              u32 mask = (ppuMask_ & 1) ? 0x30 : 0x3F;
              int emph = (ppuMask_ >> 5) & 7;
              for (int i = 0; i < 32; ++i) {
                  u32 c = pal32_[palRam_[i] & mask];
                  if (emph) {
                      u32 r = (c >> 16) & 0xFF, g = (c >> 8) & 0xFF, b = c & 0xFF;
                      // emphasised channel stays, the others are attenuated (~75 %)
                      if (!(emph & 1)) r = (r * 3) >> 2;
                      if (!(emph & 2)) g = (g * 3) >> 2;
                      if (!(emph & 4)) b = (b * 3) >> 2;
                      c = (r << 16) | (g << 8) | b;
                  }
                  palOut_[i] = c;
              }
          }

          void Nes::SetMirroring(int mode) {
              mirrorMode_ = (u8)mode;
              switch (mode) {
              case kMirrorHoriz: ntPtr_[0] = vram_; ntPtr_[1] = vram_; ntPtr_[2] = vram_ + 0x400; ntPtr_[3] = vram_ + 0x400; break;
              case kMirrorVert: ntPtr_[0] = vram_; ntPtr_[1] = vram_ + 0x400; ntPtr_[2] = vram_; ntPtr_[3] = vram_ + 0x400; break;
              case kMirrorSingle0: ntPtr_[0] = ntPtr_[1] = ntPtr_[2] = ntPtr_[3] = vram_; break;
              case kMirrorSingle1: ntPtr_[0] = ntPtr_[1] = ntPtr_[2] = ntPtr_[3] = vram_ + 0x400; break;
              default: ntPtr_[0] = vram_; ntPtr_[1] = vram_ + 0x400; ntPtr_[2] = vram_ + 0x800; ntPtr_[3] = vram_ + 0xC00; break;
              }
          }

          u8 Nes::PpuRead(u16 addr) {
              addr &= 0x3FFF;
              if (addr < 0x2000) return chrPtr_[(addr >> 10) & 7][addr & 0x3FF];
              if (addr < 0x3F00) return ntPtr_[(addr >> 10) & 3][addr & 0x3FF];
              u32 i = addr & 0x1F;
              if ((i & 3) == 0) i &= 0x0F;
              return palRam_[i];
          }

          void Nes::PpuWriteMem(u16 addr, u8 val) {
              addr &= 0x3FFF;
              if (addr < 0x2000) {
                  if (chrIsRam_) chrPtr_[(addr >> 10) & 7][addr & 0x3FF] = val;
              } else if (addr < 0x3F00) {
                  ntPtr_[(addr >> 10) & 3][addr & 0x3FF] = val;
              } else {
                  u32 i = addr & 0x1F;
                  if ((i & 3) == 0) i &= 0x0F;
                  palRam_[i] = (u8)(val & 0x3F);
                  UpdatePalOut();
              }
          }

          void Nes::PpuWrite(u16 reg, u8 val) {
              ppuLatch_ = val;
              switch (reg & 7) {
              case 0: {
                  u8 old = ppuCtrl_;
                  ppuCtrl_ = val;
                  t_ = (u16)((t_ & 0xF3FF) | ((val & 3) << 10));
                  if (!(old & 0x80) && (val & 0x80) && (ppuStatus_ & 0x80)) nmiPending_ = 1;
                  break; }
              case 1: ppuMask_ = val; UpdatePalOut(); break;
              case 3: oamAddr_ = val; break;
              case 4: oam_[oamAddr_++] = val; break;
              case 5:
                  if (!w_) { t_ = (u16)((t_ & 0xFFE0) | (val >> 3)); fineX_ = val & 7; w_ = 1; }
                  else { t_ = (u16)((t_ & 0x8C1F) | ((val & 7) << 12) | ((val & 0xF8) << 2)); w_ = 0; }
                  break;
              case 6:
                  if (!w_) { t_ = (u16)((t_ & 0x00FF) | ((val & 0x3F) << 8)); w_ = 1; }
                  else { t_ = (u16)((t_ & 0xFF00) | val); v_ = t_; w_ = 0; }
                  break;
              case 7:
                  PpuWriteMem(v_, val);
                  v_ = (u16)((v_ + ((ppuCtrl_ & 4) ? 32 : 1)) & 0x7FFF);
                  break;
              default: break;
              }
          }

          u8 Nes::PpuReadReg(u16 reg) {
              u8 r;
              switch (reg & 7) {
              case 2:
                  r = (u8)((ppuStatus_ & 0xE0) | (ppuLatch_ & 0x1F));
                  ppuStatus_ &= 0x7F;
                  w_ = 0;
                  ppuLatch_ = r;
                  return r;
              case 4: return oam_[oamAddr_];
              case 7: {
                  u16 addr = (u16)(v_ & 0x3FFF);
                  if (addr >= 0x3F00) {
                      r = PpuRead(addr);
                      ppuBuf_ = PpuRead((u16)(addr - 0x1000));
                  } else {
                      r = ppuBuf_;
                      ppuBuf_ = PpuRead(addr);
                  }
                  v_ = (u16)((v_ + ((ppuCtrl_ & 4) ? 32 : 1)) & 0x7FFF);
                  ppuLatch_ = r;
                  return r; }
              default: return ppuLatch_;
              }
          }

          void Nes::FillBackdrop(int y) {
              u32* dst = fb_ + y * kScreenW;
              u32 c = palOut_[0];
              for (int x = 0; x < kScreenW; ++x) dst[x] = c;
          }

          void Nes::IncV() {
              if ((v_ & 0x7000) != 0x7000) {
                  v_ = (u16)(v_ + 0x1000);
              } else {
                  v_ &= 0x8FFF;
                  u32 cy = (v_ & 0x03E0) >> 5;
                  if (cy == 29) { cy = 0; v_ ^= 0x0800; }
                  else if (cy == 31) cy = 0;
                  else ++cy;
                  v_ = (u16)((v_ & ~0x03E0) | (cy << 5));
              }
          }

          void Nes::EndLineScroll(int line) {
              if (!Rendering() || (line >= 240 && line != 261)) return;
              if (line < 240) IncV();
              v_ = (u16)((v_ & 0xFBE0) | (t_ & 0x041F));
              if (line == 261) v_ = (u16)((v_ & 0x841F) | (t_ & 0x7BE0));
          }

          void Nes::RenderLine(int y, bool render) {
              const bool bgOn = (ppuMask_ & 0x08) != 0;
              const bool sprOn = (ppuMask_ & 0x10) != 0;
              s0HitX_ = -1;
              if (!bgOn && !sprOn) {
                  if (render) FillBackdrop(y);
                  return;
              }
              const bool mmc2 = (mapperId_ == 9 || mapperId_ == 10);

              // ---- background ----
              if (bgOn) {
                  u32 cx = v_ & 31, cy = (v_ >> 5) & 31, nt = (v_ >> 10) & 3, fy = (v_ >> 12) & 7;
                  const u32 base = (ppuCtrl_ & 0x10) ? 0x1000 : 0;
                  u8* out = lineBg_;
                  for (int tile = 0; tile < 33; ++tile) {
                      const u8* ntp = ntPtr_[nt];
                      u32 idx = ntp[(cy << 5) | cx];
                      u32 at = ntp[0x3C0 | ((cy >> 2) << 3) | (cx >> 2)];
                      u32 pbits = ((at >> (((cy & 2) << 1) | (cx & 2))) & 3) << 2;
                      u32 pa = base + idx * 16 + fy;
                      const u8* cp = chrPtr_[pa >> 10] + (pa & 0x3FF);
                      u32 lo = cp[0], hi = cp[8];
                      if (mmc2) MapperPpuFetch((u16)(pa + 8));
                      if ((lo | hi) == 0) {
                          out[0] = out[1] = out[2] = out[3] = out[4] = out[5] = out[6] = out[7] = 0;
                      } else {
                          for (int b = 0; b < 8; ++b) {
                              u32 sh = 7 - b;
                              u32 pix = ((lo >> sh) & 1) | (((hi >> sh) & 1) << 1);
                              out[b] = (u8)(pix ? (pbits | pix) : 0);
                          }
                      }
                      out += 8;
                      if (++cx == 32) { cx = 0; nt ^= 1; }
                  }
              } else {
                  MemFill(lineBg_, 0, 264);
              }

              // ---- sprites ----
              MemFill(lineSpr_, 0, 264);
              if (sprOn) {
                  const int h = (ppuCtrl_ & 0x20) ? 16 : 8;
                  int count = 0;
                  for (int i = 0; i < 64; ++i) {
                      const u8* o = oam_ + i * 4;
                      int row = y - (o[0] + 1);
                      if (row < 0 || row >= h) continue;
                      if (++count > 8) { ppuStatus_ |= 0x20; break; }
                      u32 tile = o[1];
                      u8 attr = o[2];
                      int sx = o[3];
                      if (attr & 0x80) row = h - 1 - row;
                      u32 pa;
                      if (h == 8) pa = ((ppuCtrl_ & 8) ? 0x1000 : 0) + tile * 16 + row;
                      else pa = ((tile & 1) ? 0x1000 : 0) + (tile & 0xFE) * 16 + (row & 7) + ((row & 8) ? 16 : 0);
                      const u8* cp = chrPtr_[pa >> 10] + (pa & 0x3FF);
                      u32 lo = cp[0], hi = cp[8];
                      if (mmc2) MapperPpuFetch((u16)(pa + 8));
                      if ((lo | hi) == 0) continue;
                      u32 flags = 0x10 | ((attr & 3) << 2) | ((attr & 0x20) ? 0x20 : 0) | (i == 0 ? 0x40 : 0);
                      for (int b = 0; b < 8; ++b) {
                          int x = sx + b;
                          if (x > 255) break;
                          u32 sh = (attr & 0x40) ? b : 7 - b;
                          u32 pix = ((lo >> sh) & 1) | (((hi >> sh) & 1) << 1);
                          if (!pix || lineSpr_[x]) continue;
                          lineSpr_[x] = (u8)(flags | pix);
                      }
                  }
              }

              // ---- compose ----
              const bool bgLeft = (ppuMask_ & 2) != 0, sprLeft = (ppuMask_ & 4) != 0;
              const u8* bg = lineBg_ + fineX_;
              u32* dst = fb_ + y * kScreenW;
              for (int x = 0; x < 256; ++x) {
                  u32 b = bg[x];
                  u32 s = lineSpr_[x];
                  if (x < 8) {
                      if (!bgLeft) b = 0;
                      if (!sprLeft) s = 0;
                  }
                  u32 ci;
                  if (!s) {
                      ci = b;
                  } else {
                      if ((s & 0x40) && b && x != 255 && s0HitX_ < 0) s0HitX_ = x;
                      if (!b) ci = s & 0x1F;
                      else ci = (s & 0x20) ? b : (s & 0x1F);
                  }
                  if (render) dst[x] = palOut_[ci];
              }
          }

          void Nes::RunScanline(int line, bool render) {
              if (line == 241) {
                  ppuStatus_ |= 0x80;
                  if (ppuCtrl_ & 0x80) nmiPending_ = 1;
              } else if (line == 261) {
                  ppuStatus_ &= 0x1F;
              }
              s0HitX_ = -1;
              if (line < 240) RenderLine(line, render);

              s32 pos = 0;
              if (s0HitX_ >= 0) {
                  s32 d = s0HitX_ + 2;
                  CpuRun(d - pos);
                  pos = d;
                  ppuStatus_ |= 0x40;
              }
              CpuRun(257 - pos);
              EndLineScroll(line);
              if (Rendering() && (line < 240 || line == 261)) MapperScanline();
              CpuRun(341 - 257);
              ApuRunLine(341);
          }

          }  // namespace nes
          VNES_EOF
