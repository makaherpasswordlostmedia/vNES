          // nes_cpu.cpp - 6502 interpreter and CPU bus.
          #include "nes.h"
          #include "nes_cpu_table.h"

          namespace nes {

          u8 Nes::GetP(bool brk) const {
              return (u8)(fC_ | (fZ_ << 1) | (fI_ << 2) | (fD_ << 3) | (brk ? 0x10 : 0) | 0x20 | (fV_ << 6) | (fN_ << 7));
          }

          void Nes::SetP(u8 p) {
              fC_ = p & 1;
              fZ_ = (p >> 1) & 1;
              fI_ = (p >> 2) & 1;
              fD_ = (p >> 3) & 1;
              fV_ = (p >> 6) & 1;
              fN_ = (p >> 7) & 1;
          }

          u8 Nes::Read(u16 a) {
              if (a < 0x2000) return ram_[a & 0x7FF];
              if (a >= 0x8000) return prgPtr_[(a >> 13) & 3][a & 0x1FFF];
              if (a >= 0x6000) return prgRam_[a - 0x6000];
              return ReadSlow(a);
          }

          u8 Nes::ReadSlow(u16 a) {
              if (a < 0x4000) return PpuReadReg(a);
              if (a == 0x4015) return ApuReadStatus();
              if (a == 0x4016 || a == 0x4017) {
                  int i = a & 1;
                  u8 bit;
                  if (padStrobe_) {
                      bit = padState_[i] & 1;
                  } else {
                      bit = padShift_[i] & 1;
                      padShift_[i] = (u8)((padShift_[i] >> 1) | 0x80);
                  }
                  return (u8)(0x40 | bit);
              }
              return 0;
          }

          void Nes::Write(u16 a, u8 v) {
              if (a < 0x2000) { ram_[a & 0x7FF] = v; return; }
              if (a >= 0x8000) { MapperWrite(a, v); return; }
              if (a < 0x4000) { PpuWrite(a, v); return; }
              if (a < 0x4020) {
                  if (a == 0x4014) {
                      u16 base = (u16)(v << 8);
                      for (int i = 0; i < 256; ++i) oam_[(u8)(oamAddr_ + i)] = Read((u16)(base + i));
                      dotBudget_ -= 513 * 3;
                      cpuCycles_ += 513;
                  } else if (a == 0x4016) {
                      padStrobe_ = v & 1;
                      if (padStrobe_) {
                          padShift_[0] = padState_[0];
                          padShift_[1] = padState_[1];
                      }
                  } else {
                      ApuWrite(a, v);
                  }
                  return;
              }
              if (a >= 0x6000) prgRam_[a - 0x6000] = v;
              MapperWriteLow(a, v);
          }

          void Nes::CpuReset() {
              a_ = x_ = y_ = 0;
              sp_ = 0xFD;
              SetP(0x04);
              nmiPending_ = 0;
              dotBudget_ = 0;
              cpuCycles_ = 7;
              pc_ = (u16)(Read(0xFFFC) | (Read(0xFFFD) << 8));
          }

          void Nes::CpuRun(s32 dots) {
              dotBudget_ += dots;
              while (dotBudget_ > 0) {
                  u32 c = CpuStep();
                  cpuCycles_ += c;
                  dotBudget_ -= (s32)(c * 3);
              }
          }

          #define SETNZ(v) do { fZ_ = ((v) & 0xFF) == 0; fN_ = ((v) >> 7) & 1; } while (0)

          static inline u8 AdcCore(Nes* n, u8 val) {
              u32 sum = (u32)n->a_ + val + n->fC_;
              n->fV_ = (u8)((~(n->a_ ^ val) & (n->a_ ^ sum) & 0x80) != 0);
              n->fC_ = sum > 0xFF;
              n->a_ = (u8)sum;
              return n->a_;
          }

          u32 Nes::CpuStep() {
              if (nmiPending_) {
                  nmiPending_ = 0;
                  Push((u8)(pc_ >> 8)); Push((u8)pc_); Push(GetP(false));
                  fI_ = 1;
                  pc_ = (u16)(Read(0xFFFA) | (Read(0xFFFB) << 8));
                  return 7;
              }
              if (!fI_ && (mapIrq_ || fcIrq_ || dmc_.irq)) {
                  Push((u8)(pc_ >> 8)); Push((u8)pc_); Push(GetP(false));
                  fI_ = 1;
                  pc_ = (u16)(Read(0xFFFE) | (Read(0xFFFF) << 8));
                  return 7;
              }

              const u8 opc = Read(pc_++);
              const OpInfo& oi = kOpTable[opc];
              u32 cyc = kCycles[opc];
              u16 ea = 0;
              bool crossed = false;

              switch (oi.mode) {
              case AM_IMP: case AM_ACC: break;
              case AM_IMM: ea = pc_++; break;
              case AM_ZP: ea = Read(pc_++); break;
              case AM_ZPX: ea = (u8)(Read(pc_++) + x_); break;
              case AM_ZPY: ea = (u8)(Read(pc_++) + y_); break;
              case AM_ABS: ea = (u16)(Read(pc_) | (Read((u16)(pc_ + 1)) << 8)); pc_ += 2; break;
              case AM_ABX: {
                  u16 base = (u16)(Read(pc_) | (Read((u16)(pc_ + 1)) << 8)); pc_ += 2;
                  ea = (u16)(base + x_);
                  crossed = (base & 0xFF00) != (ea & 0xFF00);
                  break; }
              case AM_ABY: {
                  u16 base = (u16)(Read(pc_) | (Read((u16)(pc_ + 1)) << 8)); pc_ += 2;
                  ea = (u16)(base + y_);
                  crossed = (base & 0xFF00) != (ea & 0xFF00);
                  break; }
              case AM_IND: {
                  u16 ptr = (u16)(Read(pc_) | (Read((u16)(pc_ + 1)) << 8)); pc_ += 2;
                  ea = (u16)(Read(ptr) | (Read((u16)((ptr & 0xFF00) | ((ptr + 1) & 0xFF))) << 8));
                  break; }
              case AM_IZX: {
                  u8 zp = (u8)(Read(pc_++) + x_);
                  ea = (u16)(Read(zp) | (Read((u8)(zp + 1)) << 8));
                  break; }
              case AM_IZY: {
                  u8 zp = Read(pc_++);
                  u16 base = (u16)(Read(zp) | (Read((u8)(zp + 1)) << 8));
                  ea = (u16)(base + y_);
                  crossed = (base & 0xFF00) != (ea & 0xFF00);
                  break; }
              case AM_REL: {
                  s8 off = (s8)Read(pc_++);
                  ea = (u16)(pc_ + off);
                  break; }
              }
              if (crossed && oi.penalty) ++cyc;

              u8 val;
              u32 t;
              bool acc = (oi.mode == AM_ACC);
              switch (oi.op) {
              case OP_ADC: AdcCore(this, Read(ea)); SETNZ(a_); break;
              case OP_SBC: AdcCore(this, (u8)(Read(ea) ^ 0xFF)); SETNZ(a_); break;
              case OP_AND: a_ &= Read(ea); SETNZ(a_); break;
              case OP_ORA: a_ |= Read(ea); SETNZ(a_); break;
              case OP_EOR: a_ ^= Read(ea); SETNZ(a_); break;
              case OP_ASL:
                  val = acc ? a_ : Read(ea);
                  fC_ = val >> 7; val <<= 1; SETNZ(val);
                  if (acc) a_ = val; else Write(ea, val);
                  break;
              case OP_LSR:
                  val = acc ? a_ : Read(ea);
                  fC_ = val & 1; val >>= 1; SETNZ(val);
                  if (acc) a_ = val; else Write(ea, val);
                  break;
              case OP_ROL:
                  val = acc ? a_ : Read(ea);
                  t = (u32)((val << 1) | fC_); fC_ = val >> 7; val = (u8)t; SETNZ(val);
                  if (acc) a_ = val; else Write(ea, val);
                  break;
              case OP_ROR:
                  val = acc ? a_ : Read(ea);
                  t = (u32)((val >> 1) | (fC_ << 7)); fC_ = val & 1; val = (u8)t; SETNZ(val);
                  if (acc) a_ = val; else Write(ea, val);
                  break;
              case OP_BCC: if (!fC_) goto branch; break;
              case OP_BCS: if (fC_) goto branch; break;
              case OP_BEQ: if (fZ_) goto branch; break;
              case OP_BNE: if (!fZ_) goto branch; break;
              case OP_BMI: if (fN_) goto branch; break;
              case OP_BPL: if (!fN_) goto branch; break;
              case OP_BVC: if (!fV_) goto branch; break;
              case OP_BVS: if (fV_) goto branch; break;
              case OP_BIT:
                  val = Read(ea);
                  fZ_ = (val & a_) == 0; fV_ = (val >> 6) & 1; fN_ = val >> 7;
                  break;
              case OP_BRK:
                  ++pc_;
                  Push((u8)(pc_ >> 8)); Push((u8)pc_); Push(GetP(true));
                  fI_ = 1;
                  pc_ = (u16)(Read(0xFFFE) | (Read(0xFFFF) << 8));
                  break;
              case OP_CLC: fC_ = 0; break;
              case OP_CLD: fD_ = 0; break;
              case OP_CLI: fI_ = 0; break;
              case OP_CLV: fV_ = 0; break;
              case OP_SEC: fC_ = 1; break;
              case OP_SED: fD_ = 1; break;
              case OP_SEI: fI_ = 1; break;
              case OP_CMP: val = Read(ea); fC_ = a_ >= val; t = (u8)(a_ - val); SETNZ(t); break;
              case OP_CPX: val = Read(ea); fC_ = x_ >= val; t = (u8)(x_ - val); SETNZ(t); break;
              case OP_CPY: val = Read(ea); fC_ = y_ >= val; t = (u8)(y_ - val); SETNZ(t); break;
              case OP_DEC: val = (u8)(Read(ea) - 1); Write(ea, val); SETNZ(val); break;
              case OP_INC: val = (u8)(Read(ea) + 1); Write(ea, val); SETNZ(val); break;
              case OP_DEX: --x_; SETNZ(x_); break;
              case OP_DEY: --y_; SETNZ(y_); break;
              case OP_INX: ++x_; SETNZ(x_); break;
              case OP_INY: ++y_; SETNZ(y_); break;
              case OP_JMP: pc_ = ea; break;
              case OP_JSR: {
                  u16 ret = (u16)(pc_ - 1);
                  Push((u8)(ret >> 8)); Push((u8)ret);
                  pc_ = ea;
                  break; }
              case OP_RTS: {
                  u8 lo = Pull(); u8 hi = Pull();
                  pc_ = (u16)(((hi << 8) | lo) + 1);
                  break; }
              case OP_RTI: {
                  SetP(Pull());
                  u8 lo = Pull(); u8 hi = Pull();
                  pc_ = (u16)((hi << 8) | lo);
                  break; }
              case OP_LDA: a_ = Read(ea); SETNZ(a_); break;
              case OP_LDX: x_ = Read(ea); SETNZ(x_); break;
              case OP_LDY: y_ = Read(ea); SETNZ(y_); break;
              case OP_LAX: a_ = x_ = Read(ea); SETNZ(a_); break;
              case OP_STA: Write(ea, a_); break;
              case OP_STX: Write(ea, x_); break;
              case OP_STY: Write(ea, y_); break;
              case OP_SAX: Write(ea, (u8)(a_ & x_)); break;
              case OP_NOP:
                  if (oi.mode != AM_IMP && oi.mode != AM_IMM) (void)Read(ea);
                  break;
              case OP_PHA: Push(a_); break;
              case OP_PHP: Push(GetP(true)); break;
              case OP_PLA: a_ = Pull(); SETNZ(a_); break;
              case OP_PLP: SetP(Pull()); break;
              case OP_TAX: x_ = a_; SETNZ(x_); break;
              case OP_TAY: y_ = a_; SETNZ(y_); break;
              case OP_TSX: x_ = sp_; SETNZ(x_); break;
              case OP_TXA: a_ = x_; SETNZ(a_); break;
              case OP_TXS: sp_ = x_; break;
              case OP_TYA: a_ = y_; SETNZ(a_); break;
              case OP_DCP:
                  val = (u8)(Read(ea) - 1); Write(ea, val);
                  fC_ = a_ >= val; t = (u8)(a_ - val); SETNZ(t);
                  break;
              case OP_ISB:
                  val = (u8)(Read(ea) + 1); Write(ea, val);
                  AdcCore(this, (u8)(val ^ 0xFF)); SETNZ(a_);
                  break;
              case OP_SLO:
                  val = Read(ea); fC_ = val >> 7; val <<= 1; Write(ea, val);
                  a_ |= val; SETNZ(a_);
                  break;
              case OP_RLA:
                  val = Read(ea); t = (u32)((val << 1) | fC_); fC_ = val >> 7; val = (u8)t; Write(ea, val);
                  a_ &= val; SETNZ(a_);
                  break;
              case OP_SRE:
                  val = Read(ea); fC_ = val & 1; val >>= 1; Write(ea, val);
                  a_ ^= val; SETNZ(a_);
                  break;
              case OP_RRA:
                  val = Read(ea); t = (u32)((val >> 1) | (fC_ << 7)); fC_ = val & 1; val = (u8)t; Write(ea, val);
                  AdcCore(this, val); SETNZ(a_);
                  break;
              default: break;
              }
              return cyc;

          branch:
              ++cyc;
              if ((pc_ & 0xFF00) != (ea & 0xFF00)) ++cyc;
              pc_ = ea;
              return cyc;
          }

