          // Host-side harness for the portable core (not part of the Symbian build).
          //   host_test nestest <nestest.nes> <nestest.log>   - compare CPU trace
          //   host_test run <rom.nes> <frames> <out.ppm>      - run frames, dump screen
          #include "../core/nes.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          namespace nes {
          void* PlatAlloc(u32 n) { return calloc(1, n ? n : 1); }
          void PlatFree(void* p) { free(p); }
          }

          static unsigned char* Slurp(const char* path, unsigned* n) {
              FILE* f = fopen(path, "rb");
              if (!f) return 0;
              fseek(f, 0, SEEK_END); long sz = ftell(f); fseek(f, 0, SEEK_SET);
              unsigned char* b = (unsigned char*)malloc(sz);
              if (fread(b, 1, sz, f) != (size_t)sz) { fclose(f); return 0; }
              fclose(f);
              *n = (unsigned)sz;
              return b;
          }

          int main(int argc, char** argv) {
              if (argc < 3) return 2;
              unsigned n;
              unsigned char* rom = Slurp(argv[2], &n);
              if (!rom) { printf("cannot read %s\n", argv[2]); return 2; }
              nes::Nes* m = new nes::Nes();
              if (!m->Init() || !m->LoadRom(rom, n)) { printf("load failed: %s\n", m->LastError()); return 1; }

              if (!strcmp(argv[1], "nestest")) {
                  FILE* log = fopen(argv[3], "r");
                  char line[256];
                  m->pc_ = 0xC000; m->sp_ = 0xFD; m->SetP(0x24); m->cpuCycles_ = 7;
                  int lineNo = 0;
                  while (fgets(line, sizeof line, log)) {
                      ++lineNo;
                      unsigned pc, a, x, y, p, sp, cyc;
                      if (sscanf(line, "%x", &pc) != 1) break;
                      char* q;
                      q = strstr(line, "A:"); sscanf(q, "A:%x X:%x Y:%x P:%x SP:%x", &a, &x, &y, &p, &sp);
                      q = strstr(line, "CYC:"); sscanf(q, "CYC:%u", &cyc);
                      unsigned mp = m->GetP(false);
                      if (m->pc_ != pc || m->a_ != a || m->x_ != x || m->y_ != y || mp != p || m->sp_ != sp || m->cpuCycles_ != cyc) {
                          printf("MISMATCH at log line %d\n  log : %.*s\n  mine: PC:%04X A:%02X X:%02X Y:%02X P:%02X SP:%02X CYC:%u\n",
                                 lineNo, (int)strcspn(line, "\r\n"), line, m->pc_, m->a_, m->x_, m->y_, mp, m->sp_, m->cpuCycles_);
                          return 1;
                      }
                      { unsigned c = m->CpuStep(); m->cpuCycles_ += c; }
                      if (lineNo >= 8991) break;
                  }
                  printf("nestest: %d log lines matched. $0002=%02X $0003=%02X (00 = pass)\n", lineNo, m->Read(2), m->Read(3));
                  return 0;
              }

              if (!strcmp(argv[1], "run")) {
                  int frames = atoi(argv[3]);
                  for (int i = 0; i < frames; ++i) {
                      m->SetPad(0, 0);
                      m->RunFrame(true);
                      nes::s16 buf[1024]; m->ReadAudio(buf, 1024);
                  }
                  FILE* f = fopen(argv[4], "wb");
                  fprintf(f, "P6\n256 240\n255\n");
                  const nes::u32* fb = m->FrameBuffer();
                  for (int i = 0; i < 256 * 240; ++i) { fputc((fb[i] >> 16) & 255, f); fputc((fb[i] >> 8) & 255, f); fputc(fb[i] & 255, f); }
                  fclose(f);
                  printf("ran %d frames, pc=%04X, mapper %d\n", frames, m->pc_, m->MapperId());
                  // result byte convention of blargg tests: $6000
                  printf("$6000=%02X text: %s\n", m->Read(0x6000), m->Read(0x6001) == 0xDE ? (const char*)(m->SaveRam() + 4) : "(n/a)");
                  return 0;
              }
              return 2;
          }
          VNES_EOF
