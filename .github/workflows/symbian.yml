          // nes_mapper.cpp - cartridge mappers.
          //
          // Supported: 0 NROM, 1 MMC1, 2 UxROM, 3 CNROM, 4 MMC3, 7 AxROM, 9 MMC2,
          // 10 MMC4, 11 Color Dreams, 33 Taito TC0190, 34 BNROM/NINA-001, 66 GxROM,
          // 71 Camerica, 75 VRC1, 79 NINA-03/06, 87, 94, 140, 180.
          #include "nes.h"

          namespace nes {

          void Nes::Prg8(int slot, u32 bank) {
              bank %= prgBanks8_;
              prgPtr_[slot] = prg_ + bank * 0x2000;
          }

          void Nes::Prg16(int slot, u32 bank) {
              u32 n = prgBanks8_ >> 1;
              if (!n) n = 1;
              bank %= n;
              Prg8(slot * 2, bank * 2);
              Prg8(slot * 2 + 1, bank * 2 + 1);
          }

          void Nes::Prg32(u32 bank) {
              u32 n = prgBanks8_ >> 2;
              if (!n) n = 1;
              bank %= n;
              for (int i = 0; i < 4; ++i) Prg8(i, bank * 4 + i);
          }

          void Nes::Chr1(int slot, u32 bank) {
              bank %= chrBanks1_;
              chrPtr_[slot] = chr_ + bank * 0x400;
          }
          void Nes::Chr2(int slot, u32 bank) { Chr1(slot, bank * 2); Chr1(slot + 1, bank * 2 + 1); }
          void Nes::Chr4(int slot, u32 bank) { for (int i = 0; i < 4; ++i) Chr1(slot + i, bank * 4 + i); }
          void Nes::Chr8(u32 bank) { for (int i = 0; i < 8; ++i) Chr1(i, bank * 8 + i); }

          // ---- MMC1 ----
          void Nes::Mmc1Sync() {
              u32 ctrl = mreg_[0], chr0 = mreg_[1], chr1 = mreg_[2], prg = mreg_[3];
              switch (ctrl & 3) {
              case 0: SetMirroring(kMirrorSingle0); break;
              case 1: SetMirroring(kMirrorSingle1); break;
              case 2: SetMirroring(kMirrorVert); break;
              default: SetMirroring(kMirrorHoriz); break;
              }
              switch ((ctrl >> 2) & 3) {
              case 0: case 1: Prg32((prg & 0xE) >> 1); break;
              case 2: Prg16(0, 0); Prg16(1, prg & 0xF); break;
              default: Prg16(0, prg & 0xF); Prg16(1, (prgBanks8_ >> 1) - 1); break;
              }
              if (ctrl & 0x10) { Chr4(0, chr0); Chr4(4, chr1); }
              else Chr8(chr0 >> 1);
          }

          // ---- MMC3 ----
          void Nes::Mmc3Sync() {
              u32 sel = mreg_[0];
              u32 r0 = mreg_[1], r1 = mreg_[2];
              if (sel & 0x80) {
                  Chr1(4, r0 & ~1u); Chr1(5, r0 | 1); Chr1(6, r1 & ~1u); Chr1(7, r1 | 1);
                  Chr1(0, mreg_[3]); Chr1(1, mreg_[4]); Chr1(2, mreg_[5]); Chr1(3, mreg_[6]);
              } else {
                  Chr1(0, r0 & ~1u); Chr1(1, r0 | 1); Chr1(2, r1 & ~1u); Chr1(3, r1 | 1);
                  Chr1(4, mreg_[3]); Chr1(5, mreg_[4]); Chr1(6, mreg_[5]); Chr1(7, mreg_[6]);
              }
              u32 last = prgBanks8_ - 1;
              if (sel & 0x40) {
                  Prg8(0, last - 1); Prg8(1, mreg_[8]); Prg8(2, mreg_[7]); Prg8(3, last);
              } else {
                  Prg8(0, mreg_[7]); Prg8(1, mreg_[8]); Prg8(2, last - 1); Prg8(3, last);
              }
          }

          // ---- MMC2 / MMC4 ----
          void Nes::Mmc2Sync() {
              Chr4(0, mm9_sel_[0][mm9_latch_[0]]);
              Chr4(4, mm9_sel_[1][mm9_latch_[1]]);
          }

          void Nes::MapperPpuFetch(u16 addr) {
              u32 side = (addr >> 12) & 1;
              u32 lo = addr & 0x0FF8;
              u8 nl;
              if (lo == 0x0FD8) nl = 0;
              else if (lo == 0x0FE8) nl = 1;
              else return;
              if (mm9_latch_[side] != nl) {
                  mm9_latch_[side] = nl;
                  Mmc2Sync();
              }
          }

          void Nes::MapperInit() {
              for (int i = 0; i < 16; ++i) mreg_[i] = 0;
              mm1_shift_ = 0x10; mm1_count_ = 0;
              mm3_irqLatch_ = mm3_irqCounter_ = mm3_irqEnable_ = mm3_irqReload_ = 0;
              mm9_latch_[0] = mm9_latch_[1] = 1;
              mm9_sel_[0][0] = mm9_sel_[0][1] = mm9_sel_[1][0] = mm9_sel_[1][1] = 0;
              mapIrq_ = 0;
              const u32 last16 = (prgBanks8_ >> 1) ? (prgBanks8_ >> 1) - 1 : 0;
              SetMirroring(mirrorMode_);
              Prg32(0);
              Chr8(0);
              switch (mapperId_) {
              case 1: mreg_[0] = 0x0C; Mmc1Sync(); break;
              case 2: case 94: Prg16(0, 0); Prg16(1, last16); break;
              case 180: Prg16(0, 0); Prg16(1, 0); break;
              case 4:
                  mreg_[1] = 0; mreg_[2] = 2; mreg_[3] = 4; mreg_[4] = 5; mreg_[5] = 6; mreg_[6] = 7;
                  mreg_[7] = 0; mreg_[8] = 1;
                  Mmc3Sync();
                  break;
              case 9: Prg8(0, 0); Prg8(1, prgBanks8_ - 3); Prg8(2, prgBanks8_ - 2); Prg8(3, prgBanks8_ - 1); Mmc2Sync(); break;
              case 10: Prg16(0, 0); Prg16(1, last16); Mmc2Sync(); break;
              case 71: Prg16(0, 0); Prg16(1, last16); break;
              case 33: case 75:
                  Prg8(0, 0); Prg8(1, 1); Prg8(2, prgBanks8_ - 2); Prg8(3, prgBanks8_ - 1);
                  break;
              default: break;
              }
          }

          void Nes::MapperWriteLow(u16 a, u8 v) {
              switch (mapperId_) {
              case 34:
                  if (chrSize_ && !chrIsRam_) {          // NINA-001
                      if (a == 0x7FFD) Prg32(v);
                      else if (a == 0x7FFE) Chr4(0, v);
                      else if (a == 0x7FFF) Chr4(4, v);
                  }
                  break;
              case 79:
                  if ((a & 0xE100) == 0x4100) { Prg32((v >> 3) & 1); Chr8(v & 7); }
                  break;
              case 87:
                  if (a >= 0x6000) Chr8(((v & 1) << 1) | ((v >> 1) & 1));
                  break;
              case 140:
                  if (a >= 0x6000) { Prg32((v >> 4) & 3); Chr8(v & 0xF); }
                  break;
              default: break;
              }
          }

          void Nes::MapperWrite(u16 a, u8 v) {
              switch (mapperId_) {
              case 1:
                  if (v & 0x80) {
                      mm1_shift_ = 0x10; mm1_count_ = 0;
                      mreg_[0] |= 0x0C;
                      Mmc1Sync();
                  } else {
                      mm1_shift_ = (u8)((mm1_shift_ >> 1) | ((v & 1) << 4));
                      if (++mm1_count_ == 5) {
                          mreg_[(a >> 13) & 3] = mm1_shift_ & 0x1F;
                          mm1_shift_ = 0x10; mm1_count_ = 0;
                          Mmc1Sync();
                      }
                  }
                  break;
              case 2: Prg16(0, v); break;
              case 3: Chr8(v); break;
              case 4:
                  switch (a & 0xE001) {
                  case 0x8000: mreg_[0] = v; Mmc3Sync(); break;
                  case 0x8001: {
                      u32 r = mreg_[0] & 7;
                      if (r == 6 || r == 7) mreg_[1 + r] = v & 0x3F; else mreg_[1 + r] = v;
                      Mmc3Sync();
                      break; }
                  case 0xA000: if (!fourScreen_) SetMirroring((v & 1) ? kMirrorHoriz : kMirrorVert); break;
                  case 0xA001: break;
                  case 0xC000: mm3_irqLatch_ = v; break;
                  case 0xC001: mm3_irqCounter_ = 0; mm3_irqReload_ = 1; break;
                  case 0xE000: mm3_irqEnable_ = 0; mapIrq_ = 0; break;
                  default: mm3_irqEnable_ = 1; break;
                  }
                  break;
              case 7:
                  Prg32(v & 7);
                  SetMirroring((v & 0x10) ? kMirrorSingle1 : kMirrorSingle0);
                  break;
              case 9: case 10:
                  switch (a & 0xF000) {
                  case 0xA000: if (mapperId_ == 9) Prg8(0, v & 0xF); else Prg16(0, v & 0xF); break;
                  case 0xB000: mm9_sel_[0][0] = v & 0x1F; Mmc2Sync(); break;
                  case 0xC000: mm9_sel_[0][1] = v & 0x1F; Mmc2Sync(); break;
                  case 0xD000: mm9_sel_[1][0] = v & 0x1F; Mmc2Sync(); break;
                  case 0xE000: mm9_sel_[1][1] = v & 0x1F; Mmc2Sync(); break;
                  case 0xF000: SetMirroring((v & 1) ? kMirrorHoriz : kMirrorVert); break;
                  default: break;
                  }
                  break;
              case 11: Prg32(v & 3); Chr8(v >> 4); break;
              case 33:
                  switch (a & 0xA003) {
                  case 0x8000: Prg8(0, v & 0x3F); SetMirroring((v & 0x40) ? kMirrorHoriz : kMirrorVert); break;
                  case 0x8001: Prg8(1, v & 0x3F); break;
                  case 0x8002: Chr2(0, v); break;
                  case 0x8003: Chr2(2, v); break;
                  case 0xA000: Chr1(4, v); break;
                  case 0xA001: Chr1(5, v); break;
                  case 0xA002: Chr1(6, v); break;
                  case 0xA003: Chr1(7, v); break;
                  default: break;
                  }
                  break;
              case 34:
                  if (!chrSize_ || chrIsRam_) Prg32(v);
                  break;
              case 66: Prg32((v >> 4) & 3); Chr8(v & 3); break;
              case 71:
                  if (a >= 0xC000) Prg16(0, v);
                  else if (a >= 0x9000 && a < 0xA000) SetMirroring((v & 0x10) ? kMirrorSingle1 : kMirrorSingle0);
                  break;
              case 75:
                  switch (a & 0xF000) {
                  case 0x8000: Prg8(0, v & 0xF); break;
                  case 0x9000:
                      SetMirroring((v & 1) ? kMirrorHoriz : kMirrorVert);
                      mreg_[4] = (v & 2) ? 0x10 : 0;
                      mreg_[5] = (v & 4) ? 0x10 : 0;
                      Chr4(0, mreg_[0] | mreg_[4]); Chr4(4, mreg_[1] | mreg_[5]);
                      break;
                  case 0xA000: Prg8(1, v & 0xF); break;
                  case 0xC000: Prg8(2, v & 0xF); break;
                  case 0xE000: mreg_[0] = v & 0xF; Chr4(0, mreg_[0] | mreg_[4]); break;
                  case 0xF000: mreg_[1] = v & 0xF; Chr4(4, mreg_[1] | mreg_[5]); break;
                  default: break;
                  }
                  break;
              case 94: Prg16(0, (v >> 2) & 0xF); break;
              case 180: Prg16(1, v); break;
              default: break;
              }
          }

          void Nes::MapperScanline() {
              if (mapperId_ != 4) return;
              if (mm3_irqCounter_ == 0 || mm3_irqReload_) {
                  mm3_irqCounter_ = mm3_irqLatch_;
                  mm3_irqReload_ = 0;
              } else {
                  --mm3_irqCounter_;
              }
              if (mm3_irqCounter_ == 0 && mm3_irqEnable_) mapIrq_ = 1;
          }

          }  // namespace nes
