name: Build Symbian^3 SIS

# SELF-CONTAINED: this single file carries the whole Symbian port (symbian/ tree) and writes it
# at build time, so the repo only needs the original vNES sources + this workflow.
#
# Uses https://github.com/fieldops-dev/symbian3-toolchain, which targets Apple Silicon
# macOS, so the job runs on a macos-14 (arm64) runner.  The first run builds GCC for
# arm-none-symbianelf (about 1.5-2 h) and caches the toolchain + SDK; later runs only
# compile the app (a few minutes).

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  sources:
    name: Write port sources
    runs-on: ubuntu-latest
    steps:
      - name: Generate symbian/ tree
        run: |
          set -e
          mkdir -p symbian
          cat > symbian/README.md <<'VNES_EOF'
          # vNES for Symbian^3

          Native Symbian^3 (Nokia N8, C7, E7, ...) port of the vNES NES emulator, built in
          GitHub Actions with [fieldops-dev/symbian3-toolchain](https://github.com/fieldops-dev/symbian3-toolchain).

          The original Java sources (`src/`) are untouched. `symbian/` contains:

          | Path | What |
          |---|---|
          | `core/` | Portable C++98 NES core (6502, scanline PPU, APU, mappers). No STL, exceptions, RTTI or floating point |
          | `app/` | Avkon front end: ROM browser, touch pad, overlay menu, MMF audio output, `bld.inf`/`.mmp`/`.pkg` |
          | `tools/host_test.cpp` | Desktop harness: nestest trace comparison, frame dump |
          | `tools/gen_cpu_table.py` | Generates `core/nes_cpu_table.h` |

          ## Build (CI)

          `.github/workflows/symbian.yml` runs on a `macos-14` runner (the toolchain is Apple Silicon only):
          creates the case-sensitive volume, builds GCC 14.2 for `arm-none-symbianelf`, installs the Symbian^3 SDK,
          runs `bldmake bldfiles && abld build gcce urel` and `package-sis.sh`, then uploads `vnes.sisx`.
          The first run takes ~2 h; the toolchain is cached afterwards. Tags `v*` attach the SIS to a release.

          Local build on an Apple Silicon Mac, after following the toolchain README:

              source symbian3-toolchain/Scripts/env.sh
              cd symbian/app/group && bldmake bldfiles && abld build gcce urel
              $N8_REPO/Scripts/package-sis.sh ../sis/vnes.pkg

          ## Using it

          Put `.nes` files on the memory card (`E:\ROMs\` is opened first). Landscape only.
          Touch: on-screen D-pad, A, B, Select, Start; `Menu` (top right) gives Resume / Load ROM / Reset / Scale / Sound / Exit.
          Keys: arrows, `X`=A, `Z`=B, Enter=Start, Space=Select, left soft key=menu.
          Battery saves are written next to the ROM as `.sav`.
          Touch input is single-touch (no simultaneous D-pad + button on one finger).

          ## Supported mappers

          0 NROM, 1 MMC1, 2 UxROM, 3 CNROM, 4 MMC3, 7 AxROM, 9 MMC2, 10 MMC4, 11 Color Dreams, 33 Taito TC0190,
          34 BNROM/NINA-001, 66 GxROM, 71 Camerica, 75 VRC1, 79, 87, 94, 140, 180. NTSC timing only.

          ## Status / honesty notes

          * The core is a rewrite in C++ following vNES's structure, not a line-by-line translation; the extra vNES mappers
            (VRC2/4, 15, 18, 64, 68, 72, 78, 105, 182) are not ported yet.
          * Verified on a desktop: nestest trace (8991 lines, instruction + cycle exact), blargg instruction tests,
            sprite-hit tests. Cycle-exact PPU/APU/MMC3 timing tests fail (scanline-granular PPU) and unofficial opcodes
            such as ARR/AXS are NOPs.
          * The Symbian layer (`app/`) was written without access to the SDK and has not been compiled or run on a
            device; expect small API/include fixes on the first CI run.
          VNES_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/vnes.rss <<'VNES_EOF'
          NAME VNES

          #include <eikon.rh>
          #include <avkon.rh>
          #include <avkon.rsg>
          #include <appinfo.rh>

          RESOURCE RSS_SIGNATURE { }

          RESOURCE TBUF r_default_document_name { buf = ""; }

          RESOURCE EIK_APP_INFO
              {
              }

          RESOURCE LOCALISABLE_APP_INFO r_localisable_app_info
              {
              short_caption = "vNES";
              caption_and_icon = CAPTION_AND_ICON_INFO
                  {
                  caption = "vNES";
                  number_of_icons = 0;
                  };
              }
          VNES_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/vnes_reg.rss <<'VNES_EOF'
          #include <appinfo.rh>
          #include <vnes.rsg>

          UID2 KUidAppRegistrationResourceFile
          UID3 0xE1A5B0CD

          RESOURCE APP_REGISTRATION_INFO
              {
              app_file = "vnes";
              localisable_resource_file = "\\resource\\apps\\vnes";
              localisable_resource_id = R_LOCALISABLE_APP_INFO;
              embeddability = KAppNotEmbeddable;
              newfile = KAppDoesNotSupportNewFile;
              }
          VNES_EOF
          mkdir -p symbian/app/group
          cat > symbian/app/group/bld.inf <<'VNES_EOF'
          PRJ_PLATFORMS
          DEFAULT

          PRJ_MMPFILES
          vnes.mmp
          VNES_EOF
          mkdir -p symbian/app/group
          cat > symbian/app/group/vnes.mmp <<'VNES_EOF'
          // vNES for Symbian^3 - native port of the vNES NES emulator.
          #include <platform_paths.hrh>

          TARGET          vnes.exe
          TARGETTYPE      exe
          UID             0x100039CE 0xE1A5B0CD
          SECUREID        0xE1A5B0CD
          VENDORID        0
          CAPABILITY      NONE

          EPOCSTACKSIZE   0x14000
          EPOCHEAPSIZE    0x100000 0x4000000

          SOURCEPATH      ../src
          SOURCE          vnes_app.cpp
          SOURCE          vnes_appui.cpp
          SOURCE          vnes_container.cpp
          SOURCE          vnes_audio.cpp
          SOURCE          nes_platform.cpp

          SOURCEPATH      ../../core
          SOURCE          nes.cpp
          SOURCE          nes_cpu.cpp
          SOURCE          nes_ppu.cpp
          SOURCE          nes_apu.cpp
          SOURCE          nes_mapper.cpp

          USERINCLUDE     ../inc
          USERINCLUDE     ../../core
          APP_LAYER_SYSTEMINCLUDE

          START RESOURCE  ../data/vnes.rss
          HEADER
          TARGETPATH      /resource/apps
          END

          START RESOURCE  ../data/vnes_reg.rss
          TARGETPATH      /private/10003a3f/import/apps
          END

          LIBRARY         euser.lib apparc.lib cone.lib eikcore.lib avkon.lib eikcoctl.lib
          LIBRARY         fbscli.lib bitgdi.lib gdi.lib ws32.lib efsrv.lib
          LIBRARY         mediaclientaudiostream.lib

          OPTION          GCCE -O3
          VNES_EOF
          mkdir -p symbian/app/inc
          cat > symbian/app/inc/vnes.h <<'VNES_EOF'
          // vnes.h - Symbian^3 front end for the vNES core.
          #ifndef VNES_H
          #define VNES_H

          #include <aknapp.h>
          #include <akndoc.h>
          #include <aknappui.h>
          #include <coecntrl.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <fbs.h>
          #include <badesca.h>
          #include <MdaAudioOutputStream.h>
          #include "nes.h"

          const TUid KUidVNes = { 0xE1A5B0CD };

          // ---------------------------------------------------------------------------
          // Audio: pushes 22.05 kHz mono PCM16 produced by the core to the MMF stream.
          // ---------------------------------------------------------------------------
          class CVNesAudio : public CBase, public MMdaAudioOutputStreamCallback
              {
          public:
              static CVNesAudio* NewL();
              ~CVNesAudio();
              void Write(const TInt16* aSamples, TInt aCount);   // drops data when the queue is full
              void Suspend();
              void Resume();

              // MMdaAudioOutputStreamCallback
              void MaoscOpenComplete(TInt aError);
              void MaoscBufferCopied(TInt aError, const TDesC8& aBuffer);
              void MaoscPlayComplete(TInt aError);

          private:
              CVNesAudio();
              void ConstructL();
              void OpenStream();

              enum { KSlots = 4, KSlotBytes = 1600 };
              CMdaAudioOutputStream* iStream;
              TMdaAudioDataSettings iSettings;
              TBool iReady;
              TBool iSuspended;
              TBuf8<KSlotBytes> iSlot[KSlots];
              TBool iBusy[KSlots];
              };

          // ---------------------------------------------------------------------------
          // Main control: ROM browser, game view, touch pad and overlay menu.
          // ---------------------------------------------------------------------------
          class CVNesContainer : public CCoeControl
              {
          public:
              static CVNesContainer* NewL(const TRect& aRect);
              ~CVNesContainer();
              void SetForeground(TBool aForeground);
              void SaveBattery();

              // CCoeControl
              void Draw(const TRect& aRect) const;
              void SizeChanged();
              void HandlePointerEventL(const TPointerEvent& aEvent);
              TKeyResponse OfferKeyEventL(const TKeyEvent& aKeyEvent, TEventCode aType);

          private:
              enum TMode { EBrowse, EPlay, EMenu };
              enum { KMenuItems = 6 };

              CVNesContainer();
              void ConstructL(const TRect& aRect);

              static TInt TickCb(TAny* aPtr);
              void Tick();
              void StartTimer();
              void StopTimer();

              void LoadRomL(const TDesC& aPath);
              void ShowDirL(const TDesC& aDir);
              void ShowDrivesL();
              void ActivateEntryL(TInt aIndex);
              void GoUpL();
              void MenuActionL(TInt aIndex);
              void ComputeLayout();
              TUint8 PadFromPoint(const TPoint& aPt) const;
              void SetMessage(const TDesC& aMsg);
              TInt RowHeight() const;
              void DrawBrowser(CWindowGc& aGc) const;
              void DrawMenu(CWindowGc& aGc) const;
              void DrawPad(CWindowGc& aGc) const;
              void DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const;
              TRect GameRect() const;

              nes::Nes* iNes;
              CFbsBitmap* iBitmap;
              CPeriodic* iTimer;
              CVNesAudio* iAudio;
              RFs iFs;

              TMode iMode;
              TBool iHaveRom;
              TBool iFit;
              TBool iSound;
              TBool iForeground;
              TUint iLastTick;

              TFileName iDir;
              TFileName iRomPath;
              CDesCArrayFlat* iEntries;
              TInt iSel;
              TInt iScroll;
              TInt iDragStartY;
              TInt iDragScroll;
              TBool iDragging;
              TBuf<80> iMessage;

              TUint8 iKeyPad;
              TUint8 iTouchPad;

              // layout
              TPoint iDpadCentre;
              TInt iDpadR;
              TRect iBtnA, iBtnB, iBtnSelect, iBtnStart, iBtnMenu;
              TInt iMenuSel;
              };

          // ---------------------------------------------------------------------------
          class CVNesAppUi : public CAknAppUi
              {
          public:
              void ConstructL();
              ~CVNesAppUi();
              void HandleCommandL(TInt aCommand);
              void HandleForegroundEventL(TBool aForeground);
              void HandleResourceChangeL(TInt aType);
          private:
              CVNesContainer* iContainer;
              };

          class CVNesDocument : public CAknDocument
              {
          public:
              CVNesDocument(CEikApplication& aApp) : CAknDocument(aApp) {}
          private:
              CEikAppUi* CreateAppUiL();
              };

          class CVNesApplication : public CAknApplication
              {
          private:
              CApaDocument* CreateDocumentL();
              TUid AppDllUid() const;
              };

          #endif
          VNES_EOF
          mkdir -p symbian/app/sis
          cat > symbian/app/sis/vnes.pkg <<'VNES_EOF'
          ; vNES for Symbian^3 - install package (paths are expanded by package-sis.sh)
          &EN
          #{"vNES"},(0xE1A5B0CD),1,0,0

          %{"Open Emulation Project / Symbian port"}
          :"Symbian port"

          ; Symbian^3 / S60 5th / S60 3rd platform IDs
          [0x20022E6D], 0, 0, 0, {"S60ProductID"}
          [0x1028315F], 0, 0, 0, {"S60ProductID"}
          [0x102752AE], 0, 0, 0, {"S60ProductID"}
          [0x102032BE], 0, 0, 0, {"S60ProductID"}
          [0x101F7961], 0, 0, 0, {"S60ProductID"}

          "$(epocroot)epoc32/release/$(platform)/$(target)/vnes.exe"-"!:\sys\bin\vnes.exe"
          "$(epocroot)epoc32/data/z/resource/apps/vnes.rsc"-"!:\resource\apps\vnes.rsc"
          "$(epocroot)epoc32/data/z/private/10003a3f/import/apps/vnes_reg.rsc"-"!:\private\10003a3f\import\apps\vnes_reg.rsc"
          VNES_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/nes_platform.cpp <<'VNES_EOF'
          // Allocator hooks for the portable core.
          #include <e32std.h>
          #include "nes.h"

          namespace nes {

          void* PlatAlloc(u32 aSize)
              {
              return User::AllocZ(aSize ? aSize : 1);
              }

          void PlatFree(void* aPtr)
              {
              User::Free(aPtr);
              }

          }  // namespace nes
          VNES_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/vnes_app.cpp <<'VNES_EOF'
          // Application / document / entry point.
          #include <eikstart.h>
          #include "vnes.h"

          CApaDocument* CVNesApplication::CreateDocumentL()
              {
              return new (ELeave) CVNesDocument(*this);
              }

          TUid CVNesApplication::AppDllUid() const
              {
              return KUidVNes;
              }

          CEikAppUi* CVNesDocument::CreateAppUiL()
              {
              return new (ELeave) CVNesAppUi;
              }

          LOCAL_C CApaApplication* NewApplication()
              {
              return new CVNesApplication;
              }

          GLDEF_C TInt E32Main()
              {
              return EikStart::RunApplication(NewApplication);
              }
          VNES_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/vnes_appui.cpp <<'VNES_EOF'
          // AppUi: owns the full-screen container.
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <eikspane.h>
          #include <eikbtgpc.h>
          #include "vnes.h"

          void CVNesAppUi::ConstructL()
              {
              BaseConstructL(CAknAppUi::EAknEnableSkin);
              SetOrientationL(CAknAppUiBase::EAppUiOrientationLandscape);

              CEikStatusPane* sp = StatusPane();
              if (sp)
                  {
                  sp->MakeVisible(EFalse);
                  }
              CEikButtonGroupContainer* cba = Cba();
              if (cba)
                  {
                  cba->MakeVisible(EFalse);
                  }

              iContainer = CVNesContainer::NewL(ApplicationRect());
              AddToStackL(iContainer);
              }

          CVNesAppUi::~CVNesAppUi()
              {
              if (iContainer)
                  {
                  iContainer->SaveBattery();
                  RemoveFromStack(iContainer);
                  delete iContainer;
                  iContainer = NULL;
                  }
              }

          void CVNesAppUi::HandleCommandL(TInt aCommand)
              {
              switch (aCommand)
                  {
                  case EEikCmdExit:
                  case EAknSoftkeyExit:
                  case EAknCmdExit:
                      Exit();
                      break;
                  default:
                      break;
                  }
              }

          void CVNesAppUi::HandleForegroundEventL(TBool aForeground)
              {
              CAknAppUi::HandleForegroundEventL(aForeground);
              if (iContainer)
                  {
                  iContainer->SetForeground(aForeground);
                  }
              }

          void CVNesAppUi::HandleResourceChangeL(TInt aType)
              {
              CAknAppUi::HandleResourceChangeL(aType);
              if (iContainer && aType == KEikDynamicLayoutVariantSwitch)
                  {
                  iContainer->SetRect(ApplicationRect());
                  }
              }
          VNES_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/vnes_audio.cpp <<'VNES_EOF'
          // Audio output through CMdaAudioOutputStream (22.05 kHz, mono, PCM16).
          #include "vnes.h"

          CVNesAudio* CVNesAudio::NewL()
              {
              CVNesAudio* self = new (ELeave) CVNesAudio;
              CleanupStack::PushL(self);
              self->ConstructL();
              CleanupStack::Pop(self);
              return self;
              }

          CVNesAudio::CVNesAudio()
              {
              }

          CVNesAudio::~CVNesAudio()
              {
              if (iStream)
                  {
                  iStream->Stop();
                  delete iStream;
                  }
              }

          void CVNesAudio::ConstructL()
              {
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  iBusy[i] = EFalse;
                  }
              OpenStream();
              }

          void CVNesAudio::OpenStream()
              {
              iReady = EFalse;
              delete iStream;
              iStream = NULL;
              TRAPD(err, iStream = CMdaAudioOutputStream::NewL(*this));
              if (err == KErrNone && iStream)
                  {
                  iStream->Open(&iSettings);
                  }
              }

          void CVNesAudio::MaoscOpenComplete(TInt aError)
              {
              if (aError != KErrNone)
                  {
                  return;
                  }
              TRAPD(err, iStream->SetAudioPropertiesL(TMdaAudioDataSettings::ESampleRate22050Hz,
                                                      TMdaAudioDataSettings::EChannelsMono));
              if (err != KErrNone)
                  {
                  return;
                  }
              iStream->SetVolume(iStream->MaxVolume() / 2);
              iStream->SetPriority(EPriorityNormal, EMdaPriorityPreferenceTime);
              iReady = ETrue;
              }

          void CVNesAudio::MaoscBufferCopied(TInt /*aError*/, const TDesC8& aBuffer)
              {
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (iSlot[i].Ptr() == aBuffer.Ptr())
                      {
                      iBusy[i] = EFalse;
                      }
                  }
              }

          void CVNesAudio::MaoscPlayComplete(TInt /*aError*/)
              {
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  iBusy[i] = EFalse;
                  }
              }

          void CVNesAudio::Write(const TInt16* aSamples, TInt aCount)
              {
              if (!iReady || iSuspended || aCount <= 0)
                  {
                  return;
                  }
              TInt bytes = aCount * 2;
              if (bytes > KSlotBytes)
                  {
                  bytes = KSlotBytes;
                  }
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (!iBusy[i])
                      {
                      iSlot[i].Copy((const TUint8*)aSamples, bytes);
                      iBusy[i] = ETrue;
                      TRAPD(err, iStream->WriteL(iSlot[i]));
                      if (err != KErrNone)
                          {
                          iBusy[i] = EFalse;
                          }
                      return;
                      }
                  }
              // all slots in flight: drop this frame's audio to keep latency bounded
              }

          void CVNesAudio::Suspend()
              {
              iSuspended = ETrue;
              if (iStream && iReady)
                  {
                  iStream->Stop();
                  iReady = EFalse;
                  }
              }

          void CVNesAudio::Resume()
              {
              if (iSuspended)
                  {
                  iSuspended = EFalse;
                  OpenStream();
                  }
              }
          VNES_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/vnes_container.cpp <<'VNES_EOF'
          // Main control: ROM browser, game view, touch pad, overlay menu.
          #include <aknutils.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <w32std.h>
          #include "vnes.h"

          _LIT(KRoms1, "E:\\ROMs\\");
          _LIT(KRoms2, "E:\\roms\\");
          _LIT(KRoms3, "E:\\");
          _LIT(KRoms4, "C:\\Data\\");
          _LIT(KExtNes, ".nes");
          _LIT(KExtSav, ".sav");
          _LIT(KUp, "..");

          static const TInt KFrameMicros = 16667;

          static const TInt KMenuCount = 6;

          CVNesContainer* CVNesContainer::NewL(const TRect& aRect)
              {
              CVNesContainer* self = new (ELeave) CVNesContainer;
              CleanupStack::PushL(self);
              self->ConstructL(aRect);
              CleanupStack::Pop(self);
              return self;
              }

          CVNesContainer::CVNesContainer()
              {
              }

          CVNesContainer::~CVNesContainer()
              {
              StopTimer();
              delete iTimer;
              delete iAudio;
              delete iBitmap;
              delete iEntries;
              delete iNes;
              iFs.Close();
              }

          void CVNesContainer::ConstructL(const TRect& aRect)
              {
              CreateWindowL();
              SetExtentToWholeScreen();
              EnableDragEvents();
              SetFocusing(ETrue);

              User::LeaveIfError(iFs.Connect());

              iNes = new (ELeave) nes::Nes;
              if (!iNes->Init())
                  {
                  User::Leave(KErrNoMemory);
                  }
              iBitmap = new (ELeave) CFbsBitmap;
              User::LeaveIfError(iBitmap->Create(TSize(nes::kScreenW, nes::kScreenH), EColor16MU));
              iEntries = new (ELeave) CDesCArrayFlat(16);
              TRAPD(aerr, iAudio = CVNesAudio::NewL());
              if (aerr != KErrNone)
                  {
                  iAudio = NULL;      // run silently when the audio stream is unavailable
                  }

              iMode = EBrowse;
              iSound = ETrue;
              iForeground = ETrue;
              iFit = EFalse;
              iSel = 0;
              iMenuSel = 0;

              // pick the first ROM folder that exists
              TBool shown = EFalse;
              const TDesC* roots[4] = { &KRoms1, &KRoms2, &KRoms3, &KRoms4 };
              for (TInt i = 0; i < 4 && !shown; ++i)
                  {
                  TRAPD(err, ShowDirL(*roots[i]));
                  shown = (err == KErrNone);
                  }
              if (!shown)
                  {
                  ShowDrivesL();
                  }

              SetRect(aRect);
              ActivateL();

              iTimer = CPeriodic::NewL(CActive::EPriorityStandard);
              }

          void CVNesContainer::StartTimer()
              {
              if (iTimer && !iTimer->IsActive())
                  {
                  iLastTick = User::NTickCount();
                  iTimer->Start(KFrameMicros, KFrameMicros, TCallBack(TickCb, this));
                  }
              }

          void CVNesContainer::StopTimer()
              {
              if (iTimer)
                  {
                  iTimer->Cancel();
                  }
              }

          void CVNesContainer::SetForeground(TBool aForeground)
              {
              iForeground = aForeground;
              if (!aForeground)
                  {
                  StopTimer();
                  SaveBattery();
                  if (iAudio)
                      {
                      iAudio->Suspend();
                      }
                  }
              else
                  {
                  if (iAudio && iSound)
                      {
                      iAudio->Resume();
                      }
                  if (iMode == EPlay)
                      {
                      StartTimer();
                      }
                  }
              }

          void CVNesContainer::SetMessage(const TDesC& aMsg)
              {
              iMessage.Copy(aMsg.Left(iMessage.MaxLength()));
              }

          // ---------------------------------------------------------------------------
          // Emulation tick
          // ---------------------------------------------------------------------------
          TInt CVNesContainer::TickCb(TAny* aPtr)
              {
              static_cast<CVNesContainer*>(aPtr)->Tick();
              return 0;
              }

          void CVNesContainer::Tick()
              {
              if (iMode != EPlay || !iHaveRom || !iForeground)
                  {
                  return;
                  }
              TUint now = User::NTickCount();
              TUint elapsed = now - iLastTick;
              iLastTick = now;
              TInt frames = (TInt)((elapsed * 60 + 500) / 1000);
              if (frames < 1) frames = 1;
              if (frames > 3) frames = 3;

              iNes->SetPad(0, (nes::u8)(iKeyPad | iTouchPad));
              for (TInt i = 0; i < frames; ++i)
                  {
                  iNes->RunFrame(i == frames - 1);
                  }

              if (iAudio && iSound)
                  {
                  nes::s16 buf[nes::kAudioRing];
                  TInt n = iNes->ReadAudio(buf, nes::kAudioRing);
                  iAudio->Write((const TInt16*)buf, n);
                  }
              else
                  {
                  nes::s16 buf[nes::kAudioRing];
                  iNes->ReadAudio(buf, nes::kAudioRing);
                  }

              iBitmap->LockHeap();
              TUint32* dst = (TUint32*)iBitmap->DataAddress();
              const TUint32* src = (const TUint32*)iNes->FrameBuffer();
              TInt stride = iBitmap->DataStride();
              if (stride == nes::kScreenW * 4)
                  {
                  Mem::Copy(dst, src, nes::kScreenW * nes::kScreenH * 4);
                  }
              else
                  {
                  for (TInt y = 0; y < nes::kScreenH; ++y)
                      {
                      Mem::Copy(((TUint8*)dst) + y * stride, src + y * nes::kScreenW, nes::kScreenW * 4);
                      }
                  }
              iBitmap->UnlockHeap();
              DrawNow();
              }

          // ---------------------------------------------------------------------------
          // ROM and file handling
          // ---------------------------------------------------------------------------
          void CVNesContainer::SaveBattery()
              {
              if (!iHaveRom || !iNes->HasBattery() || iRomPath.Length() == 0)
                  {
                  return;
                  }
              TInt dot = iRomPath.LocateReverse('.');
              TFileName sav = (dot > 0) ? iRomPath.Left(dot) : iRomPath;
              sav.Append(KExtSav);
              RFile f;
              if (f.Replace(iFs, sav, EFileWrite) == KErrNone)
                  {
                  TPtrC8 data(iNes->SaveRam(), (TInt)iNes->SaveRamSize());
                  f.Write(data);
                  f.Close();
                  }
              }

          void CVNesContainer::LoadRomL(const TDesC& aPath)
              {
              SaveBattery();
              iHaveRom = EFalse;
              StopTimer();

              RFile f;
              User::LeaveIfError(f.Open(iFs, aPath, EFileRead | EFileShareReadersOnly));
              CleanupClosePushL(f);
              TInt size = 0;
              User::LeaveIfError(f.Size(size));
              HBufC8* buf = HBufC8::NewLC(size);
              TPtr8 p = buf->Des();
              User::LeaveIfError(f.Read(p));

              TBool ok = iNes->LoadRom((const nes::u8*)buf->Ptr(), (TUint)buf->Length());
              CleanupStack::PopAndDestroy(2);     // buf, f

              if (!ok)
                  {
                  TPtrC8 err((const TUint8*)iNes->LastError());
                  iMessage.Copy(err.Left(iMessage.MaxLength()));
                  return;
                  }
              iRomPath = aPath;
              iHaveRom = ETrue;
              iMessage.Zero();

              if (iNes->HasBattery())
                  {
                  TInt dot = iRomPath.LocateReverse('.');
                  TFileName sav = (dot > 0) ? iRomPath.Left(dot) : iRomPath;
                  sav.Append(KExtSav);
                  RFile sf;
                  if (sf.Open(iFs, sav, EFileRead | EFileShareReadersOnly) == KErrNone)
                      {
                      TPtr8 sp(iNes->SaveRam(), 0, (TInt)iNes->SaveRamSize());
                      sf.Read(sp);
                      sf.Close();
                      }
                  }
              iKeyPad = 0;
              iTouchPad = 0;
              iMode = EPlay;
              if (iAudio && iSound)
                  {
                  iAudio->Resume();
                  }
              StartTimer();
              }

          void CVNesContainer::ShowDrivesL()
              {
              iEntries->Reset();
              iDir.Zero();
              TDriveList list;
              User::LeaveIfError(iFs.DriveList(list));
              for (TInt d = 0; d < KMaxDrives; ++d)
                  {
                  if (list[d])
                      {
                      TChar ch;
                      User::LeaveIfError(iFs.DriveToChar(d, ch));
                      TBuf<4> n;
                      n.Append(ch);
                      n.Append(_L(":\\"));
                      iEntries->AppendL(n);
                      }
                  }
              iSel = 0;
              iScroll = 0;
              }

          void CVNesContainer::ShowDirL(const TDesC& aDir)
              {
              CDir* list = NULL;
              User::LeaveIfError(iFs.GetDir(aDir, KEntryAttNormal | KEntryAttDir, ESortByName | EDirsFirst, list));
              CleanupStack::PushL(list);
              iEntries->Reset();
              iEntries->AppendL(KUp);
              for (TInt i = 0; i < list->Count(); ++i)
                  {
                  const TEntry& e = (*list)[i];
                  if (e.IsDir())
                      {
                      TFileName n = e.iName;
                      n.Append('\\');
                      iEntries->AppendL(n);
                      }
                  else if (e.iName.Length() > 4 && e.iName.Right(4).CompareF(KExtNes) == 0)
                      {
                      iEntries->AppendL(e.iName);
                      }
                  }
              CleanupStack::PopAndDestroy(list);
              iDir = aDir;
              iSel = 0;
              iScroll = 0;
              }

          void CVNesContainer::GoUpL()
              {
              TInt len = iDir.Length();
              if (len <= 3)
                  {
                  ShowDrivesL();
                  return;
                  }
              TFileName t = iDir.Left(len - 1);       // drop trailing '\'
              TInt pos = t.LocateReverse('\\');
              if (pos < 0)
                  {
                  ShowDrivesL();
                  return;
                  }
              TFileName parent = t.Left(pos + 1);
              ShowDirL(parent);
              }

          void CVNesContainer::ActivateEntryL(TInt aIndex)
              {
              if (aIndex < 0 || aIndex >= iEntries->Count())
                  {
                  return;
                  }
              TPtrC name = (*iEntries)[aIndex];
              if (iDir.Length() == 0)
                  {
                  TFileName d = name;                 // drive root
                  ShowDirL(d);
                  return;
                  }
              if (name.Compare(KUp) == 0)
                  {
                  GoUpL();
                  return;
                  }
              TFileName full = iDir;
              full.Append(name);
              if (name.Length() > 0 && name[name.Length() - 1] == '\\')
                  {
                  TRAPD(err, ShowDirL(full));
                  if (err != KErrNone)
                      {
                      SetMessage(_L("Cannot open folder"));
                      }
                  return;
                  }
              TRAPD(err, LoadRomL(full));
              if (err != KErrNone)
                  {
                  SetMessage(_L("Cannot read file"));
                  }
              }

          void CVNesContainer::MenuActionL(TInt aIndex)
              {
              switch (aIndex)
                  {
                  case 0:     // resume
                      if (iHaveRom)
                          {
                          iMode = EPlay;
                          StartTimer();
                          }
                      break;
                  case 1:     // load ROM
                      SaveBattery();
                      iMode = EBrowse;
                      break;
                  case 2:     // reset
                      if (iHaveRom)
                          {
                          iNes->Reset();
                          iMode = EPlay;
                          StartTimer();
                          }
                      break;
                  case 3:     // scaling
                      iFit = !iFit;
                      break;
                  case 4:     // sound
                      iSound = !iSound;
                      if (iAudio)
                          {
                          if (iSound) iAudio->Resume(); else iAudio->Suspend();
                          }
                      break;
                  default:    // exit
                      iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit);
                      break;
                  }
              DrawNow();
              }

          // ---------------------------------------------------------------------------
          // Layout and drawing
          // ---------------------------------------------------------------------------
          void CVNesContainer::SizeChanged()
              {
              ComputeLayout();
              }

          void CVNesContainer::ComputeLayout()
              {
              TRect r = Rect();
              TInt w = r.Width(), h = r.Height();
              TInt R = Min(h / 4, w / 6);
              if (R < 30) R = 30;
              iDpadR = R;
              iDpadCentre = TPoint(R + 12, h - R - 12);
              TInt br = R * 2 / 5;
              TPoint a(w - br - 14, h - R - 12 - br / 2);
              TPoint b(w - 3 * br - 30, h - R - 12 + br / 2);
              iBtnA = TRect(a.iX - br, a.iY - br, a.iX + br, a.iY + br);
              iBtnB = TRect(b.iX - br, b.iY - br, b.iX + br, b.iY + br);
              TInt sw = 84, sh = 38;
              iBtnSelect = TRect(w / 2 - sw - 8, h - sh - 8, w / 2 - 8, h - 8);
              iBtnStart = TRect(w / 2 + 8, h - sh - 8, w / 2 + sw + 8, h - 8);
              iBtnMenu = TRect(w - 78, 6, w - 6, 44);
              }

          TRect CVNesContainer::GameRect() const
              {
              TRect r = Rect();
              TInt w = r.Width(), h = r.Height();
              TInt dw, dh;
              if (iFit)
                  {
                  if (h * nes::kScreenW <= w * nes::kScreenH)
                      {
                      dh = h;
                      dw = h * nes::kScreenW / nes::kScreenH;
                      }
                  else
                      {
                      dw = w;
                      dh = w * nes::kScreenH / nes::kScreenW;
                      }
                  }
              else
                  {
                  dw = nes::kScreenW;
                  dh = nes::kScreenH;
                  }
              TInt x = (w - dw) / 2;
              TInt y = (h - dh) / 2;
              return TRect(x, y, x + dw, y + dh);
              }

          TInt CVNesContainer::RowHeight() const
              {
              return 52;
              }

          void CVNesContainer::DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbGray);
              if (aDown)
                  {
                  aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
                  aGc.SetBrushColor(TRgb(70, 70, 110));
                  }
              else
                  {
                  aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
                  }
              aGc.DrawRect(aRect);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              aGc.SetPenColor(KRgbWhite);
              TInt base = (aRect.Height() + font->AscentInPixels() - font->DescentInPixels()) / 2;
              aGc.DrawText(aLabel, aRect, base, CGraphicsContext::ECenter, 0);
              aGc.DiscardFont();
              }

          void CVNesContainer::DrawPad(CWindowGc& aGc) const
              {
              TUint8 p = (TUint8)(iKeyPad | iTouchPad);
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbGray);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              TRect pad(iDpadCentre.iX - iDpadR, iDpadCentre.iY - iDpadR, iDpadCentre.iX + iDpadR, iDpadCentre.iY + iDpadR);
              aGc.DrawEllipse(pad);
              TInt q = iDpadR / 3;
              TRect up(iDpadCentre.iX - q, iDpadCentre.iY - iDpadR, iDpadCentre.iX + q, iDpadCentre.iY - q);
              TRect dn(iDpadCentre.iX - q, iDpadCentre.iY + q, iDpadCentre.iX + q, iDpadCentre.iY + iDpadR);
              TRect lf(iDpadCentre.iX - iDpadR, iDpadCentre.iY - q, iDpadCentre.iX - q, iDpadCentre.iY + q);
              TRect rt(iDpadCentre.iX + q, iDpadCentre.iY - q, iDpadCentre.iX + iDpadR, iDpadCentre.iY + q);
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(TRgb(70, 70, 110));
              if (p & nes::kPadUp) aGc.DrawRect(up);
              if (p & nes::kPadDown) aGc.DrawRect(dn);
              if (p & nes::kPadLeft) aGc.DrawRect(lf);
              if (p & nes::kPadRight) aGc.DrawRect(rt);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              aGc.DrawLine(TPoint(iDpadCentre.iX - iDpadR, iDpadCentre.iY), TPoint(iDpadCentre.iX + iDpadR, iDpadCentre.iY));
              aGc.DrawLine(TPoint(iDpadCentre.iX, iDpadCentre.iY - iDpadR), TPoint(iDpadCentre.iX, iDpadCentre.iY + iDpadR));
              DrawButton(aGc, iBtnA, _L("A"), p & nes::kPadA);
              DrawButton(aGc, iBtnB, _L("B"), p & nes::kPadB);
              DrawButton(aGc, iBtnSelect, _L("Select"), p & nes::kPadSelect);
              DrawButton(aGc, iBtnStart, _L("Start"), p & nes::kPadStart);
              DrawButton(aGc, iBtnMenu, _L("Menu"), EFalse);
              }

          void CVNesContainer::DrawBrowser(CWindowGc& aGc) const
              {
              TRect r = Rect();
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              aGc.SetPenColor(KRgbCyan);
              TRect head(r.iTl.iX + 8, r.iTl.iY, r.iBr.iX - 8, r.iTl.iY + 40);
              TPtrC title = iDir.Length() ? TPtrC(iDir) : TPtrC(_L("Select drive"));
              aGc.DrawText(title, head, 28, CGraphicsContext::ELeft, 0);

              TInt rh = RowHeight();
              TInt top = 44;
              TInt rows = (r.Height() - top) / rh;
              for (TInt i = 0; i < rows + 1; ++i)
                  {
                  TInt idx = iScroll + i;
                  if (idx >= iEntries->Count())
                      {
                      break;
                      }
                  TRect row(r.iTl.iX, top + i * rh, r.iBr.iX, top + (i + 1) * rh);
                  if (idx == iSel)
                      {
                      aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
                      aGc.SetBrushColor(TRgb(40, 60, 110));
                      aGc.SetPenStyle(CGraphicsContext::ENullPen);
                      aGc.DrawRect(row);
                      aGc.SetPenStyle(CGraphicsContext::ESolidPen);
                      aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
                      }
                  TPtrC name = (*iEntries)[idx];
                  TBool isDir = iDir.Length() == 0 || name.Compare(KUp) == 0 ||
                                (name.Length() > 0 && name[name.Length() - 1] == '\\');
                  aGc.SetPenColor(isDir ? TRgb(240, 220, 120) : KRgbWhite);
                  TRect text(row.iTl.iX + 16, row.iTl.iY, row.iBr.iX - 8, row.iBr.iY);
                  aGc.DrawText(name, text, rh / 2 + font->AscentInPixels() / 2, CGraphicsContext::ELeft, 0);
                  }
              if (iMessage.Length())
                  {
                  aGc.SetPenColor(TRgb(255, 120, 120));
                  TRect m(r.iTl.iX + 8, r.iBr.iY - 36, r.iBr.iX - 8, r.iBr.iY);
                  aGc.DrawText(iMessage, m, 26, CGraphicsContext::ELeft, 0);
                  }
              aGc.DiscardFont();
              }

          void CVNesContainer::DrawMenu(CWindowGc& aGc) const
              {
              TRect r = Rect();
              TInt w = 320, rh = 46;
              TInt h = KMenuCount * rh;
              TRect box((r.Width() - w) / 2, (r.Height() - h) / 2, (r.Width() + w) / 2, (r.Height() + h) / 2);
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KRgbGray);
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(TRgb(20, 20, 30));
              aGc.DrawRect(box);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              TBuf<24> label[KMenuCount];
              label[0] = _L("Resume");
              label[1] = _L("Load ROM");
              label[2] = _L("Reset");
              label[3] = iFit ? _L("Scale: fit screen") : _L("Scale: 1:1");
              label[4] = iSound ? _L("Sound: on") : _L("Sound: off");
              label[5] = _L("Exit");
              for (TInt i = 0; i < KMenuCount; ++i)
                  {
                  TRect row(box.iTl.iX, box.iTl.iY + i * rh, box.iBr.iX, box.iTl.iY + (i + 1) * rh);
                  if (i == iMenuSel)
                      {
                      aGc.SetBrushColor(TRgb(40, 60, 110));
                      aGc.SetPenStyle(CGraphicsContext::ENullPen);
                      aGc.DrawRect(row);
                      aGc.SetPenStyle(CGraphicsContext::ESolidPen);
                      }
                  aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
                  aGc.SetPenColor(KRgbWhite);
                  TRect text(row.iTl.iX + 16, row.iTl.iY, row.iBr.iX, row.iBr.iY);
                  aGc.DrawText(label[i], text, rh / 2 + font->AscentInPixels() / 2, CGraphicsContext::ELeft, 0);
                  aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
                  }
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              aGc.DiscardFont();
              }

          void CVNesContainer::Draw(const TRect& /*aRect*/) const
              {
              CWindowGc& gc = SystemGc();
              gc.SetPenStyle(CGraphicsContext::ESolidPen);
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(KRgbBlack);
              gc.Clear(Rect());
              gc.SetBrushStyle(CGraphicsContext::ENullBrush);

              if (iMode == EBrowse)
                  {
                  DrawBrowser(gc);
                  return;
                  }
              if (iHaveRom)
                  {
                  TRect g = GameRect();
                  if (g.Width() == nes::kScreenW)
                      {
                      gc.BitBlt(g.iTl, iBitmap);
                      }
                  else
                      {
                      gc.DrawBitmap(g, iBitmap);
                      }
                  }
              DrawPad(gc);
              if (iMode == EMenu)
                  {
                  DrawMenu(gc);
                  }
              }

          // ---------------------------------------------------------------------------
          // Input
          // ---------------------------------------------------------------------------
          TUint8 CVNesContainer::PadFromPoint(const TPoint& aPt) const
              {
              TUint8 bits = 0;
              if (iBtnA.Contains(aPt)) bits |= nes::kPadA;
              if (iBtnB.Contains(aPt)) bits |= nes::kPadB;
              if (iBtnSelect.Contains(aPt)) bits |= nes::kPadSelect;
              if (iBtnStart.Contains(aPt)) bits |= nes::kPadStart;
              TInt dx = aPt.iX - iDpadCentre.iX;
              TInt dy = aPt.iY - iDpadCentre.iY;
              TInt lim = iDpadR + iDpadR / 3;
              if (dx > -lim && dx < lim && dy > -lim && dy < lim)
                  {
                  TInt dead = iDpadR / 4;
                  if (dx < -dead) bits |= nes::kPadLeft;
                  if (dx > dead) bits |= nes::kPadRight;
                  if (dy < -dead) bits |= nes::kPadUp;
                  if (dy > dead) bits |= nes::kPadDown;
                  }
              return bits;
              }

          void CVNesContainer::HandlePointerEventL(const TPointerEvent& aEvent)
              {
              const TPoint pt = aEvent.iPosition;

              if (iMode == EPlay)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Down && iBtnMenu.Contains(pt))
                      {
                      iTouchPad = 0;
                      iMode = EMenu;
                      iMenuSel = 0;
                      StopTimer();
                      SaveBattery();
                      DrawNow();
                      return;
                      }
                  if (aEvent.iType == TPointerEvent::EButton1Down || aEvent.iType == TPointerEvent::EDrag)
                      {
                      iTouchPad = PadFromPoint(pt);
                      }
                  else if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      iTouchPad = 0;
                      }
                  return;
                  }

              if (iMode == EMenu)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      TRect r = Rect();
                      TInt w = 320, rh = 46, h = KMenuCount * rh;
                      TRect box((r.Width() - w) / 2, (r.Height() - h) / 2, (r.Width() + w) / 2, (r.Height() + h) / 2);
                      if (box.Contains(pt))
                          {
                          MenuActionL((pt.iY - box.iTl.iY) / rh);
                          }
                      else
                          {
                          MenuActionL(0);
                          }
                      }
                  return;
                  }

              // browser
              TInt rh = RowHeight();
              switch (aEvent.iType)
                  {
                  case TPointerEvent::EButton1Down:
                      iDragging = EFalse;
                      iDragStartY = pt.iY;
                      iDragScroll = iScroll;
                      break;
                  case TPointerEvent::EDrag:
                      {
                      TInt dy = iDragStartY - pt.iY;
                      if (dy > 12 || dy < -12)
                          {
                          iDragging = ETrue;
                          }
                      if (iDragging)
                          {
                          TInt s = iDragScroll + dy / rh;
                          TInt maxScroll = iEntries->Count() - 1;
                          if (s > maxScroll) s = maxScroll;
                          if (s < 0) s = 0;
                          if (s != iScroll)
                              {
                              iScroll = s;
                              DrawNow();
                              }
                          }
                      break;
                      }
                  case TPointerEvent::EButton1Up:
                      if (!iDragging)
                          {
                          TInt idx = iScroll + (pt.iY - 44) / rh;
                          if (pt.iY >= 44 && idx >= 0 && idx < iEntries->Count())
                              {
                              iSel = idx;
                              iMessage.Zero();
                              ActivateEntryL(idx);
                              }
                          else if (iHaveRom && pt.iY < 44)
                              {
                              iMode = EPlay;
                              StartTimer();
                              }
                          DrawNow();
                          }
                      iDragging = EFalse;
                      break;
                  default:
                      break;
                  }
              }

          TKeyResponse CVNesContainer::OfferKeyEventL(const TKeyEvent& aKey, TEventCode aType)
              {
              const TInt sc = aKey.iScanCode;

              if (iMode == EPlay)
                  {
                  TUint8 bit = 0;
                  switch (sc)
                      {
                      case EStdKeyUpArrow:    bit = nes::kPadUp; break;
                      case EStdKeyDownArrow:  bit = nes::kPadDown; break;
                      case EStdKeyLeftArrow:  bit = nes::kPadLeft; break;
                      case EStdKeyRightArrow: bit = nes::kPadRight; break;
                      case 'X': case 'S':     bit = nes::kPadA; break;
                      case 'Z': case 'A':     bit = nes::kPadB; break;
                      case EStdKeyEnter: case EStdKeyDevice3: bit = nes::kPadStart; break;
                      case EStdKeySpace: case EStdKeyBackspace: bit = nes::kPadSelect; break;
                      default: break;
                      }
                  if (aType == EEventKeyDown && sc == EStdKeyDevice0)      // left soft key
                      {
                      iKeyPad = 0;
                      iMode = EMenu;
                      iMenuSel = 0;
                      StopTimer();
                      SaveBattery();
                      DrawNow();
                      return EKeyWasConsumed;
                      }
                  if (bit)
                      {
                      if (aType == EEventKeyDown) iKeyPad |= bit;
                      else if (aType == EEventKeyUp) iKeyPad &= (TUint8)~bit;
                      return EKeyWasConsumed;
                      }
                  return EKeyWasNotConsumed;
                  }

              if (aType != EEventKeyDown)
                  {
                  return (sc == EStdKeyUpArrow || sc == EStdKeyDownArrow || sc == EStdKeyEnter ||
                          sc == EStdKeyDevice3 || sc == EStdKeyDevice0) ? EKeyWasConsumed : EKeyWasNotConsumed;
                  }

              if (iMode == EMenu)
                  {
                  if (sc == EStdKeyUpArrow && iMenuSel > 0) --iMenuSel;
                  else if (sc == EStdKeyDownArrow && iMenuSel < KMenuCount - 1) ++iMenuSel;
                  else if (sc == EStdKeyEnter || sc == EStdKeyDevice3) { MenuActionL(iMenuSel); return EKeyWasConsumed; }
                  else if (sc == EStdKeyDevice0) { MenuActionL(0); return EKeyWasConsumed; }
                  else return EKeyWasNotConsumed;
                  DrawNow();
                  return EKeyWasConsumed;
                  }

              // browser
              TInt rh = RowHeight();
              TInt rows = (Rect().Height() - 44) / rh;
              if (rows < 1) rows = 1;
              if (sc == EStdKeyUpArrow && iSel > 0) --iSel;
              else if (sc == EStdKeyDownArrow && iSel < iEntries->Count() - 1) ++iSel;
              else if (sc == EStdKeyEnter || sc == EStdKeyDevice3) { ActivateEntryL(iSel); DrawNow(); return EKeyWasConsumed; }
              else if (sc == EStdKeyDevice0 && iHaveRom) { iMode = EPlay; StartTimer(); DrawNow(); return EKeyWasConsumed; }
              else if (sc == EStdKeyBackspace) { GoUpL(); DrawNow(); return EKeyWasConsumed; }
              else return EKeyWasNotConsumed;
              if (iSel < iScroll) iScroll = iSel;
              if (iSel >= iScroll + rows) iScroll = iSel - rows + 1;
              DrawNow();
              return EKeyWasConsumed;
              }
