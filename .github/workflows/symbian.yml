          #include "nes.h"

          namespace nes {

          Nes::Nes() {
              // The class holds only integers and pointers (no vtable), so a raw clear is
              // safe and keeps the constructor valid on allocators that don't zero memory.
              MemFill(this, 0, sizeof(Nes));
              error_ = "";
          }

          Nes::~Nes() {
              Unload();
              PlatFree(ram_);
              PlatFree(vram_);
              PlatFree(prgRam_);
              PlatFree(fb_);
              ram_ = 0; vram_ = 0; prgRam_ = 0; fb_ = 0;
          }

          bool Nes::Init() {
              ram_ = (u8*)PlatAlloc(0x800);
              vram_ = (u8*)PlatAlloc(0x1000);
              prgRam_ = (u8*)PlatAlloc(0x2000);
              fb_ = (u32*)PlatAlloc(kScreenW * kScreenH * 4);
              if (!ram_ || !vram_ || !prgRam_ || !fb_) { error_ = "Out of memory"; return false; }
              return true;
          }

          void Nes::Unload() {
              romLoaded_ = false;
              PlatFree(prg_); prg_ = 0; prgSize_ = 0;
              PlatFree(chr_); chr_ = 0; chrSize_ = 0;
          }

          static bool MapperSupported(int id) {
              switch (id) {
              case 0: case 1: case 2: case 3: case 4: case 7: case 9: case 10: case 11:
              case 33: case 34: case 66: case 71: case 75: case 79: case 87: case 94:
              case 140: case 180:
                  return true;
              default:
                  return false;
              }
          }

          bool Nes::LoadRom(const u8* d, u32 size) {
              Unload();
              if (!ram_ && !Init()) return false;
              if (size < 16 || d[0] != 'N' || d[1] != 'E' || d[2] != 'S' || d[3] != 0x1A) {
                  error_ = "Not an iNES file";
                  return false;
              }
              u32 prgKb16 = d[4], chrKb8 = d[5];
              u8 f6 = d[6], f7 = d[7];
              int mapper = (f6 >> 4) | (f7 & 0xF0);
              if ((f7 & 0x0C) == 0x08) mapper = (f6 >> 4) | (f7 & 0xF0) | ((d[8] & 0x0F) << 8);   // NES 2.0
              if (!MapperSupported(mapper)) { error_ = "Mapper not supported"; return false; }
              u32 off = 16 + ((f6 & 4) ? 512 : 0);
              u32 prgBytes = prgKb16 * 16384u;
              u32 chrBytes = chrKb8 * 8192u;
              if (prgBytes == 0 || off + prgBytes + chrBytes > size) { error_ = "ROM file is truncated"; return false; }

              prg_ = (u8*)PlatAlloc(prgBytes);
              if (!prg_) { error_ = "Out of memory"; return false; }
              MemCopy(prg_, d + off, prgBytes);
              prgSize_ = prgBytes;
              prgBanks8_ = prgBytes / 0x2000;
              if (chrBytes) {
                  chr_ = (u8*)PlatAlloc(chrBytes);
                  if (!chr_) { Unload(); error_ = "Out of memory"; return false; }
                  MemCopy(chr_, d + off + prgBytes, chrBytes);
                  chrSize_ = chrBytes;
                  chrIsRam_ = false;
              } else {
                  chrSize_ = 0x2000;
                  chr_ = (u8*)PlatAlloc(chrSize_);
                  if (!chr_) { Unload(); error_ = "Out of memory"; return false; }
                  chrIsRam_ = true;
              }
              chrBanks1_ = chrSize_ / 0x400;
              mapperId_ = mapper;
              battery_ = (f6 & 2) != 0;
              fourScreen_ = (f6 & 8) != 0;
              mirrorMode_ = fourScreen_ ? kMirrorFour : ((f6 & 1) ? kMirrorVert : kMirrorHoriz);
              MemFill(prgRam_, 0, 0x2000);
              error_ = "";
              romLoaded_ = true;
              Reset();
              return true;
          }

          void Nes::Reset() {
              if (!romLoaded_) return;
              MemFill(ram_, 0xFF, 0x800);
              ram_[0x008] = 0xF7; ram_[0x009] = 0xEF; ram_[0x00A] = 0xDF; ram_[0x00F] = 0xBF;   // same power-on pattern as vNES
              MemFill(vram_, 0, 0x1000);
              if (chrIsRam_) MemFill(chr_, 0, chrSize_);
              padStrobe_ = 0;
              padShift_[0] = padShift_[1] = 0;
              MapperInit();
              PpuReset();
              ApuReset();
              CpuReset();
              frameCount_ = 0;
              MemFill(fb_, 0, kScreenW * kScreenH * 4);
          }

          void Nes::RunFrame(bool render) {
              if (!romLoaded_) return;
              for (int line = 0; line < 262; ++line) RunScanline(line, render);
              ++frameCount_;
          }

          }  // namespace nes
          VNES_EOF
          mkdir -p symbian/core
          cat > symbian/core/nes.h <<'VNES_EOF'
          // nes.h - portable NES core for the vNES Symbian port.
          //
          // Plain C++98: no exceptions, no RTTI, no STL, no static constructors, no
          // floating point.  The only platform dependency is PlatAlloc/PlatFree, which
          // the host application provides (see app/src/nes_platform.cpp on Symbian and
          // tools/host_test.cpp on a desktop machine).
          #ifndef NES_H
          #define NES_H

          namespace nes {

          typedef unsigned char u8;
          typedef signed char s8;
          typedef unsigned short u16;
          typedef short s16;
          typedef unsigned int u32;
          typedef int s32;

          enum {
              kScreenW = 256,
              kScreenH = 240,
              kAudioRate = 22050,
              kAudioRing = 2048
          };

          // Joypad bit layout used by SetPad().
          enum {
              kPadA = 0x01, kPadB = 0x02, kPadSelect = 0x04, kPadStart = 0x08,
              kPadUp = 0x10, kPadDown = 0x20, kPadLeft = 0x40, kPadRight = 0x80
          };

          // Provided by the host.  PlatAlloc returns zero-filled memory or 0.
          void* PlatAlloc(u32 size);
          void PlatFree(void* p);

          inline void MemCopy(void* d, const void* s, u32 n) {
              u8* dd = (u8*)d;
              const u8* ss = (const u8*)s;
              while (n--) *dd++ = *ss++;
          }
          inline void MemFill(void* d, u8 v, u32 n) {
              u8* dd = (u8*)d;
              while (n--) *dd++ = v;
          }

          enum Mirroring { kMirrorHoriz = 0, kMirrorVert = 1, kMirrorSingle0 = 2, kMirrorSingle1 = 3, kMirrorFour = 4 };

          struct PulseChan {
              u8 enabled, duty, lenHalt, constVol, vol;
              u8 envStart, envDiv, envDecay;
              u8 sweepEn, sweepPeriod, sweepNeg, sweepShift, sweepReload, sweepDiv;
              u16 timer;
              u32 acc;       // 16.16 CPU cycles accumulated towards the next duty step
              u8 phase;
              u8 length;
              u8 out;
          };

          struct TriChan {
              u8 enabled, control, linearReload, linearCount, reloadFlag;
              u16 timer;
              u32 acc;
              u8 phase, length, out;
          };

          struct NoiseChan {
              u8 enabled, lenHalt, constVol, vol;
              u8 envStart, envDiv, envDecay;
              u8 mode, periodIdx;
              u16 shift;
              u32 acc;
              u8 length, out;
          };

          struct DmcChan {
              u8 enabled, irqEn, loop, rateIdx, level;
              u16 sampleAddr, sampleLen, curAddr, remain;
              u8 buf, hasBuf, shiftReg, bitsLeft, silence;
              u32 acc;
              u8 irq;
          };

          class Nes {
          public:
              Nes();
              ~Nes();

              bool Init();                                   // allocate working memory
              bool LoadRom(const u8* data, u32 size);        // iNES image; copies what it needs
              void Unload();
              bool RomLoaded() const { return romLoaded_; }
              const char* LastError() const { return error_; }
              int MapperId() const { return mapperId_; }

              void Reset();
              // Runs one video frame.  When render is false the PPU still runs (sprite 0
              // hit, mapper IRQ) but pixels are not converted to RGB.
              void RunFrame(bool render);

              void SetPad(int idx, u8 bits) { padState_[idx & 1] = bits; }
              const u32* FrameBuffer() const { return fb_; }       // 256x240, 0x00RRGGBB

              int ReadAudio(s16* dst, int maxSamples);            // pops mono S16 samples

              bool HasBattery() const { return battery_; }
              u8* SaveRam() { return prgRam_; }
              u32 SaveRamSize() const { return 0x2000; }

              // ---- everything below is core-internal but public for speed/simplicity ----
              // CPU
              u8 a_, x_, y_, sp_;
              u16 pc_;
              u8 fC_, fZ_, fI_, fD_, fV_, fN_;
              u8 nmiPending_;
              s32 dotBudget_;       // PPU dots (3 per CPU cycle) left to run
              u32 cpuCycles_;       // total CPU cycles executed

              void CpuReset();
              void CpuRun(s32 dots);
              u32 CpuStep();
              u8 Read(u16 a);
              void Write(u16 a, u8 v);
              u8 ReadSlow(u16 a);
              u8 Peek(u16 a) { return Read(a); }
              void Push(u8 v) { ram_[0x100 + sp_] = v; --sp_; }
              u8 Pull() { ++sp_; return ram_[0x100 + sp_]; }
              u8 GetP(bool brk) const;
              void SetP(u8 p);

              // PPU
              u8 ppuCtrl_, ppuMask_, ppuStatus_, oamAddr_, ppuBuf_, ppuLatch_;
              u16 v_, t_;
              u8 fineX_, w_;
              u8 oam_[256];
              u8 palRam_[32];
              u32 pal32_[64];
              u32 palOut_[32];
              u8 lineBg_[256 + 16];
              u8 lineSpr_[256 + 16];
              int s0HitX_;           // dot (0..255) at which sprite 0 hits on this line, or -1
              int frameCount_;

              void PpuReset();
              void PpuWrite(u16 reg, u8 v);
              u8 PpuReadReg(u16 reg);
              u8 PpuRead(u16 addr);
              void PpuWriteMem(u16 addr, u8 v);
              void RenderLine(int y, bool render);
              void FillBackdrop(int y);
              void SetMirroring(int mode);
              void UpdatePalOut();
              bool Rendering() const { return (ppuMask_ & 0x18) != 0; }
              void IncV();
              void EndLineScroll(int line);
              void RunScanline(int line, bool render);

              // APU
              PulseChan pulse_[2];
              TriChan tri_;
              NoiseChan noise_;
              DmcChan dmc_;
              u8 fcMode5_, fcIrqInhibit_, fcStep_, fcIrq_;
              u32 fcAcc_;
              s32 dotAcc_;
              s32 hpPrev_, hpOut_;
              s16 audio_[kAudioRing];
              int audioHead_, audioTail_, audioCount_;

              void ApuReset();
              void ApuWrite(u16 a, u8 v);
              u8 ApuReadStatus();
              void ApuRunLine(s32 dots);
              void ApuSample();
              void ApuQuarter();
              void ApuHalf();
              void ApuDmcBit();
              void ApuDmcFetch();

              // Mapper
              int mapperId_;
              u8 mirrorMode_;
              u8* prg_; u32 prgSize_;
              u8* chr_; u32 chrSize_; bool chrIsRam_;
              u8 prgRamData_[1];   // (unused marker; real RAM is prgRam_)
              u8* prgRam_;
              u8* vram_;           // 4 KB (2 KB used unless four-screen)
              u8* prgPtr_[4];      // 8 KB windows at $8000/$A000/$C000/$E000
              u8* chrPtr_[8];      // 1 KB windows
              u8* ntPtr_[4];
              bool battery_, fourScreen_;
              u8 mapIrq_;
              u32 prgBanks8_, chrBanks1_;
              // mapper register file (union of what the supported mappers need)
              u32 mreg_[16];
              u8 mm1_shift_, mm1_count_;
              u8 mm3_irqLatch_, mm3_irqCounter_, mm3_irqEnable_, mm3_irqReload_;
              u8 mm9_latch_[2];
              u8 mm9_sel_[2][2];

              void MapperInit();
              void MapperWrite(u16 a, u8 v);       // $8000-$FFFF
              void MapperWriteLow(u16 a, u8 v);    // $4020-$7FFF
              void MapperScanline();
              void MapperPpuFetch(u16 addr);       // called for pattern fetches (MMC2/4)
              void Prg8(int slot, u32 bank);
              void Prg16(int slot, u32 bank);      // slot 0 -> $8000, 1 -> $C000
              void Prg32(u32 bank);
              void Chr1(int slot, u32 bank);
              void Chr2(int slot, u32 bank);
              void Chr4(int slot, u32 bank);
              void Chr8(u32 bank);
              void Mmc1Sync();
              void Mmc3Sync();
              void Mmc2Sync();

              // Cartridge / system RAM
              u8* ram_;            // 2 KB
              u8 padState_[2];
              u8 padShift_[2];
              u8 padStrobe_;
              u32* fb_;
              bool romLoaded_;
              const char* error_;
          };

          }  // namespace nes

          #endif
          VNES_EOF
          mkdir -p symbian/core
          cat > symbian/core/nes_apu.cpp <<'VNES_EOF'
          // nes_apu.cpp - audio unit.  Channels are advanced per output sample (22.05 kHz)
          // in 16.16 fixed point CPU cycles; no floating point is used.
          #include "nes.h"
          #include "nes_apu_tables.h"

          namespace nes {

          static const u8 kLen[32] = {
              10, 254, 20, 2, 40, 4, 80, 6, 160, 8, 60, 10, 14, 12, 26, 14,
              12, 16, 24, 18, 48, 20, 96, 22, 192, 24, 72, 26, 16, 28, 32, 30 };
          static const u8 kDuty[4] = { 0x40, 0x60, 0x78, 0x9F };
          static const u16 kNoisePeriod[16] = { 4, 8, 16, 32, 64, 96, 128, 160, 202, 254, 380, 508, 762, 1016, 2034, 4068 };
          static const u16 kDmcRate[16] = { 428, 380, 340, 320, 286, 254, 226, 214, 190, 160, 142, 128, 106, 84, 72, 54 };

          static const u32 kCpuPerSample16 = 5319424u;    // 81.17 CPU cycles per sample, 16.16
          static const u32 kFrameStep16 = 488734720u;     // 7457.5 CPU cycles, 16.16
          static const s32 kDotsPerSample256 = 62337;     // 243.5 PPU dots per sample, 24.8

          void Nes::ApuReset() {
              MemFill(pulse_, 0, sizeof(pulse_));
              MemFill(&tri_, 0, sizeof(tri_));
              MemFill(&noise_, 0, sizeof(noise_));
              MemFill(&dmc_, 0, sizeof(dmc_));
              noise_.shift = 1;
              dmc_.bitsLeft = 8;
              dmc_.silence = 1;
              dmc_.sampleAddr = 0xC000;
              dmc_.sampleLen = 1;
              fcMode5_ = fcIrqInhibit_ = fcStep_ = fcIrq_ = 0;
              fcAcc_ = 0;
              dotAcc_ = 0;
              hpPrev_ = hpOut_ = 0;
              audioHead_ = audioTail_ = audioCount_ = 0;
          }

          void Nes::ApuWrite(u16 a, u8 v) {
              if (a >= 0x4000 && a <= 0x4007) {
                  PulseChan& p = pulse_[(a >> 2) & 1];
                  switch (a & 3) {
                  case 0: p.duty = v >> 6; p.lenHalt = (v >> 5) & 1; p.constVol = (v >> 4) & 1; p.vol = v & 15; break;
                  case 1: p.sweepEn = v >> 7; p.sweepPeriod = (v >> 4) & 7; p.sweepNeg = (v >> 3) & 1;
                          p.sweepShift = v & 7; p.sweepReload = 1; break;
                  case 2: p.timer = (u16)((p.timer & 0x700) | v); break;
                  default:
                      p.timer = (u16)((p.timer & 0xFF) | ((v & 7) << 8));
                      if (p.enabled) p.length = kLen[v >> 3];
                      p.phase = 0;
                      p.envStart = 1;
                      break;
                  }
                  return;
              }
              switch (a) {
              case 0x4008: tri_.control = v >> 7; tri_.linearReload = v & 0x7F; break;
              case 0x400A: tri_.timer = (u16)((tri_.timer & 0x700) | v); break;
              case 0x400B:
                  tri_.timer = (u16)((tri_.timer & 0xFF) | ((v & 7) << 8));
                  if (tri_.enabled) tri_.length = kLen[v >> 3];
                  tri_.reloadFlag = 1;
                  break;
              case 0x400C: noise_.lenHalt = (v >> 5) & 1; noise_.constVol = (v >> 4) & 1; noise_.vol = v & 15; break;
              case 0x400E: noise_.mode = v >> 7; noise_.periodIdx = v & 15; break;
              case 0x400F:
                  if (noise_.enabled) noise_.length = kLen[v >> 3];
                  noise_.envStart = 1;
                  break;
              case 0x4010:
                  dmc_.irqEn = v >> 7; dmc_.loop = (v >> 6) & 1; dmc_.rateIdx = v & 15;
                  if (!dmc_.irqEn) dmc_.irq = 0;
                  break;
              case 0x4011: dmc_.level = v & 0x7F; break;
              case 0x4012: dmc_.sampleAddr = (u16)(0xC000 + v * 64); break;
              case 0x4013: dmc_.sampleLen = (u16)(v * 16 + 1); break;
              case 0x4015:
                  pulse_[0].enabled = v & 1; if (!pulse_[0].enabled) pulse_[0].length = 0;
                  pulse_[1].enabled = (v >> 1) & 1; if (!pulse_[1].enabled) pulse_[1].length = 0;
                  tri_.enabled = (v >> 2) & 1; if (!tri_.enabled) tri_.length = 0;
                  noise_.enabled = (v >> 3) & 1; if (!noise_.enabled) noise_.length = 0;
                  dmc_.irq = 0;
                  if (v & 0x10) {
                      dmc_.enabled = 1;
                      if (dmc_.remain == 0) { dmc_.curAddr = dmc_.sampleAddr; dmc_.remain = dmc_.sampleLen; }
                      if (!dmc_.hasBuf) ApuDmcFetch();
                  } else {
                      dmc_.enabled = 0;
                      dmc_.remain = 0;
                  }
                  break;
              case 0x4017:
                  fcMode5_ = v >> 7;
                  fcIrqInhibit_ = (v >> 6) & 1;
                  if (fcIrqInhibit_) fcIrq_ = 0;
                  fcStep_ = 0;
                  fcAcc_ = 0;
                  if (fcMode5_) { ApuQuarter(); ApuHalf(); }
                  break;
              default: break;
              }
          }

          u8 Nes::ApuReadStatus() {
              u8 r = 0;
              if (pulse_[0].length) r |= 1;
              if (pulse_[1].length) r |= 2;
              if (tri_.length) r |= 4;
              if (noise_.length) r |= 8;
              if (dmc_.remain) r |= 0x10;
              if (fcIrq_) r |= 0x40;
              if (dmc_.irq) r |= 0x80;
              fcIrq_ = 0;
              return r;
          }

          static inline void ClockEnv(u8& start, u8& div, u8& decay, u8 vol, u8 loop) {
              if (start) { start = 0; decay = 15; div = vol; }
              else if (div == 0) {
                  div = vol;
                  if (decay > 0) --decay; else if (loop) decay = 15;
              } else --div;
          }

          void Nes::ApuQuarter() {
              for (int i = 0; i < 2; ++i) {
                  PulseChan& p = pulse_[i];
                  ClockEnv(p.envStart, p.envDiv, p.envDecay, p.vol, p.lenHalt);
              }
              ClockEnv(noise_.envStart, noise_.envDiv, noise_.envDecay, noise_.vol, noise_.lenHalt);
              if (tri_.reloadFlag) tri_.linearCount = tri_.linearReload;
              else if (tri_.linearCount > 0) --tri_.linearCount;
              if (!tri_.control) tri_.reloadFlag = 0;
          }

          void Nes::ApuHalf() {
              for (int i = 0; i < 2; ++i) {
                  PulseChan& p = pulse_[i];
                  if (!p.lenHalt && p.length > 0) --p.length;
                  s32 change = p.timer >> p.sweepShift;
                  s32 target = p.sweepNeg ? (s32)p.timer - change - (i == 0 ? 1 : 0) : (s32)p.timer + change;
                  bool mute = p.timer < 8 || target > 0x7FF;
                  if (p.sweepDiv == 0 && p.sweepEn && p.sweepShift && !mute) p.timer = (u16)target;
                  if (p.sweepDiv == 0 || p.sweepReload) { p.sweepDiv = p.sweepPeriod; p.sweepReload = 0; }
                  else --p.sweepDiv;
              }
              if (!tri_.control && tri_.length > 0) --tri_.length;
              if (!noise_.lenHalt && noise_.length > 0) --noise_.length;
          }

          void Nes::ApuDmcFetch() {
              if (dmc_.hasBuf || dmc_.remain == 0) return;
              dmc_.buf = Read(dmc_.curAddr);
              dmc_.hasBuf = 1;
              dotBudget_ -= 4 * 3;
              cpuCycles_ += 4;
              dmc_.curAddr = (u16)((dmc_.curAddr + 1) | 0x8000);
              if (--dmc_.remain == 0) {
                  if (dmc_.loop) { dmc_.curAddr = dmc_.sampleAddr; dmc_.remain = dmc_.sampleLen; }
                  else if (dmc_.irqEn) dmc_.irq = 1;
              }
          }

          void Nes::ApuDmcBit() {
              if (!dmc_.silence) {
                  if (dmc_.shiftReg & 1) { if (dmc_.level <= 125) dmc_.level = (u8)(dmc_.level + 2); }
                  else { if (dmc_.level >= 2) dmc_.level = (u8)(dmc_.level - 2); }
                  dmc_.shiftReg >>= 1;
              }
              if (--dmc_.bitsLeft == 0) {
                  dmc_.bitsLeft = 8;
                  if (dmc_.hasBuf) {
                      dmc_.shiftReg = dmc_.buf;
                      dmc_.hasBuf = 0;
                      dmc_.silence = 0;
                      ApuDmcFetch();
                  } else {
                      dmc_.silence = 1;
                  }
              }
          }

          void Nes::ApuSample() {
              // frame sequencer
              fcAcc_ += kCpuPerSample16;
              while (fcAcc_ >= kFrameStep16) {
                  fcAcc_ -= kFrameStep16;
                  if (!fcMode5_) {
                      switch (fcStep_) {
                      case 0: ApuQuarter(); break;
                      case 1: ApuQuarter(); ApuHalf(); break;
                      case 2: ApuQuarter(); break;
                      default: ApuQuarter(); ApuHalf(); if (!fcIrqInhibit_) fcIrq_ = 1; break;
                      }
                      fcStep_ = (u8)((fcStep_ + 1) & 3);
                  } else {
                      switch (fcStep_) {
                      case 0: ApuQuarter(); break;
                      case 1: ApuQuarter(); ApuHalf(); break;
                      case 2: ApuQuarter(); break;
                      case 3: break;
                      default: ApuQuarter(); ApuHalf(); break;
                      }
                      fcStep_ = (u8)(fcStep_ + 1);
                      if (fcStep_ >= 5) fcStep_ = 0;
                  }
              }

              // pulse
              int mix = 0;
              int pv[2];
              for (int i = 0; i < 2; ++i) {
                  PulseChan& p = pulse_[i];
                  u32 period16 = (u32)((p.timer + 1) * 2) << 16;
                  p.acc += kCpuPerSample16;
                  if (p.acc >= period16) {
                      u32 n = p.acc / period16;
                      p.acc -= n * period16;
                      p.phase = (u8)((p.phase + n) & 7);
                  }
                  s32 change = p.timer >> p.sweepShift;
                  s32 target = p.sweepNeg ? (s32)p.timer - change - (i == 0 ? 1 : 0) : (s32)p.timer + change;
                  if (p.length == 0 || p.timer < 8 || target > 0x7FF || !((kDuty[p.duty] >> (7 - p.phase)) & 1)) pv[i] = 0;
                  else pv[i] = p.constVol ? p.vol : p.envDecay;
              }
              mix = pv[0] + pv[1];

              // triangle
              {
                  u32 period16 = (u32)(tri_.timer + 1) << 16;
                  tri_.acc += kCpuPerSample16;
                  if (tri_.acc >= period16) {
                      u32 n = tri_.acc / period16;
                      tri_.acc -= n * period16;
                      if (tri_.length > 0 && tri_.linearCount > 0) tri_.phase = (u8)((tri_.phase + n) & 31);
                  }
                  if (tri_.timer >= 2) tri_.out = tri_.phase < 16 ? (u8)(15 - tri_.phase) : (u8)(tri_.phase - 16);
              }

              // noise
              {
                  u32 period16 = (u32)kNoisePeriod[noise_.periodIdx] << 16;
                  noise_.acc += kCpuPerSample16;
                  if (noise_.acc >= period16) {
                      u32 n = noise_.acc / period16;
                      noise_.acc -= n * period16;
                      while (n--) {
                          u16 fb = (u16)((noise_.shift & 1) ^ ((noise_.shift >> (noise_.mode ? 6 : 1)) & 1));
                          noise_.shift = (u16)((noise_.shift >> 1) | (fb << 14));
                      }
                  }
                  if (noise_.length == 0 || (noise_.shift & 1)) noise_.out = 0;
                  else noise_.out = noise_.constVol ? noise_.vol : noise_.envDecay;
              }

              // DMC
              {
                  u32 period16 = (u32)kDmcRate[dmc_.rateIdx] << 16;
                  dmc_.acc += kCpuPerSample16;
                  while (dmc_.acc >= period16) { dmc_.acc -= period16; ApuDmcBit(); }
              }

              s32 x = kPulseMix[mix] + kTndMix[tri_.out * 3 + noise_.out * 2 + dmc_.level];
              hpOut_ = x - hpPrev_ + hpOut_ - (hpOut_ >> 7);
              hpPrev_ = x;
              s32 s = (hpOut_ * 3) >> 2;
              if (s > 32767) s = 32767;
              if (s < -32768) s = -32768;
              if (audioCount_ < kAudioRing) {
                  audio_[audioHead_] = (s16)s;
                  audioHead_ = (audioHead_ + 1) & (kAudioRing - 1);
                  ++audioCount_;
              }
          }

          void Nes::ApuRunLine(s32 dots) {
              dotAcc_ += dots * 256;
              while (dotAcc_ >= kDotsPerSample256) {
                  dotAcc_ -= kDotsPerSample256;
                  ApuSample();
              }
          }

          int Nes::ReadAudio(s16* dst, int maxSamples) {
              int n = 0;
              while (n < maxSamples && audioCount_ > 0) {
                  dst[n++] = audio_[audioTail_];
                  audioTail_ = (audioTail_ + 1) & (kAudioRing - 1);
                  --audioCount_;
              }
              return n;
          }

