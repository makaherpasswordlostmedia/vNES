          #!/usr/bin/env python3
          """Generates core/nes_cpu_table.h: 6502 opcode -> (op, addressing mode, page-cross-penalty)."""
          import sys
          modes = ["IMP","ACC","IMM","ZP","ZPX","ZPY","ABS","ABX","ABY","IND","IZX","IZY","REL"]
          M = {m:i for i,m in enumerate(modes)}
          ops = {}
          def add(name, **kw):
              for mode, code in kw.items():
                  ops.setdefault(name, {})[mode.upper()] = code
          rw = lambda name, imm, zp, zpx, abs_, abx, aby, izx, izy: add(name, IMM=imm, ZP=zp, ZPX=zpx, ABS=abs_, ABX=abx, ABY=aby, IZX=izx, IZY=izy)
          add("ADC", IMM=0x69, ZP=0x65, ZPX=0x75, ABS=0x6D, ABX=0x7D, ABY=0x79, IZX=0x61, IZY=0x71)
          add("AND", IMM=0x29, ZP=0x25, ZPX=0x35, ABS=0x2D, ABX=0x3D, ABY=0x39, IZX=0x21, IZY=0x31)
          add("ASL", ACC=0x0A, ZP=0x06, ZPX=0x16, ABS=0x0E, ABX=0x1E)
          add("BCC", REL=0x90); add("BCS", REL=0xB0); add("BEQ", REL=0xF0); add("BMI", REL=0x30)
          add("BNE", REL=0xD0); add("BPL", REL=0x10); add("BVC", REL=0x50); add("BVS", REL=0x70)
          add("BIT", ZP=0x24, ABS=0x2C); add("BRK", IMP=0x00)
          add("CLC", IMP=0x18); add("CLD", IMP=0xD8); add("CLI", IMP=0x58); add("CLV", IMP=0xB8)
          add("CMP", IMM=0xC9, ZP=0xC5, ZPX=0xD5, ABS=0xCD, ABX=0xDD, ABY=0xD9, IZX=0xC1, IZY=0xD1)
          add("CPX", IMM=0xE0, ZP=0xE4, ABS=0xEC); add("CPY", IMM=0xC0, ZP=0xC4, ABS=0xCC)
          add("DEC", ZP=0xC6, ZPX=0xD6, ABS=0xCE, ABX=0xDE); add("DEX", IMP=0xCA); add("DEY", IMP=0x88)
          add("EOR", IMM=0x49, ZP=0x45, ZPX=0x55, ABS=0x4D, ABX=0x5D, ABY=0x59, IZX=0x41, IZY=0x51)
          add("INC", ZP=0xE6, ZPX=0xF6, ABS=0xEE, ABX=0xFE); add("INX", IMP=0xE8); add("INY", IMP=0xC8)
          add("JMP", ABS=0x4C, IND=0x6C); add("JSR", ABS=0x20)
          add("LDA", IMM=0xA9, ZP=0xA5, ZPX=0xB5, ABS=0xAD, ABX=0xBD, ABY=0xB9, IZX=0xA1, IZY=0xB1)
          add("LDX", IMM=0xA2, ZP=0xA6, ZPY=0xB6, ABS=0xAE, ABY=0xBE)
          add("LDY", IMM=0xA0, ZP=0xA4, ZPX=0xB4, ABS=0xAC, ABX=0xBC)
          add("LSR", ACC=0x4A, ZP=0x46, ZPX=0x56, ABS=0x4E, ABX=0x5E)
          add("NOP", IMP=0xEA)
          add("ORA", IMM=0x09, ZP=0x05, ZPX=0x15, ABS=0x0D, ABX=0x1D, ABY=0x19, IZX=0x01, IZY=0x11)
          add("PHA", IMP=0x48); add("PHP", IMP=0x08); add("PLA", IMP=0x68); add("PLP", IMP=0x28)
          add("ROL", ACC=0x2A, ZP=0x26, ZPX=0x36, ABS=0x2E, ABX=0x3E)
          add("ROR", ACC=0x6A, ZP=0x66, ZPX=0x76, ABS=0x6E, ABX=0x7E)
          add("RTI", IMP=0x40); add("RTS", IMP=0x60)
          add("SBC", IMM=0xE9, ZP=0xE5, ZPX=0xF5, ABS=0xED, ABX=0xFD, ABY=0xF9, IZX=0xE1, IZY=0xF1)
          add("SEC", IMP=0x38); add("SED", IMP=0xF8); add("SEI", IMP=0x78)
          add("STA", ZP=0x85, ZPX=0x95, ABS=0x8D, ABX=0x9D, ABY=0x99, IZX=0x81, IZY=0x91)
          add("STX", ZP=0x86, ZPY=0x96, ABS=0x8E); add("STY", ZP=0x84, ZPX=0x94, ABS=0x8C)
          add("TAX", IMP=0xAA); add("TAY", IMP=0xA8); add("TSX", IMP=0xBA); add("TXA", IMP=0x8A)
          add("TXS", IMP=0x9A); add("TYA", IMP=0x98)
          # unofficial
          add("LAX", ZP=0xA7, ZPY=0xB7, ABS=0xAF, ABY=0xBF, IZX=0xA3, IZY=0xB3)
          add("SAX", ZP=0x87, ZPY=0x97, ABS=0x8F, IZX=0x83)
          add("DCP", ZP=0xC7, ZPX=0xD7, ABS=0xCF, ABX=0xDF, ABY=0xDB, IZX=0xC3, IZY=0xD3)
          add("ISB", ZP=0xE7, ZPX=0xF7, ABS=0xEF, ABX=0xFF, ABY=0xFB, IZX=0xE3, IZY=0xF3)
          add("SLO", ZP=0x07, ZPX=0x17, ABS=0x0F, ABX=0x1F, ABY=0x1B, IZX=0x03, IZY=0x13)
          add("RLA", ZP=0x27, ZPX=0x37, ABS=0x2F, ABX=0x3F, ABY=0x3B, IZX=0x23, IZY=0x33)
          add("SRE", ZP=0x47, ZPX=0x57, ABS=0x4F, ABX=0x5F, ABY=0x5B, IZX=0x43, IZY=0x53)
          add("RRA", ZP=0x67, ZPX=0x77, ABS=0x6F, ABX=0x7F, ABY=0x7B, IZX=0x63, IZY=0x73)
          ops.setdefault("SBC", {})["IMM2"] = 0xEB
          add("NOPU", IMP=0x1A)  # placeholder, filled below

          table = {}
          for name, d in ops.items():
              if name == "NOPU": continue
              for mode, code in d.items():
                  m = "IMM" if mode == "IMM2" else mode
                  assert code not in table, hex(code)
                  table[code] = (name, m)
          # unofficial NOPs
          for c in (0x1A,0x3A,0x5A,0x7A,0xDA,0xFA): table[c] = ("NOP","IMP")
          for c in (0x80,0x82,0x89,0xC2,0xE2): table[c] = ("NOP","IMM")
          for c in (0x04,0x44,0x64): table[c] = ("NOP","ZP")
          for c in (0x14,0x34,0x54,0x74,0xD4,0xF4): table[c] = ("NOP","ZPX")
          table[0x0C] = ("NOP","ABS")
          for c in (0x1C,0x3C,0x5C,0x7C,0xDC,0xFC): table[c] = ("NOP","ABX")
          # remaining undocumented opcodes: treated as NOP (immediate-sized where applicable)
          for c in (0x0B,0x2B,0x4B,0x6B,0x8B,0xAB,0xCB): table[c] = ("NOP","IMM")
          for c in range(256):
              if c not in table:
                  table[c] = ("NOP", "ABS" if c in (0x9C,0x9E,0x9B,0x9F,0xBB) else ("IZY" if c==0x93 else "IMP"))
          opnames = sorted({n for n,_ in table.values()})
          penalty_ops = {"ADC","AND","CMP","EOR","LDA","LDX","LDY","ORA","SBC","LAX","NOP"}
          out = ["// Generated by tools/gen_cpu_table.py - do not edit", "#ifndef NES_CPU_TABLE_H", "#define NES_CPU_TABLE_H", "namespace nes {", "enum CpuOp {"]
          out.append("    " + ", ".join("OP_"+n for n in opnames) + ",")
          out.append("    OP_COUNT };")
          out.append("enum CpuMode { " + ", ".join("AM_"+m for m in modes) + " };")
          out.append("struct OpInfo { unsigned char op, mode, penalty; };")
          out.append("static const OpInfo kOpTable[256] = {")
          for c in range(256):
              n, m = table[c]
              pen = 1 if (n in penalty_ops and m in ("ABX","ABY","IZY")) else 0
              out.append("    {OP_%s, AM_%s, %d},%s" % (n, m, pen, "" if c%16!=15 else ""))
          out.append("};")
          cyc = [7,6,2,8,3,3,5,5,3,2,2,2,4,4,6,6, 2,5,2,8,4,4,6,6,2,4,2,7,4,4,7,7,
                 6,6,2,8,3,3,5,5,4,2,2,2,4,4,6,6, 2,5,2,8,4,4,6,6,2,4,2,7,4,4,7,7,
                 6,6,2,8,3,3,5,5,3,2,2,2,3,4,6,6, 2,5,2,8,4,4,6,6,2,4,2,7,4,4,7,7,
                 6,6,2,8,3,3,5,5,4,2,2,2,5,4,6,6, 2,5,2,8,4,4,6,6,2,4,2,7,4,4,7,7,
                 2,6,2,6,3,3,3,3,2,2,2,2,4,4,4,4, 2,6,2,6,4,4,4,4,2,5,2,5,5,5,5,5,
                 2,6,2,6,3,3,3,3,2,2,2,2,4,4,4,4, 2,5,2,5,4,4,4,4,2,4,2,4,4,4,4,4,
                 2,6,2,8,3,3,5,5,2,2,2,2,4,4,6,6, 2,5,2,8,4,4,6,6,2,4,2,7,4,4,7,7,
                 2,6,2,8,3,3,5,5,2,2,2,2,4,4,6,6, 2,5,2,8,4,4,6,6,2,4,2,7,4,4,7,7]
          assert len(cyc)==256
          out.append("static const unsigned char kCycles[256] = {")
          for i in range(0,256,16): out.append("    " + ",".join(str(x) for x in cyc[i:i+16]) + ",")
          out.append("};")
          out.append("}\n#endif")
          open(sys.argv[1] if len(sys.argv)>1 else "../core/nes_cpu_table.h","w").write("\n".join(out)+"\n")
